[mod-name]
mycelian-stats=Mycelian Stats

[mod-description]
mycelian-stats=Exports factory statistics for the Mycelian overlay. Read-only; no gameplay changes.

[mod-setting-name]
mycelian-export-interval=Export interval (ticks)
mycelian-export-fluids=Export fluid production

[mod-setting-description]
mycelian-export-interval=How often stats are written to script-output/mycelian/stats.json. 60 ticks = 1 second.
mycelian-export-fluids=Include fluid production and consumption in the export.
