<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Controls</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script src="/assets/default_assets/mycelian_toast.js"></script>
    <script>MycelianLog.init({ templateName: 'source_controls' });</script>
    <!-- Shared with the app's Source Controls tab (modules/uiwindows/sourcecontrols.py). -->
    <link rel="stylesheet" href="/assets/default_assets/source_controls.css">
    <style>
        /* Dock-only bits; everything else comes from source_controls.css. */
        html, body { margin: 0; }
        body { background: var(--color-bg-base); color: var(--color-text-primary); min-height: 100vh; overflow-x: hidden; }
        .scx.is-dock { padding: 8px; }
        .scx.is-dock .scx-shell { overflow: visible; } /* else the sticky header sticks to the shell, not the page */
        .scx.is-dock .scx-head { position: sticky; top: 8px; z-index: 5; box-shadow: 0 -8px 0 var(--color-bg-base); flex-wrap: nowrap; }
        .scx.is-dock .scx-search { flex: 1 1 0; }
        .scx-pill.is-warn { --st: var(--color-warning); }
        .scx button.scx-switch { border: 0; padding: 0; font: inherit; }
        .scx button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
        .scx-stepper input { min-width: 0; }
        .scx-msg { padding: 28px 12px; text-align: center; font-size: .8rem; color: var(--color-text-muted); }
        .scx-msg strong { display: block; margin-bottom: 4px; font-size: .86rem; color: var(--color-text-secondary); }

        /* Tooltip (one fixed element, see initTooltips): native title tooltips are unreliable in OBS docks. */
        .scx-tip { position: fixed; z-index: 1000; max-width: 220px; padding: 4px 8px; border-radius: 6px; pointer-events: none;
            font-size: .68rem; line-height: 1.3; color: var(--color-text-primary); background: var(--color-bg-elevated);
            border: 1px solid var(--color-border-default); box-shadow: 0 4px 12px var(--color-bg-overlay); }
    </style>
</head>
<body>
    <div class="scx is-dock">
        <div class="scx-shell">
            <div class="scx-head">
                <label class="scx-search">
                    <svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input id="scSearch" type="text" placeholder="Search" aria-label="Search templates and controls" autocomplete="off" spellcheck="false">
                </label>
                <span class="scx-pill is-warn" id="scStatus" role="status" data-tooltip="Connecting to Mycelian…"><span class="dot"></span><span id="scStatusText">Connecting…</span></span>
                <button class="scx-hbtn is-icon" type="button" id="scRefresh" aria-label="Refresh" data-tooltip="Reload the controls">
                    <svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
            <div class="scx-body">
                <div class="scx-msg" id="scMessage"><strong>Loading controls…</strong>Reading your template configurations</div>
                <div class="scx-grid" id="controlsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket broadcasting
        let broadcastSocket = null;
        let broadcastStatus = 'ready';
        let everConnected = false;

        // Template configurations (GET /api/template-configs: live runtime values)
        let templateConfigs = {};

        // Material icons as inline SVG: OBS docks can be offline, so no icon font.
        const ICON_PATHS = {
            info_outline: 'M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z',
            restart_alt: 'M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 2.97-2.17 5.43-5 5.91v2.02c3.95-.49 7-3.85 7-7.93 0-4.42-3.58-8-8-8zm-6 8c0-1.65.67-3.15 1.76-4.24L6.34 7.34C4.9 8.79 4 10.79 4 13c0 4.08 3.05 7.44 7 7.93v-2.02c-2.83-.48-5-2.94-5-5.91z',
            play_arrow: 'M8 5v14l11-7z',
            pause: 'M6 19h4V5H6v14zm8-14v14h4V5h-4z',
            campaign: 'M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z'
        };

        function icon(name) {
            return '<svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' + ICON_PATHS[name] + '"/></svg>';
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            initializeBroadcastSocket();
            bindControlEvents();
            initTooltips();
            document.getElementById('scSearch').addEventListener('input', applySearch);
            document.getElementById('scRefresh').addEventListener('click', refreshControls);
            loadTemplateConfigs();
        });

        function initializeBroadcastSocket() {
            try {
                // Initialize WebSocket for broadcasting to other sources
                // This will broadcast events to templates that are listening
                // Use the same connection format as other templates for consistency
                broadcastSocket = MycelianOverlay.connect('http://' + document.domain + ':' + location.port);

                broadcastSocket.on('connect', function() {
                    console.log('Broadcast socket connected');
                    console.log('Source controls socket ID:', broadcastSocket.id);
                    updateBroadcastStatus('connected');

                    // Request current theme on connect
                    broadcastSocket.emit('get_current_theme');
                    broadcastSocket.emit('get_notify_settings');
                });

                broadcastSocket.on('template_config_updated', function () {
                    loadTemplateConfigs();
                });

                // Live values changed (runtime DB / persisted control): refresh in place.
                broadcastSocket.on('source_controls_state_update', function (payload) {
                    queueLiveValueRefresh(payload);
                });

                broadcastSocket.on('notify_settings', function (settings) {
                    if (window.MycelianToast && settings) { MycelianToast.configure(Object.assign({}, settings, { dock: true })); }
                });

                // Theme update handler - replaces the theme CSS variables the server
                // injected into <style id="mycelian-theme-vars"> on first paint.
                broadcastSocket.on('theme_update', function(data) {
                    if (data && data.css) {
                        var style = document.getElementById('mycelian-theme-vars');
                        if (!style) {
                            style = document.createElement('style');
                            style.id = 'mycelian-theme-vars';
                            document.head.insertBefore(style, document.head.firstChild);
                        }
                        style.textContent = data.css;
                        if (data.theme_type) { document.documentElement.setAttribute('data-theme-type', data.theme_type); }
                        console.log('Theme updated:', data.theme_name, '(' + data.theme_type + ')');
                    }
                });

                broadcastSocket.on('disconnect', function() {
                    console.log('Broadcast socket disconnected');
                    updateBroadcastStatus('disconnected');
                });

                broadcastSocket.on('connect_error', function(error) {
                    console.debug('Broadcast connection not available:', error);
                    updateBroadcastStatus('standalone');
                });

                // Set initial status
                if (!broadcastSocket.connected) { updateBroadcastStatus('standalone'); }

            } catch (error) {
                console.debug('WebSocket not available, running in standalone mode:', error);
                updateBroadcastStatus('standalone');
            }
        }

        function updateBroadcastStatus(status) {
            broadcastStatus = status;
            const ok = status === 'connected';
            if (ok) { everConnected = true; }
            const pill = document.getElementById('scStatus');
            const text = document.getElementById('scStatusText');
            if (pill && text) {
                pill.classList.toggle('is-ok', ok);
                pill.classList.toggle('is-warn', !ok);
                text.textContent = ok ? 'Live' : (everConnected ? 'Reconnecting…' : 'Connecting…');
                pill.setAttribute('data-tooltip', ok
                    ? 'Connected to Mycelian'
                    : 'Not connected to Mycelian yet: controls can\'t be sent until it reconnects');
            }
            console.log(`Broadcast status: ${status}`);
        }

        async function loadTemplateConfigs() {
            try {
                // Load template configurations from the server API
                templateConfigs = await fetchTemplateConfigs();
                renderControls();

            } catch (error) {
                console.error('Error loading template configs:', error);
                showError('Failed to load template configurations');
            }
        }

        async function fetchTemplateConfigsFromServer() {
            // Cache-busting: the live values change without the URL changing.
            const response = await fetch('/api/template-configs?_=' + Date.now(), { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.json();
        }

        async function fetchTemplateConfigs() {
            // Fetch template configurations from the server API
            try {
                console.log('Fetching template configs from server...');
                const configs = await fetchTemplateConfigsFromServer();
                console.log('Successfully loaded template configs from server:', Object.keys(configs));
                return configs;

            } catch (error) {
                console.error('Error fetching template configs from server:', error);

                // Fall back to embedded configs if server fetch fails
                console.log('Falling back to embedded configs...');
                return getEmbeddedConfigs();
            }
        }

        function getEmbeddedConfigs() {
            // Fallback embedded template configs with dynamic controls
            // This serves as a backup if the server endpoint is not available
            const embeddedConfigs = {
                counter: {
                    elements: [
                        {
                            type: "counter_control",
                            id: "counter_controls",
                            label: "Counter Controls",
                            description: "Increment, decrement, or reset the counter",
                            action_increment: "counter_increment",
                            action_decrement: "counter_decrement",
                            action_reset: "counter_reset"
                        },
                        {
                            type: "text_input",
                            id: "counter_message",
                            label: "Set Counter Message",
                            description: "Update the counter message text",
                            placeholder: "Enter new message...",
                            action: "counter_message"
                        },
                        {
                            type: "number_input",
                            id: "counter_value",
                            label: "Set Counter Value",
                            description: "Set the counter to a specific value",
                            min: 0,
                            max: 999999,
                            value: 0,
                            action: "counter_update"
                        }
                    ]
                },
                roulette: {
                    elements: [
                        {
                            type: "spin_control",
                            id: "spin_wheel",
                            label: "Spin Wheel",
                            description: "Spin the roulette wheel",
                            action: "spin"
                        },
                        {
                            type: "button",
                            id: "reset_wheel",
                            label: "Reset Wheel",
                            description: "Reset the wheel to its starting position",
                            button_text: "Reset",
                            action: "reset",
                            data: {}
                        },
                        {
                            type: "text_input",
                            id: "add_option",
                            label: "Add Option",
                            description: "Add a new option to the wheel",
                            placeholder: "Enter new option...",
                            action: "add_option"
                        },
                        {
                            type: "button",
                            id: "clear_options",
                            label: "Clear All Options",
                            description: "Remove all options from the wheel",
                            button_text: "Clear All",
                            action: "clear_options",
                            data: {}
                        }
                    ]
                },
                memecalc: {
                    elements: [
                        {
                            type: "button",
                            id: "memecalc_reset",
                            label: "Reset Calculator",
                            description: "Reset the bit calculator to zero",
                            button_text: "Reset",
                            action: "reset",
                            data: {}
                        },
                        {
                            type: "number_input",
                            id: "memecalc_set",
                            label: "Set Bit Count",
                            description: "Set the bit calculator to a specific value",
                            min: 0,
                            max: 999999,
                            value: 0,
                            action: "update"
                        },
                        {
                            type: "number_input",
                            id: "memecalc_add",
                            label: "Add Bits",
                            description: "Add a specific amount of bits to the calculator",
                            min: 1,
                            max: 10000,
                            value: 100,
                            action: "add_bits"
                        }
                    ]
                }
            };

            console.log('Using embedded fallback configs:', Object.keys(embeddedConfigs));
            return embeddedConfigs;
        }

        /* ---------- Rendering (same markup as modules/uiwindows/sourcecontrols.py) ---------- */

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function tooltipAttr(text) {
            if (!text) {
                return '';
            }
            return ` data-tooltip="${escapeHtml(text)}"`;
        }

        function resolveButtonText(element) {
            if (element.button_text) {
                return element.button_text;
            }
            if (element.label) {
                return element.label;
            }
            const action = String(element.action || '').trim();
            if (action) {
                return action.replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
            }
            return 'Run';
        }

        function buttonTooltip(element) {
            if (element.description) {
                return element.description;
            }
            const label = element.label || '';
            const text = resolveButtonText(element);
            if (label && label !== text) {
                return label;
            }
            return '';
        }

        function isButtonLike(element) {
            return element.type === 'button' || element.type === 'spin_control';
        }

        function isSpin(element) {
            return element.type === 'spin_control' || element.action === 'spin';
        }

        function controlElements(config) {
            return ((config && config.elements) || []).filter(function (e) { return e && typeof e === 'object'; });
        }

        function sortedTemplateNames(configs) {
            return Object.keys(configs).sort(function (a, b) {
                const x = a.toLowerCase();
                const y = b.toLowerCase();
                return x < y ? -1 : (x > y ? 1 : (a < b ? -1 : (a > b ? 1 : 0)));
            });
        }

        // Port of modules/spore_studio/spore_data_codegen.py _slugify_id / timer_control_event.
        function slugifyId(value) {
            const slug = String(value || '').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '');
            return slug || 'el';
        }

        function timerControlEvent(elementId, operation) {
            let op = String(operation || 'start').trim().toLowerCase();
            if (op !== 'start' && op !== 'pause' && op !== 'reset') {
                op = 'start';
            }
            return `${slugifyId(elementId)}_${op}`;
        }

        function labelHtml(element, fallback) {
            const text = element.label || fallback || element.id || '';
            const info = element.description ? icon('info_outline') : '';
            return `<div class="scx-label"${tooltipAttr(element.description)}><span>${escapeHtml(text)}</span>${info}</div>`;
        }

        function describedAttr(element) {
            return element.description ? ` aria-description="${escapeHtml(element.description)}"` : '';
        }

        // Display values; also the "server value" stamp used by live in-place updates.
        function toggleValue(element) {
            const value = element.value !== undefined ? element.value : (element.default_state !== undefined ? element.default_state : false);
            return !!value;
        }
        function numberValue(element) { return String(element.value || 0); }
        function textValue(element) { return String(element.value == null ? '' : element.value); }
        function sliderMin(element) { return Number(element.min || 0); }
        function sliderMax(element) { return Number(element.max || 100); }
        function sliderValue(element) { return String(element.value || sliderMin(element)); }
        function sliderPercent(min, max, value) {
            const span = (max - min) || 1;
            return Math.max(0, Math.min(100, (Number(value) - min) / span * 100));
        }

        function getCounterStepValue(element) {
            const raw = element.step != null ? element.step : (element.value != null ? element.value : 1);
            const n = parseInt(String(raw), 10);
            return isNaN(n) || n < 1 ? 1 : n;
        }

        function buttonsHtml(buttons) {
            const items = buttons.map(function (b, i) {
                const element = b.element;
                const spin = isSpin(element);
                const wide = buttons.length % 2 === 1 && i === buttons.length - 1 ? ' is-wide' : '';
                const text = spin && !element.button_text ? 'Spin' : resolveButtonText(element);
                let action = element.action || '';
                let payload = element.data || {};
                let tip = buttonTooltip(element);
                if (element.type === 'spin_control') {
                    action = element.action || 'spin';
                    payload = {};
                    tip = element.description || element.label || 'Spin the wheel';
                }
                return `<button class="scx-btn${spin ? ' is-spin' : ''}${wide}" type="button"${tooltipAttr(tip)}`
                    + ` data-sc-kind="ws-click" data-sc-action="${escapeHtml(action)}"`
                    + ` data-sc-payload="${escapeHtml(JSON.stringify(payload))}">${escapeHtml(text)}</button>`;
            });
            return `<div class="scx-btns">${items.join('')}</div>`;
        }

        function controlHtml(element, index) {
            const type = element.type || 'unknown';
            const label = element.label || element.id || '';
            const aria = ` aria-label="${escapeHtml(label)}"`;
            const action = escapeHtml(element.action || '');
            const idx = ` data-sc-index="${index}"`;

            if (type === 'toggle') {
                const on = toggleValue(element);
                return `<div class="scx-row">${labelHtml(element)}<button class="scx-switch${on ? ' is-on' : ''}" type="button" role="switch"`
                    + ` aria-checked="${on}"${aria}${describedAttr(element)}${idx} data-sv="${on ? 1 : 0}"`
                    + ` data-sc-kind="ws-toggle" data-sc-action="${action}"></button></div>`;
            }
            if (type === 'number_input') {
                const min = element.min || 0;
                const max = element.max || 999999;
                const value = numberValue(element);
                return `<div class="scx-row">${labelHtml(element)}<input class="scx-input is-num" type="number"`
                    + ` min="${escapeHtml(min)}" max="${escapeHtml(max)}" value="${escapeHtml(value)}"${aria}${describedAttr(element)}${idx}`
                    + ` data-sv="${escapeHtml(value)}" data-sc-kind="ws-input-int" data-sc-action="${action}"></div>`;
            }
            if (type === 'text_input') {
                const value = textValue(element);
                return `<div class="scx-field">${labelHtml(element)}<input class="scx-input is-text" type="text" autocomplete="off" spellcheck="false"`
                    + ` placeholder="${escapeHtml(element.placeholder || '')}" value="${escapeHtml(value)}"${aria}${describedAttr(element)}${idx}`
                    + ` data-sv="${escapeHtml(value)}" data-sc-kind="ws-text" data-sc-action="${action}"></div>`;
            }
            if (type === 'slider') {
                const min = sliderMin(element);
                const max = sliderMax(element);
                const value = sliderValue(element);
                const step = element.step || 1;
                return `<div class="scx-field"><div class="scx-row">${labelHtml(element)}<span class="scx-count" data-sc-chip>${escapeHtml(value)}</span></div>`
                    + `<input class="scx-range" type="range" min="${min}" max="${max}" step="${escapeHtml(step)}" value="${escapeHtml(value)}"`
                    + ` style="--p:${sliderPercent(min, max, value)}%"${aria}${describedAttr(element)}${idx}`
                    + ` data-sv="${escapeHtml(value)}" data-sc-kind="ws-input-value" data-sc-action="${action}"></div>`;
            }
            if (type === 'counter_control') {
                return counterHtml(element);
            }
            if (type === 'timer_control') {
                const target = escapeHtml(String(element.target_timer_id || ''));
                const name = escapeHtml(element.label || 'timer');
                const seg = (op, cls, inner, ariaLabel) => `<button type="button" class="${cls}" aria-label="${ariaLabel} ${name}"`
                    + ` data-sc-kind="timer" data-sc-operation="${op}" data-sc-target="${target}">${inner}</button>`;
                return `<div class="scx-row">${labelHtml(element, 'Timer')}<div class="scx-seg">`
                    + seg('start', 'go', icon('play_arrow') + 'Start', 'Start')
                    + seg('pause', 'pause', icon('pause') + 'Stop', 'Stop')
                    + seg('reset', '', icon('restart_alt'), 'Reset')
                    + `</div></div>`;
            }
            if (type === 'banner_control') {
                const duration = Number(element.duration != null ? element.duration : 10);
                const min = element.min != null ? element.min : 0;
                const max = element.max != null ? element.max : 3600;
                const bannerAction = escapeHtml(element.action || 'display_banner');
                return `<div class="scx-banner" data-sc-banner-root="${escapeHtml(element.id || 'banner')}">${labelHtml(element)}`
                    + `<input class="scx-input is-text" type="text" data-sc-banner-message placeholder="${escapeHtml(element.placeholder || 'Banner message')}"`
                    + ` aria-label="${escapeHtml(label || 'Banner')} message" autocomplete="off">`
                    + `<div class="scx-banner-opts"><input class="scx-input" type="number" data-sc-banner-duration min="${escapeHtml(min)}" max="${escapeHtml(max)}"`
                    + ` value="${escapeHtml(duration)}" aria-label="Duration in seconds"> s<span class="scx-spacer"></span>`
                    + `<button class="scx-switch" type="button" role="switch" aria-checked="false" aria-label="Permanent" data-sc-banner-permanent data-sc-kind="banner-permanent"></button> Permanent</div>`
                    + `<div class="scx-btns"><button class="scx-btn" type="button" data-sc-kind="banner-show" data-sc-action="${bannerAction}">${icon('campaign')}Show</button>`
                    + `<button class="scx-btn is-plain" type="button" data-sc-kind="banner-clear" data-sc-action="${bannerAction}">Clear</button></div></div>`;
            }
            return `<div class="scx-label">Unknown control type: ${escapeHtml(type)}</div>`;
        }

        function counterHtml(element) {
            const name = escapeHtml(element.label || 'counter');
            const reset = (attrs) => `<button class="scx-iconbtn" type="button" aria-label="Reset ${name}" data-tooltip="Reset"${attrs}>${icon('restart_alt')}</button>`;
            let stepper;
            let resetBtn;
            if (element.target_counter_id) {
                // Spore counter: amount box + one action with an operation.
                const step = getCounterStepValue(element);
                const attrs = ` data-sc-kind="spore-counter" data-sc-action="${escapeHtml(element.action || 'counter_adjust')}"`
                    + ` data-sc-counter-id="${escapeHtml(element.target_counter_id)}" data-sc-step="${step}"`;
                stepper = `<button class="minus" type="button" aria-label="Decrease ${name}"${attrs} data-sc-operation="decrement">−</button>`
                    + `<input type="text" inputmode="numeric" value="${step}" aria-label="Amount" data-sc-counter-amount>`
                    + `<button class="plus" type="button" aria-label="Increase ${name}"${attrs} data-sc-operation="increment">+</button>`;
                resetBtn = reset(`${attrs} data-sc-operation="reset"`);
            } else {
                // Legacy counter: three actions, empty payloads.
                const ws = (a) => ` data-sc-kind="ws-click" data-sc-action="${escapeHtml(a)}" data-sc-payload="{}"`;
                stepper = `<button class="minus" type="button" aria-label="Decrease ${name}"${ws(element.action_decrement || 'counter_decrement')}>−</button>`
                    + `<button class="plus" type="button" aria-label="Increase ${name}"${ws(element.action_increment || 'counter_increment')}>+</button>`;
                resetBtn = reset(ws(element.action_reset || 'counter_reset'));
            }
            return `<div class="scx-row">${labelHtml(element, 'Counter')}<div class="scx-tools"><div class="scx-stepper">${stepper}</div>${resetBtn}</div></div>`;
        }

        function searchText(templateName, elements) {
            const parts = [templateName];
            elements.forEach(function (e) {
                if (e.label) { parts.push(e.label); }
                if (isButtonLike(e)) { parts.push(isSpin(e) && !e.button_text ? 'Spin' : resolveButtonText(e)); }
                else if (e.button_text) { parts.push(e.button_text); }
            });
            return parts.join('\n').toLowerCase();
        }

        function renderTemplateCard(templateName, controlsConfig) {
            const elements = controlElements(controlsConfig);
            let body = '';
            let buttons = [];
            const flush = function () {
                if (buttons.length) { body += buttonsHtml(buttons); }
                buttons = [];
            };
            // Template order; consecutive buttons share one 2-column grid.
            elements.forEach(function (element, index) {
                if (isButtonLike(element)) {
                    buttons.push({ element: element, index: index });
                    return;
                }
                flush();
                body += controlHtml(element, index);
            });
            flush();
            const n = elements.length;
            const countText = `${n} control${n === 1 ? '' : 's'}`;
            const hidden = controlsConfig && controlsConfig.hidden ? '<span class="scx-tag" data-tooltip="Hidden in Source Settings">Hidden</span>' : '';
            return `<section class="scx-card" data-template="${escapeHtml(templateName)}" data-search="${escapeHtml(searchText(templateName, elements))}" aria-label="${escapeHtml(templateName)}">`
                + `<div class="scx-card-head"><span class="scx-card-name">${escapeHtml(templateName)}</span>`
                + `<span class="scx-count" aria-label="${countText}" data-tooltip="${countText}">${n}</span>${hidden}</div>`
                + `<div class="scx-card-body">${body}</div></section>`;
        }

        function setMessage(title, text) {
            const box = document.getElementById('scMessage');
            if (!box) { return; }
            if (!title) {
                box.hidden = true;
                box.innerHTML = '';
                return;
            }
            box.hidden = false;
            box.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(text || '')}`;
        }

        function renderControls() {
            const container = document.getElementById('controlsContainer');
            const names = sortedTemplateNames(templateConfigs);

            if (names.length === 0) {
                container.innerHTML = '';
                setMessage('No dynamic controls found', "Add a 'dynamic_controls' section to your template config files to enable interactive controls");
                return;
            }

            container.innerHTML = names.map(function (name) { return renderTemplateCard(name, templateConfigs[name]); }).join('');
            setMessage('');
            applySearch();
        }

        function applySearch() {
            const input = document.getElementById('scSearch');
            const query = (input ? input.value : '').trim().toLowerCase();
            const cards = document.querySelectorAll('#controlsContainer .scx-card');
            let shown = 0;
            cards.forEach(function (card) {
                const match = !query || (card.getAttribute('data-search') || '').indexOf(query) !== -1;
                card.style.display = match ? '' : 'none';
                if (match) { shown += 1; }
            });
            if (cards.length) {
                if (query && !shown) {
                    setMessage('No matches', `No template or control matches “${input.value.trim()}”.`);
                } else {
                    setMessage('');
                }
            }
        }

        /* ---------- Live values (source_controls_state_update) ---------- */

        let liveRefreshTimer = null;
        let liveRefreshAll = false;
        const liveRefreshNames = new Set();

        function queueLiveValueRefresh(payload) {
            const names = payload && Array.isArray(payload.template_names) ? payload.template_names : [];
            if (!names.length) {
                liveRefreshAll = true;
            }
            names.forEach(function (n) { liveRefreshNames.add(String(n)); });
            // Coalesce bursts (slider drags emit one update per step).
            clearTimeout(liveRefreshTimer);
            liveRefreshTimer = setTimeout(refreshLiveValues, 250);
        }

        function structureKey(configs) {
            return JSON.stringify(sortedTemplateNames(configs).map(function (name) {
                return [name, !!configs[name].hidden, controlElements(configs[name]).map(function (e) { return e.type || ''; })];
            }));
        }

        async function refreshLiveValues() {
            const all = liveRefreshAll;
            const names = Array.from(liveRefreshNames);
            liveRefreshAll = false;
            liveRefreshNames.clear();
            let fresh;
            try {
                fresh = await fetchTemplateConfigsFromServer();
            } catch (error) {
                console.debug('Live value refresh skipped:', error);
                return;
            }
            if (!fresh || typeof fresh !== 'object') { return; }
            if (structureKey(fresh) !== structureKey(templateConfigs)) {
                // Templates or controls were added/removed: rebuild.
                templateConfigs = fresh;
                renderControls();
                return;
            }
            const targets = all ? Object.keys(fresh) : names.filter(function (n) { return fresh[n]; });
            targets.forEach(function (name) {
                templateConfigs[name] = fresh[name];
                updateCardValues(name, fresh[name]);
            });
        }

        function findCard(templateName) {
            const cards = document.querySelectorAll('#controlsContainer .scx-card');
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].getAttribute('data-template') === templateName) { return cards[i]; }
            }
            return null;
        }

        // Only touches a control when the server value differs from the one it last
        // showed, and never the field the user is in.
        function updateCardValues(templateName, config) {
            const card = findCard(templateName);
            if (!card) { return; }
            controlElements(config).forEach(function (element, index) {
                const node = card.querySelector(`[data-sc-index="${index}"]`);
                if (!node || node === document.activeElement) { return; }
                const type = element.type;
                let sv;
                if (type === 'toggle') { sv = toggleValue(element) ? '1' : '0'; }
                else if (type === 'number_input') { sv = numberValue(element); }
                else if (type === 'text_input') { sv = textValue(element); }
                else if (type === 'slider') { sv = sliderValue(element); }
                else { return; }
                if (node.getAttribute('data-sv') === sv) { return; }
                node.setAttribute('data-sv', sv);
                if (type === 'toggle') {
                    setSwitch(node, sv === '1');
                } else if (type === 'slider') {
                    node.value = sv;
                    syncSlider(node);
                } else {
                    node.value = sv;
                }
            });
        }

        /* ---------- Tooltips: data-tooltip, shown in one fixed element (not clipped by cards/columns) ---------- */

        function initTooltips() {
            const root = document.querySelector('.scx');
            const tip = document.createElement('div');
            tip.className = 'scx-tip';
            tip.setAttribute('role', 'tooltip');
            tip.hidden = true;
            root.appendChild(tip);
            let current = null;
            function hide() {
                current = null;
                tip.hidden = true;
            }
            function show(el) {
                const text = el.getAttribute('data-tooltip');
                if (!text) { hide(); return; }
                current = el;
                tip.textContent = text;
                tip.hidden = false;
                const r = el.getBoundingClientRect();
                const t = tip.getBoundingClientRect();
                const vw = document.documentElement.clientWidth;
                const left = Math.max(6, Math.min(r.left + r.width / 2 - t.width / 2, vw - t.width - 6));
                const top = r.top - t.height - 6 < 6 ? r.bottom + 6 : r.top - t.height - 6;
                tip.style.left = left + 'px';
                tip.style.top = top + 'px';
            }
            document.addEventListener('mouseover', function (event) {
                const el = event.target.closest ? event.target.closest('[data-tooltip]') : null;
                if (el !== current) { if (el) { show(el); } else { hide(); } }
            });
            document.addEventListener('focusin', function (event) {
                const el = event.target.closest('[data-tooltip]');
                if (el && event.target.matches(':focus-visible')) { show(el); }
            });
            document.addEventListener('focusout', hide);
            document.addEventListener('mousedown', hide);
            document.documentElement.addEventListener('mouseleave', hide);
            window.addEventListener('scroll', hide, true);
        }

        /* ---------- Events (delegated; survive re-renders and in-place updates) ---------- */

        function setSwitch(node, on) {
            node.classList.toggle('is-on', on);
            node.setAttribute('aria-checked', on ? 'true' : 'false');
        }

        function syncSlider(node) {
            const min = Number(node.min || 0);
            const max = Number(node.max || 100);
            node.style.setProperty('--p', sliderPercent(min, max, node.value) + '%');
            const field = node.closest('.scx-field');
            const chip = field ? field.querySelector('[data-sc-chip]') : null;
            if (chip) { chip.textContent = node.value; }
        }

        function templateOf(el) {
            const card = el.closest('.scx-card');
            return card ? card.getAttribute('data-template') || '' : '';
        }

        const textDebounce = new WeakMap();

        function bindControlEvents() {
            const container = document.getElementById('controlsContainer');
            container.addEventListener('click', function (event) {
                const el = event.target.closest('button[data-sc-kind]');
                if (!el || !container.contains(el)) { return; }
                const kind = el.getAttribute('data-sc-kind');
                const templateName = templateOf(el);
                const action = el.getAttribute('data-sc-action') || '';
                if (kind === 'ws-click') {
                    let payload = {};
                    try { payload = JSON.parse(el.getAttribute('data-sc-payload') || '{}'); } catch (e) { payload = {}; }
                    sendWebSocketEvent(templateName, action, payload);
                } else if (kind === 'ws-toggle') {
                    const on = el.getAttribute('aria-checked') !== 'true';
                    setSwitch(el, on);
                    sendWebSocketEvent(templateName, action, { enabled: on });
                } else if (kind === 'banner-permanent') {
                    setSwitch(el, el.getAttribute('aria-checked') !== 'true');
                } else if (kind === 'banner-show' || kind === 'banner-clear') {
                    const root = el.closest('[data-sc-banner-root]');
                    if (kind === 'banner-clear') {
                        sendWebSocketEvent(templateName, action, {
                            action: 'clear',
                            source: 'manual'
                        });
                    } else {
                        const messageEl = root ? root.querySelector('[data-sc-banner-message]') : null;
                        const durationEl = root ? root.querySelector('[data-sc-banner-duration]') : null;
                        const permanentEl = root ? root.querySelector('[data-sc-banner-permanent]') : null;
                        sendWebSocketEvent(templateName, action, {
                            action: 'show',
                            message: messageEl ? messageEl.value : '',
                            duration: durationEl ? Number(durationEl.value) : 10,
                            permanent: !!(permanentEl && permanentEl.getAttribute('aria-checked') === 'true'),
                            source: 'manual'
                        });
                    }
                } else if (kind === 'spore-counter') {
                    const tools = el.closest('.scx-tools');
                    sendSporeCounterEvent(
                        templateName,
                        action,
                        el.getAttribute('data-sc-counter-id'),
                        el.getAttribute('data-sc-operation'),
                        tools ? tools.querySelector('[data-sc-counter-amount]') : null,
                        parseInt(el.getAttribute('data-sc-step'), 10)
                    );
                } else if (kind === 'timer') {
                    // Same event as the app tab: {slug(target_timer_id)}_{start|pause|reset}.
                    const target = el.getAttribute('data-sc-target') || '';
                    sendWebSocketEvent(templateName, timerControlEvent(target, el.getAttribute('data-sc-operation')), { element_id: target });
                }
            });

            container.addEventListener('input', function (event) {
                const el = event.target.closest('input[data-sc-kind]');
                if (!el || !container.contains(el)) { return; }
                const kind = el.getAttribute('data-sc-kind');
                const templateName = templateOf(el);
                const action = el.getAttribute('data-sc-action') || '';
                if (kind === 'ws-input-value') {
                    syncSlider(el);
                    sendWebSocketEvent(templateName, action, { value: el.value });
                } else if (kind === 'ws-input-int') {
                    sendWebSocketEvent(templateName, action, { value: parseInt(el.value, 10) });
                } else if (kind === 'ws-text') {
                    clearTimeout(textDebounce.get(el));
                    textDebounce.set(el, setTimeout(function () {
                        sendTextInputEvent(templateName, action, el);
                    }, 200));
                }
            });
        }

        function sendSporeCounterEvent(templateName, action, targetCounterId, operation, amountEl, defaultStep) {
            action = action || 'counter_adjust';
            let payload;
            if (operation === 'reset') {
                payload = { target_counter_id: targetCounterId, operation: 'reset' };
            } else {
                let amount = !isNaN(defaultStep) && defaultStep != null ? defaultStep : 1;
                if (amountEl) {
                    const n = parseInt(String(amountEl.value), 10);
                    if (!isNaN(n) && n >= 1) { amount = n; }
                }
                payload = {
                    target_counter_id: targetCounterId,
                    operation: operation,
                    delta: { kind: 'fixed', value: amount }
                };
            }
            sendWebSocketEvent(templateName, action, payload);
        }

        // High-frequency actions (per-keystroke) must not show success toasts — they block the UI and drop input.
        var SILENT_RELAY_ACTIONS = {
            set_manual_title: true
        };

        function sendTextInputEvent(templateName, action, inputEl) {
            if (!inputEl) {
                return;
            }
            sendWebSocketEvent(templateName, action, { text: inputEl.value }, { silent: true });
        }

        function sendWebSocketEvent(templateName, action, data, options) {
            options = options || {};
            var silent = !!options.silent || !!SILENT_RELAY_ACTIONS[action];
            const eventName = `${templateName}_${action}`;

            console.log(`Broadcasting event: ${eventName}`, data);

            if (!broadcastSocket) {
                console.error('No broadcast socket available');
                if (!silent) {
                    relayFailed(templateName, action, data, "The dock hasn't connected to Mycelian yet.");
                }
                return;
            }

            if (!broadcastSocket.connected) {
                console.log('Socket not connected, attempting to reconnect...');
                try {
                    broadcastSocket.connect();
                    setTimeout(function () {
                        if (broadcastSocket.connected) {
                            sendRelayEvent(templateName, action, eventName, data, silent);
                        } else if (!silent) {
                            relayFailed(templateName, action, data, 'The dock has lost its connection to Mycelian.');
                        }
                    }, 100);
                    return;
                } catch (error) {
                    console.error('Error reconnecting socket:', error);
                    if (!silent) {
                        relayFailed(templateName, action, data, 'The dock has lost its connection to Mycelian.');
                    }
                    return;
                }
            }

            sendRelayEvent(templateName, action, eventName, data, silent);
        }

        function sendRelayEvent(templateName, action, eventName, data, silent) {
            try {
                const relayData = {
                    event_name: eventName,
                    target_template: templateName,
                    event_data: data
                };

                broadcastSocket.emit('source_controls_relay', relayData);
            } catch (error) {
                console.error(`Error sending relay event ${action} for ${templateName}:`, error);
                if (!silent) {
                    relayFailed(templateName, action, data, 'Sending it failed: ' + (error && error.message ? error.message : 'unknown error') + '.');
                }
            }
        }

        function refreshControls() {
            templateConfigs = {};
            document.getElementById('controlsContainer').innerHTML = '';
            setMessage('Refreshing controls…', 'Reloading template configurations');
            loadTemplateConfigs();
        }

        function showError(message) {
            if (typeof MycelianLog !== 'undefined') {
                MycelianLog.error(message, { source: 'showError' });
            }
            document.getElementById('controlsContainer').innerHTML = '';
            setMessage('Error', message);
        }

        function humanAction(action) {
            return String(action || '').replace(/_/g, ' ');
        }

        /* Pop-ups use the app's shared design and level settings; errors also reach the
           app's notification centre (when the socket is up). */
        function relayFailed(templateName, action, data, why) {
            var title = "Couldn't send “" + humanAction(action) + "” to " + templateName;
            var hint = 'Make sure Mycelian is running. The dock reconnects on its own; right-click the dock and choose Refresh if it doesn\'t.';
            if (broadcastSocket && broadcastSocket.connected) {
                broadcastSocket.emit('dock_notify', { source: 'source_controls', level: 'error', title: title, message: why, hint: hint });
            }
            if (!window.MycelianToast) { console.error(title, why); return; }
            MycelianToast.local('error', title, why, {
                source: 'Source Controls', hint: hint,
                actions: [{ label: 'Try again', icon: 'refresh', run: function () { sendWebSocketEvent(templateName, action, data); } }]
            });
        }
        if (window.MycelianToast) { MycelianToast.configure({ dock: true }); }
    </script>
</body>
</html>
