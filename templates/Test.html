<!DOCTYPE html>
<!--
    Mycelian Spore Studio - queue_alert boilerplate
    Generated for: Test
    Alert system: queue (next_alert + local timing; emit alert_complete in user JS if you use the server alert queue)
-->
<html>
<head>
    <meta charset="utf-8">
    <title>Mycelian {{ TemplateTitle }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" crossorigin="anonymous"></script>
    <style id="spore-studio-styles">
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        #sporeRoot {
            position: relative;
            width: {{ DesignWidth }}px;
            height: {{ DesignHeight }}px;
        }

        .spore-element {
            position: absolute;
        }

        .spore-element[data-spore-hidden="true"] {
            display: none;
        }
    </style>
    <!-- SPORE_STUDIO:styles-begin -->

<!-- SPORE_STUDIO:styles-end -->
</head>
<body>
    <div id="sporeRoot" data-mycelian-template="Test">
        <!-- SPORE_STUDIO:dom-begin -->
        <img id="image1" class="spore-element" style="left: 0px; top: 0px; width: 200px; height: 200px" data-spore-hidden="true" data-spore-type="image" src="{{ image1Src|default("/assets/Test/default_avatar.png") }}" alt="" />
<!-- SPORE_STUDIO:dom-end -->
    </div>

    <script>
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var alertActive = false;
        var alertQueue = [];

        function sporeShow(id) {
            var el = document.getElementById(id);
            if (el) { el.removeAttribute('data-spore-hidden'); }
        }
        function sporeHide(id) {
            var el = document.getElementById(id);
            if (el) { el.setAttribute('data-spore-hidden', 'true'); }
        }
        function sporeSetText(id, value) {
            var el = document.getElementById(id);
            if (el) { el.textContent = (value == null ? '' : String(value)); }
        }

        function sporeMatchesFilter(payload, filter) {
            if (!filter || typeof filter !== 'object') { return true; }
            for (var k in filter) {
                if (!Object.prototype.hasOwnProperty.call(filter, k)) { continue; }
                if (payload == null) { return false; }
                if (payload[k] !== filter[k]) { return false; }
            }
            return true;
        }

        // SPORE_STUDIO:auto-begin
function sporeToggle(id) {
    var el = document.getElementById(id);
    if (!el) { return; }
    if (el.hasAttribute('data-spore-hidden')) {
        el.removeAttribute('data-spore-hidden');
    } else {
        el.setAttribute('data-spore-hidden', 'true');
    }
}

function sporeApplyBindings(eventName, payload) {
    try {
        console.log('[spore-studio] sporeApplyBindings', eventName, payload);
    } catch (__sporeLog) {}
    if (eventName === "new-message") {
        if (true) {
            sporeToggle("image1");
        }
    }
}

// Auto-registered listeners for events the boilerplate does
// not handle natively (chat messages, pause toggles, etc.).
// Guarded with __sporeBoundEvents so a hot-reloaded auto-block
// never double-binds the same event on the same socket.
if (typeof socket !== 'undefined' && socket && socket.on) {
    window.__sporeBoundEvents = window.__sporeBoundEvents || {};
    if (!window.__sporeBoundEvents["new-message"]) {
        window.__sporeBoundEvents["new-message"] = true;
        socket.on("new-message", function (data) {
            try {
                console.log('[spore-studio] socket.on', "new-message", data);
                sporeApplyBindings("new-message", data || {});
            } catch (err) {
                console.error('[spore-studio] binding error on ' + "new-message", err);
            }
        });
    }
}
// SPORE_STUDIO:auto-end

        (function () {
            if (typeof socket !== 'undefined' && socket && socket.on) {
                socket.on('streamdeck_template_action', function (data) {
                    try {
                        console.log('[Test] streamdeck_template_action (debug)', data);
                    } catch (e) {}
                });
            }
        })();

        socket.on('connect', function () {
            var __r = document.getElementById('sporeRoot');
            var __t = __r && __r.getAttribute('data-mycelian-template');
            console.log('[Test] socket connect (debug)', {
                template: __t || 'Test',
                sid: socket && socket.id
            });
        });

        socket.on('next_alert', function (data) {
            alertQueue.push(data || {});
            if (!alertActive) { sporeProcessNext(); }
        });

        function sporeProcessNext() {
            if (alertActive) { return; }
            if (alertQueue.length === 0) { return; }
            alertActive = true;
            var data = alertQueue.shift();
            try {
                console.log('[Test] next_alert dequeue (debug)', data);
                sporeApplyBindings('next_alert', data);
            } catch (err) {
                console.error('[Test] binding error', err);
            }
            var hold = (data && typeof data.duration === 'number') ? data.duration : 5;
            setTimeout(function () {
                alertActive = false;
                var seq = data && data.queue_seq != null ? parseInt(data.queue_seq, 10) : null;
                if (seq == null || Number.isNaN(seq)) {
                    console.warn('[Test] queue item had no queue_seq; emit alert_complete from Advanced JS when your overlay should release the server queue.');
                }
                sporeProcessNext();
            }, hold * 1000);
        }

        // SPORE_STUDIO:user-begin
// Place advanced custom JavaScript below. Anything between the
        // user-begin and user-end markers is preserved across Spore Studio
        // saves. Use sporeShow(id) / sporeHide(id) / sporeSetText(id,val)
        // helpers, and listen for additional socket events here if needed.
// SPORE_STUDIO:user-end
    </script>
</body>
</html>
