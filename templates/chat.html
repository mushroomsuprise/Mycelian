<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mycelian Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <style>
        @font-face {
            font-family: chat-font;
            src: url("/assets/default_assets/fonts/{{FontName}}");
        }

        @font-face {
            font-family: event-font;
            src: url("/assets/default_assets/fonts/{{EventFontName}}");
        }

        /* Dynamic font classes for randomization */
        .random-message-font {
            /* Font will be set dynamically via JavaScript */
            font-family: inherit; /* Placeholder to avoid empty ruleset warning */
        }

        .random-username-font {
            /* Font will be set dynamically via JavaScript */
            font-family: inherit; /* Placeholder to avoid empty ruleset warning */
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: chat-font, Arial, sans-serif;
            overflow: hidden;
            background: transparent;
        }

        #chat {
            background-color: {{ BGColor }};
            opacity: {{ BGOpacity }};
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;

            padding: {{ ChatPadding }}px;
            box-sizing: border-box;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* Internet Explorer 10+ */
        }

        #chat::-webkit-scrollbar {
            display: none;
            /* WebKit */
        }

        .chat-message {
            list-style-type: none;

            background-color: {{ MessageBG }};
            box-sizing: border-box;

            padding: {{ MessagePadding }}px;

            margin: {{ MessageMargin }}px 0;

            font-size: {{ FontSize }}px;

            color: {{ FontColor }};

            border-radius: {{ MessageRadius }}px;

            border: {{ MessageBorder }}px solid {{ MessageBorderColor }};
            word-wrap: break-word;
            display: block;

            animation: {{ MessageAnimation }} {{ AnimationDuration }}s {{ AnimationEasing }};

            min-height: {{ MinMessageHeight }}px;
            flex-shrink: 0;

            /* Prevent messages from shrinking */
            line-height: {{ LineHeight }};
        }

        .message-header {
            display: inline-block;
            white-space: nowrap;
            margin-right: 5px;
            vertical-align: baseline;
        }

        .chat-message.event-message {
            font-family: event-font, chat-font, Arial, sans-serif;
            background-color: {{ EventBG }};
            color: {{ EventColor }};
            font-style: italic;
            border-left: {{ EventBorderWidth }}px solid {{ EventBorderColor }};
        }

        /* Activity feed event message styles */
        .chat-message.activity-event {
            font-style: italic;
            color: rgba(180, 180, 180, 0.8);
            background-color: transparent;
            border: none;
            border-left: 2px solid rgba(120, 120, 120, 0.3);

            font-size: calc({{ FontSize }}px * 0.85);
            opacity: 0.8;
            margin: calc({{ MessageMargin }}px * 0.3) 0;
            padding: calc({{ MessagePadding }}px * 0.4) calc({{ MessagePadding }}px * 0.6);
        min-height: auto;
        font-weight: 300;
        }

        .chat-message.activity-event .message-content {
            color: inherit;
            font-size: inherit;
        }

        /* Moderation event styles */
        .chat-message.moderation-delete {
            background-color: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff0000;
        }

        .chat-message.moderation-timeout {
            background-color: rgba(255, 165, 0, 0.2);
            border-left: 4px solid #ffa500;
        }

        .chat-message.moderation-ban {
            background-color: rgba(128, 0, 128, 0.2);
            border-left: 4px solid #800080;
        }

        .chat-message.moderation-warning {
            background-color: rgba(255, 255, 0, 0.2);
            border-left: 4px solid #ffff00;
        }

        .message-badges {
            display: inline;
            margin-right: {{ BadgeGap }}px;
        }

        .badge-img {
            width: {{ BadgeSize }}px;
            height: {{ BadgeSize }}px;
            vertical-align: middle;
            border-radius: {{ BadgeRadius }}px;
            margin-right: {{ BadgeGap }}px;
        }

        .message-username {
            font-size: {{ UsernameFontSize }}px;
            font-weight: {{ UsernameFontWeight }};
            color: {{ UsernameColor }};
            margin-right: {{ UsernameMargin }}px;
            flex-shrink: 0;
            text-shadow: {{ UsernameTextShadow }};
        }

        .message-content {
            display: inline;
            vertical-align: baseline;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-content-block {
            display: block;
            margin-top: 2px;
            margin-left: 0;
            text-indent: 0;
        }

        .emote-img {
            transform: scale({{ EmoteScale }});
            vertical-align: middle;
            margin: 0 {{ EmoteMargin }}px;
            border-radius: {{ EmoteRadius }}px;
        }

        /* Zero-width emote support for 7TV */
        .emote-container {
            position: relative;
            display: inline-block;
            margin: 0 {{ EmoteMargin }}px;
        }

        .emote-base {
            transform: scale({{ EmoteScale }});
            vertical-align: middle;
            border-radius: {{ EmoteRadius }}px;
            display: block;
        }

        .emote-overlay {
            position: absolute;
            top: 0;
            left: 0;
            transform: scale({{ EmoteScale }});
            border-radius: {{ EmoteRadius }}px;
            pointer-events: none;
            z-index: 1;
        }

        .emote-zw {
            transform: scale({{ EmoteScale }});
            border-radius: {{ EmoteRadius }}px;
            /* Visual indicator for standalone zero-width emotes */
            opacity: 0.8;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }

        /* Gigantified emote styling (Twitch CDN only; uses 112px asset + display scale) */
        .gigantified-emote {
            transform: scale({{ GigantifiedTwitchDisplayScale }}) !important;
            vertical-align: middle;
            margin: 0 8px;
        }

        .gigantified-emote.emote-zw {
            /* Zero-width gigantified emotes should still be visible */
            opacity: 1;
            border: none;
        }

        /* Messages containing gigantified emotes need extra line height to prevent overlap */
        .chat-message.gigantified-message {
            line-height: calc({{ LineHeight }} * (3 * {{ GigantifiedTwitchDisplayScale }} / 0.75));
            padding: calc({{ MessagePadding }}px * (1.5 * {{ GigantifiedTwitchDisplayScale }} / 0.75)) {{ MessagePadding }}px;
        }

        .cheermote-container {
            display: inline-block;
            align-items: center;
            gap: 2px;
        }

        .cheermote-img {
            transform: scale({{ EmoteScale }});
            vertical-align: middle;
        }

        .cheermote-amount {
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .timestamp {
            font-size: {{ TimestampSize }}px;
            color: {{ TimestampColor }};
            margin-right: {{ TimestampMargin }}px;
            opacity: {{ TimestampOpacity }};
            vertical-align: baseline;
        }

        /* Animation keyframes */
        @keyframes slideIn {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .chat-message {
                font-size: calc({{ FontSize }}px * 0.9);
                padding: calc({{ MessagePadding }}px * 0.8);
            }

        .chat-message.activity-event {
            font-size: calc({{ FontSize }}px * 0.75);
            padding: calc({{ MessagePadding }}px * 0.3) calc({{ MessagePadding }}px * 0.5);
            margin: calc({{ MessageMargin }}px * 0.2) 0;
        }

        .message-header {
            margin-right: 3px;
        }

        .message-content {
            /* Remove margin-top for inline flow */
            margin-top: 0; /* Explicitly set to avoid empty ruleset warning */
        }

        .emote-img:not(.gigantified-emote),
        .badge-img,
        .emote-base:not(.gigantified-emote),
        .emote-overlay:not(.gigantified-emote),
        .emote-zw:not(.gigantified-emote) {
            transform: scale(calc({{ EmoteScale }} * 0.8));
        }

        .emote-img.gigantified-emote,
        .emote-base.gigantified-emote,
        .emote-overlay.gigantified-emote,
        .emote-zw.gigantified-emote {
            transform: scale(calc({{ GigantifiedTwitchDisplayScale }} * 0.8)) !important;
        }

        .emote-container {
            margin: 0 calc({{ EmoteMargin }}px * 0.8);
        }
        }

        /* Text wrapping styles */
        .message-content {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>

<body>
    <div id="chat"></div>

    <script>
        // Global variables
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var messageCount = 0;
        var maxMessages = {{ MaxMessages | tojson }};
        var showTimestamps = {{ ShowTimestamps | tojson }};
        var timestampFormat = {{ TimestampFormat | tojson }};
        var enableEmotes = {{ EnableEmotes | tojson }};
        var enableBadges = {{ EnableBadges | tojson }};
        var streamerID = null;
        var emoteFetchInProgress = false;
        var badgeFetchInProgress = false;

        // Font randomization settings
        var enableMessageFontRandomization = {{ EnableMessageFontRandomization | tojson }};
        var enableUsernameFontRandomization = {{ EnableUsernameFontRandomization | tojson }};
        var randomFontList = {{ RandomFontList | tojson }}.split('\n').map(function (font) {
            return font.trim();
        }).filter(function (font) {
            return font.length > 0;
        });

        // Username filtering settings
        var enableUsernameFiltering = {{ EnableUsernameFiltering | tojson }};
        var filteredUsernames = {{ FilteredUsernames | tojson }}.toLowerCase().split('\n').map(function (username) {
            return username.trim();
        }).filter(function (username) {
            return username.length > 0;
        });

        // Username color randomization
        var randomUsernameColors = [
            "rgb(255, 0, 0)",
            "rgb(0, 0, 255)",
            "rgb(0, 128, 0)",
            "rgb(178, 34, 34)",
            "rgb(255, 127, 80)",
            "rgb(154, 205, 50)",
            "rgb(255, 69, 0)",
            "rgb(46, 139, 87)",
            "rgb(218, 165, 32)",
            "rgb(210, 105, 30)",
            "rgb(95, 158, 160)",
            "rgb(30, 144, 255)",
            "rgb(255, 105, 180)",
            "rgb(138, 43, 226)",
            "rgb(0, 255, 127)"
        ];
        var usernameColorCache = {};

        // Emote and badge data caches
        var emoteCache = {
            bttv: { global: [], user: [] },
            seventv: { global: [], user: [] },
            ffz: { global: [], user: [] },
            twitch: { global: [], user: [] },
            cheermotes: {}
        };

        var badgeCache = {
            global: [],
            user: []
        };

        var disabledBadges = {
            moderator: {{ DisableModerator | tojson }},
            vip: {{ DisableVIP | tojson }},
            subscriber: {{ DisableSubscriber | tojson }},
            founder: {{ DisableFounder | tojson }},
            broadcaster: {{ DisableBroadcaster | tojson }},
            turbo: {{ DisableTurbo | tojson }},
            staff: {{ DisableStaff | tojson }},
            bits: {{ DisableBits | tojson }},
            admin: {{ DisableAdmin | tojson }},
            partner: {{ DisablePartner | tojson }}
        };

        // Font randomization functions
        function getRandomFont() {
            if (randomFontList.length === 0) {
                return '{{FontName}}'; // Fallback to default font
            }
            var randomIndex = Math.floor(Math.random() * randomFontList.length);
            return randomFontList[randomIndex];
        }

        // Username color functions
        function getUsernameColor(username, twitchColor) {
            // Check if we've already assigned a color for this user
            if (usernameColorCache[username]) {
                return usernameColorCache[username];
            }

            var finalColor;

            // If user has a Twitch-assigned color, use it
            if (twitchColor && twitchColor.trim() !== '') {
                finalColor = twitchColor;
                console.log('Using Twitch color', finalColor, 'for username', username);
            } else {
                // Assign a random color from our list
                var randomIndex = Math.floor(Math.random() * randomUsernameColors.length);
                finalColor = randomUsernameColors[randomIndex];
                console.log('Assigned random color', finalColor, 'to username', username);
            }

            // Store the color assignment for consistency (both Twitch and random colors)
            usernameColorCache[username] = finalColor;

            return finalColor;
        }

        function loadRandomFont(fontName) {
            // Create a unique font family name for this random font
            var fontFamily = 'random-font-' + fontName.replace(/[^a-zA-Z0-9]/g, '-');

            // Check if this font is already loaded
            if (document.querySelector('style[data-font="' + fontFamily + '"]')) {
                return fontFamily;
            }

            // Create and inject CSS for this font
            var style = document.createElement('style');
            style.setAttribute('data-font', fontFamily);
            style.textContent =
                '@font-face {' +
                '    font-family: "' + fontFamily + '";' +
                '    src: url("/assets/default_assets/fonts/' + fontName + '");' +
                '}';
            document.head.appendChild(style);

            console.log('Loaded random font:', fontName, 'as', fontFamily);

            return fontFamily;
        }

        function applyRandomFont(element, isUsername) {
            if (isUsername && !enableUsernameFontRandomization) return;
            if (!isUsername && !enableMessageFontRandomization) return;

            try {
                var randomFont = getRandomFont();
                var fontFamily = loadRandomFont(randomFont);

                // Apply the random font to the element with fallbacks
                element.style.fontFamily = fontFamily + ', chat-font, Arial, sans-serif';

                console.log('Applied random font:', randomFont, 'to', isUsername ? 'username' : 'message');
            } catch (error) {
                console.error('Error applying random font:', error);
                // Fallback to default font
                element.style.fontFamily = 'chat-font, Arial, sans-serif';
            }
        }

        // Socket event listeners
        socket.on('connect', function () {
            console.log('Connected to chat server');
            requestStreamerInfo();
        });

        socket.on('clear-chat', function () {
            clearChat();
        });

        socket.on('new-message', function (messageData) {
            addMessage(messageData);
        });

        socket.on('remove-messages', function (messageIds) {
            removeMessages(messageIds);
        });

        socket.on('message_moderation', function (moderationData) {
            handleModerationEvent(moderationData);
        });

        socket.on('update-settings', function (settings) {
            updateChatSettings(settings);
        });

        socket.on('refresh-chat', function () {
            location.reload(true);
        });

        socket.on('streamer-info', function (data) {
            console.log('Received streamer-info event:', data);
            if (data && data.user_id) {
                streamerID = data.user_id;
                console.log('Received streamer ID:', streamerID);
                fetchAllEmotesAndBadges();
            } else {
                console.warn('Invalid or missing streamer info:', data);
            }
        });

        socket.on('twitch-api-response', function (data) {
            handleTwitchApiResponse(data);
        });

        socket.on('activity_feed_alert', function (alertData) {
            console.log('Received activity_feed_alert event:', alertData);
            addActivityEventMessage(alertData);
        });

        // Connector action event listeners
        socket.on('chat_add_message', function (data) {
            console.log('Connector action: add message', data);
            var messageData = data || {};

            // Create a test message if no message data provided
            if (!messageData.text && !messageData.message) {
                messageData = {
                    username: messageData.username || 'Connector',
                    text: messageData.text || messageData.message || 'Test message from connector',
                    color: messageData.color || '#007acc',
                    timestamp: Date.now()
                };
            }

            // Add the message to chat
            addMessage(messageData);
        });

        socket.on('chat_temporary_random_font', function (data) {
            console.log('Connector action: temporary random font', data);
            var duration = (data && data.duration) ? parseInt(data.duration) : 10000; // Default 10 seconds

            // Get available font families from CSS or use a set of common fonts
            var fonts = [
                'Arial, sans-serif',
                'Georgia, serif',
                'Comic Sans MS, cursive',
                'Impact, fantasy',
                'Courier New, monospace',
                'Times New Roman, serif',
                'Trebuchet MS, sans-serif',
                'Verdana, sans-serif'
            ];

            var randomFont = fonts[Math.floor(Math.random() * fonts.length)];
            var chatContainer = document.getElementById('chatContainer');

            if (chatContainer) {
                // Store original font
                var originalFont = chatContainer.style.fontFamily || 'inherit';

                // Apply random font
                chatContainer.style.fontFamily = randomFont;
                console.log('Applied temporary font:', randomFont, 'for', duration + 'ms');

                // Restore original font after duration
                setTimeout(function () {
                    chatContainer.style.fontFamily = originalFont;
                    console.log('Restored original font');
                }, duration);
            }
        });

        // Request streamer info from server
        function requestStreamerInfo() {
            socket.emit('get-streamer-info');
        }

        // Fetch all emotes and badges
        function fetchAllEmotesAndBadges() {
            if (!streamerID || emoteFetchInProgress) return;

            emoteFetchInProgress = true;
            console.log('Starting emote and badge fetch...');

            // Fetch third-party emotes (no auth required)
            fetchBTTVEmotes();
            fetchSevenTVEmotes();
            fetchFFZEmotes();

            // Fetch Twitch data (requires auth via websocket)
            fetchTwitchEmotes();
            fetchTwitchBadges();
            fetchCheermotes();
        }

        // Handle Twitch API responses
        function handleTwitchApiResponse(data) {
            console.log('Received twitch-api-response:', data);

            if (!data || !data.requestId) {
                console.error('Invalid response data:', data);
                return;
            }

            try {
                console.log('Processing request ID:', data.requestId, 'Success:', data.success);

                if (!data.success) {
                    console.error('API request failed:', data.error, 'for request:', data.requestId);
                    return;
                }

                switch (data.requestId) {
                    case 'twitch-global-emotes':
                        console.log('Processing twitch-global-emotes response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            emoteCache.twitch.global = data.data.data;
                            console.log('Twitch global emotes loaded:', emoteCache.twitch.global.length);
                        } else {
                            console.error('Invalid twitch-global-emotes response structure:', data.data);
                        }
                        break;

                    case 'twitch-global-badges':
                        console.log('Processing twitch-global-badges response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            badgeCache.global = data.data.data;
                            console.log('Twitch global badges loaded:', badgeCache.global.length);
                        } else {
                            console.error('Invalid twitch-global-badges response structure:', data.data);
                        }
                        break;

                    case 'twitch-user-badges':
                        console.log('Processing twitch-user-badges response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            badgeCache.user = data.data.data;
                            console.log('Twitch user badges loaded:', badgeCache.user.length);
                        } else {
                            console.error('Invalid twitch-user-badges response structure:', data.data);
                        }
                        break;

                    case 'twitch-cheermotes':
                        console.log('Processing twitch-cheermotes response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            processCheermotes(data.data.data);
                            console.log('Cheermotes loaded');
                        } else {
                            console.error('Invalid twitch-cheermotes response structure:', data.data);
                        }
                        break;

                    default:
                        console.warn('Unknown request ID:', data.requestId);
                        break;
                }
            } catch (error) {
                console.error('Error handling Twitch API response:', error, 'for data:', data);
            }

            // Mark fetch as complete after all requests
            setTimeout(() => {
                emoteFetchInProgress = false;
            }, 1000);
        }

        // Process cheermotes into usable format
        function processCheermotes(cheermoteData) {
            emoteCache.cheermotes = {};

            cheermoteData.forEach(function (cheermote) {
                var prefix = cheermote.prefix.toLowerCase();
                emoteCache.cheermotes[prefix] = {};

                cheermote.tiers.forEach(function (tier) {
                    var minBits = tier.min_bits;
                    var images = tier.images;

                    // Use the animated version if available, otherwise static
                    var imageUrl = '';
                    var color = tier.color || '#ffffff';

                    if (images.dark && images.dark.animated && images.dark.animated['1']) {
                        imageUrl = images.dark.animated['1'];
                    } else if (images.dark && images.dark.static && images.dark.static['1']) {
                        imageUrl = images.dark.static['1'];
                    } else if (images.light && images.light.animated && images.light.animated['1']) {
                        imageUrl = images.light.animated['1'];
                    } else if (images.light && images.light.static && images.light.static['1']) {
                        imageUrl = images.light.static['1'];
                    }

                    if (imageUrl) {
                        emoteCache.cheermotes[prefix][minBits] = {};
                        emoteCache.cheermotes[prefix][minBits][imageUrl] = color;
                    }
                });
            });
        }

        // Add an activity feed event message to chat
        function addActivityEventMessage(alertData) {
            console.log('Adding activity event message:', alertData);

            var chatContainer = document.getElementById('chat');
            var messageElement = document.createElement('li');
            messageElement.className = 'chat-message activity-event';
            messageElement.id = 'activity-event-' + Date.now();

            // Use the message directly from the activity feed data format
            var eventText = '';

            // The activity feed already formats the message, so we can use it directly
            if (alertData.message) {
                eventText = alertData.message;
            } else {
                // Fallback: Extract info and format manually if message is missing
                var alertType = alertData.type || 'Unknown';
                var username = extractUsernameFromMessage(alertData) || 'Someone';

                switch (alertType.toLowerCase()) {
                    case 'bits':
                        eventText = username + ' donated bits!';
                        break;
                    case 'sub':
                        eventText = username + ' subscribed!';
                        break;
                    case 'resub':
                        eventText = username + ' resubscribed!';
                        break;
                    case 'giftsub':
                        eventText = username + ' gifted a subscription!';
                        break;
                    case 'follow':
                        eventText = username + ' followed!';
                        break;
                    case 'raid':
                        eventText = username + ' raided!';
                        break;
                    case 'donation':
                        eventText = username + ' donated!';
                        break;
                    case 'points':
                        eventText = username + ' redeemed channel points!';
                        break;
                    case 'streak':
                        eventText = username + ' hit a watch streak milestone!';
                        break;
                    case 'hype train':
                        eventText = 'Hype Train activated!';
                        break;
                    default:
                        eventText = alertType + ' event occurred!';
                        break;
                }
            }

            messageElement.innerHTML = '<div class="message-content">' + escapeHtml(eventText) + '</div>';

            chatContainer.appendChild(messageElement);

            // Scroll to bottom
            scrollToBottom();

            // Manage message count
            messageCount++;
            if (messageCount > maxMessages) {
                removeOldestMessage();
            }
        }

        // Helper function to extract username from alert message
        function extractUsernameFromMessage(alertData) {
            // Try various possible username fields
            var username = alertData.username ||
                alertData.user_name ||
                alertData.display_name ||
                alertData.from_user_name ||
                alertData.gifter_user_name;

            // If no username field, try to extract from message
            if (!username && alertData.message) {
                // Look for patterns like "username followed!" or "username donated"
                var messageMatch = alertData.message.match(/^([^\s]+)\s+(followed|subscribed|donated|redeemed|raided)/i);
                if (messageMatch) {
                    username = messageMatch[1];
                }
            }

            return username;
        }

        // Use Twitch 112px CDN assets for gigantified power-up messages (Twitch native emotes only)
        function upgradeTwitchEmoteUrlsForGigantified(html) {
            if (!html || typeof html !== 'string') {
                return html;
            }
            return html.replace(
                /(https:\/\/static-cdn\.jtvnw\.net\/emoticons\/v2\/\d+\/default\/(?:light|dark)\/)1\.0/g,
                '$13.0'
            );
        }

        // Parse badges into HTML
        function parseBadges(badgeString) {
            console.log('parseBadges called with:', badgeString);

            if (!badgeString || badgeString === 'null') {
                console.log('No badges to parse');
                return '';
            }

            var badges = badgeString.split(',');
            var badgeHTML = '';

            console.log('Split badges:', badges);

            badges.forEach(function (badge) {
                var parts = badge.split('/');
                if (parts.length !== 2) {
                    console.log('Invalid badge format:', badge);
                    return;
                }

                var badgeSet = parts[0];
                var badgeId = parts[1];

                console.log('Processing badge:', badgeSet, '/', badgeId);

                // Check if badge is disabled
                if (disabledBadges[badgeSet]) {
                    console.log('Badge disabled:', badgeSet);
                    return;
                }

                var badgeUrl = findBadgeUrl(badgeSet, badgeId);
                console.log('Found badge URL for', badgeSet, '/', badgeId, ':', badgeUrl);

                if (badgeUrl) {
                    badgeHTML += '<img src="' + badgeUrl + '" class="badge-img" alt="' + badgeSet + '">';

            });

            console.log('Final badge HTML:', badgeHTML);

        // Find badge URL in cache
        function findBadgeUrl(badgeSet, badgeId) {
            // Check user badges first
            for (var i = 0; i < badgeCache.user.length; i++) {
                var badge = badgeCache.user[i];
                if (badge.set_id === badgeSet) {
                    for (var j = 0; j < badge.versions.length; j++) {
                        if (badge.versions[j].id === badgeId) {
                            return badge.versions[j].image_url_1x;
                        }
                    }
                }
            }

            // Check global badges
            for (var i = 0; i < badgeCache.global.length; i++) {
                var badge = badgeCache.global[i];
                if (badge.set_id === badgeSet) {
                    for (var j = 0; j < badge.versions.length; j++) {
                        if (badge.versions[j].id === badgeId) {
                            return badge.versions[j].image_url_1x;
                        }
                    }
                    // If exact match not found, try to find a fallback version
                    if (badge.versions.length > 0) {
                        // For subscriber badges, try to find the appropriate tier
                        if (badgeSet === 'subscriber') {
                            var targetMonths = parseInt(badgeId);
                            var bestMatch = null;

                            // Sort versions by month count (ascending)
                            var sortedVersions = badge.versions.slice().sort(function (a, b) {
                                return parseInt(a.id) - parseInt(b.id);
                            });

                            // Find the highest tier that's still <= target months
                            for (var k = sortedVersions.length - 1; k >= 0; k--) {
                                var versionMonths = parseInt(sortedVersions[k].id);
                                if (versionMonths <= targetMonths) {
                                    bestMatch = sortedVersions[k];
                                    break;
                                }
                            }

                            // If no suitable tier found (target is less than all tiers), use the lowest tier
                            if (!bestMatch && sortedVersions.length > 0) {
                                bestMatch = sortedVersions[0];
                            }

                            if (bestMatch) {
                                console.log('Using subscriber badge tier for', targetMonths, 'months:', bestMatch.id + '-month badge');
                                return bestMatch.image_url_1x;
                            }
                        }

                        // For other badges, use the first available version
                        return badge.versions[0].image_url_1x;
                    }
                }
            }

            return null;
        }

        // Parse Twitch emotes on the original message before processing other emotes
        function parseTwitchEmotesInOriginalMessage(message, emotesString) {
            console.log('Parsing Twitch emotes. Message:', message, 'Emotes:', emotesString);

            if (!emotesString || emotesString === 'null') {
                return { message: message, usedPositions: [] };
            }

            var emotes = emotesString.split('/');
            var replacements = [];
            var usedPositions = [];

            emotes.forEach(function (emote) {
                var parts = emote.split(':');
                if (parts.length !== 2) return;

                var emoteId = parts[0];
                var positions = parts[1].split(',');

                console.log('Processing Twitch emote ID:', emoteId, 'Positions:', positions);

                positions.forEach(function (position) {
                    var range = position.split('-');
                    if (range.length !== 2) return;

                    var start = parseInt(range[0]);
                    var end = parseInt(range[1]);

                    console.log('Twitch emote position:', start, '-', end, 'Text:', message.substring(start, end + 1));

                    replacements.push({
                        start: start,
                        end: end,
                        emoteId: emoteId
                    });

                    usedPositions.push({ start: start, end: end });
                });
            });

            // Sort by start position (descending) to replace from end to start
            replacements.sort(function (a, b) { return b.start - a.start; });

            console.log('Twitch emote replacements:', replacements);

            // Apply replacements to the original message
            var processedMessage = message;
            replacements.forEach(function (replacement) {
                var emoteUrl = 'https://static-cdn.jtvnw.net/emoticons/v2/' + replacement.emoteId + '/default/light/1.0';
                var emoteImg = '<img src="' + emoteUrl + '" class="emote-img" alt="emote" onerror="console.error(\'Failed to load Twitch emote:\', this.src); this.style.display=\'none\';">';

                console.log('Replacing Twitch emote at position', replacement.start, '-', replacement.end, 'with URL:', emoteUrl);

                var before = processedMessage.substring(0, replacement.start);
                var after = processedMessage.substring(replacement.end + 1);
                processedMessage = before + emoteImg + after;

                console.log('Message after replacement:', processedMessage);
            });

            return { message: processedMessage, usedPositions: usedPositions };
        }

            var amount = parseInt(match[2]);

            if (!emoteCache.cheermotes[prefix]) return null;

            // Find the appropriate tier
            var tiers = Object.keys(emoteCache.cheermotes[prefix]).map(Number).sort(function (a, b) { return b - a; });
            var tier = null;

            for (var i = 0; i < tiers.length; i++) {
                if (amount >= tiers[i]) {
                    tier = tiers[i];
                    break;
                }
            }

            if (!tier) return null;

            var cheermoteData = emoteCache.cheermotes[prefix][tier];
            var emoteUrl = Object.keys(cheermoteData)[0]; // Get the first (and likely only) URL
            var color = cheermoteData[emoteUrl];

            return '<span class="cheermote-container">' +
                '<img src="' + emoteUrl + '" class="cheermote-img" alt="' + prefix + '">' +
                '<span class="cheermote-amount" style="color: ' + color + '">' + amount + '</span>' +
                '</span>';

                        if (deleteAction.message_id) {
                            removeMessageById(deleteAction.message_id);
                            console.log('Removed message by ID:', deleteAction.message_id);
                        }
                    }

                    // Handle user timeout
                    if (moderationData.actions.timeout) {
                        var timeoutAction = moderationData.actions.timeout;
                        // Remove recent messages from timed out user
                        removeMessagesByUser(timeoutAction.user_id);
                        console.log('Removed messages from timed out user:', timeoutAction.user_name, timeoutAction.user_id);
                    }

                    // Handle user ban
                    if (moderationData.actions.ban) {
                        var banAction = moderationData.actions.ban;
                        // Remove all messages from banned user
                        removeMessagesByUser(banAction.user_id);
                        console.log('Removed messages from banned user:', banAction.user_name, banAction.user_id);
                    }

                    // Handle warning - no message removal needed for warnings
                    if (moderationData.actions.warning) {
                        var warningAction = moderationData.actions.warning;
                        console.log('Warning received for user:', warningAction.user_name, warningAction.user_id);
                    }
                }
            } catch (error) {
                console.error('Error handling moderation event:', error);
            }
        }

        // Show moderation indicator
        function showModerationIndicator(message, type) {
            var chatContainer = document.getElementById('chat');
            var moderationElement = document.createElement('div');
            moderationElement.className = 'chat-message event-message moderation-' + type;
            moderationElement.innerHTML = '<div class="message-content"><em>[MODERATION] ' + escapeHtml(message) + '</em></div>';

            chatContainer.appendChild(moderationElement);
            scrollToBottom();

            // Auto-remove moderation indicator after 10 seconds
            setTimeout(function () {
                if (moderationElement.parentNode) {
                    moderationElement.remove();
                }
            }, 10000);
        }

        // Remove message by ID
        function removeMessageById(messageId) {
            var element = document.getElementById('msg-' + messageId);
            if (element) {
                element.remove();
                messageCount--;
                console.log('Removed message by ID:', messageId);
            }
        }

        // Remove messages by user ID
        function removeMessagesByUser(userId) {
            var chatContainer = document.getElementById('chat');
            var messages = chatContainer.querySelectorAll('.chat-message[data-user-id="' + userId + '"]');
            var removedCount = 0;

            messages.forEach(function (message) {
                message.remove();
                removedCount++;
                console.log('Removed message from user:', userId, 'Message ID:', message.id);
            });

            if (removedCount > 0) {
                messageCount -= removedCount;
                console.log('Removed ' + removedCount + ' messages from user:', userId);
            } else {
                console.log('No messages found for user:', userId);
            }
        }

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                // Page became visible, scroll to bottom
                scrollToBottom();
            }
        });

        // Refresh emotes periodically (every 30 minutes)
        setInterval(function () {
            if (streamerID && !emoteFetchInProgress) {
                console.log('Refreshing emotes...');
                fetchAllEmotesAndBadges();
            }
        }, 30 * 60 * 1000);

        // Initialize
        console.log('Mycelian Chat initialized');

        // BTTV Emote Fetching
        function fetchBTTVEmotes() {
            // Global BTTV emotes
            fetch('https://api.betterttv.net/3/cached/emotes/global')
                .then(response => response.json())
                .then(data => {
                    emoteCache.bttv.global = data;
                    console.log('BTTV global emotes loaded:', data.length);
                })
                .catch(error => console.error('Error fetching BTTV global emotes:', error));

            // User BTTV emotes
            if (streamerID) {
                fetch(`https://api.betterttv.net/3/cached/users/twitch/${streamerID}`)
                    .then(response => response.json())
                    .then(data => {
                        emoteCache.bttv.user = (data.channelEmotes || []).concat(data.sharedEmotes || []);
                        console.log('BTTV user emotes loaded:', emoteCache.bttv.user.length);
                    })
                    .catch(error => console.error('Error fetching BTTV user emotes:', error));
            }
        }

        // 7TV Emote Fetching
        function fetchSevenTVEmotes() {
            // Global 7TV emotes
            fetch('https://7tv.io/v3/emote-sets/global')
                .then(response => response.json())
                .then(data => {
                    emoteCache.seventv.global = data.emotes || [];
                    console.log('7TV global emotes loaded:', emoteCache.seventv.global.length);
                    console.log('7TV global emotes:', emoteCache.seventv.global);
                })
                .catch(error => console.error('Error fetching 7TV global emotes:', error));

            // User 7TV emotes
            if (streamerID) {
                fetch(`https://7tv.io/v3/users/twitch/${streamerID}`)
                    .then(response => response.json())
                    .then(data => {
                        emoteCache.seventv.user = (data.emote_set && data.emote_set.emotes) || [];
                        console.log('7TV user emotes loaded:', emoteCache.seventv.user.length);
                    })
                    .catch(error => console.error('Error fetching 7TV user emotes:', error));
            }
        }

        // FFZ Emote Fetching
        function fetchFFZEmotes() {
            // Global FFZ emotes
            fetch('https://api.frankerfacez.com/v1/set/global')
                .then(response => response.json())
                .then(data => {
                    emoteCache.ffz.global = (data.sets && data.sets['3'] && data.sets['3'].emoticons) || [];
                    console.log('FFZ global emotes loaded:', emoteCache.ffz.global.length);
                })
                .catch(error => console.error('Error fetching FFZ global emotes:', error));

            // User FFZ emotes
            if (streamerID) {
                fetch(`https://api.frankerfacez.com/v1/room/id/${streamerID}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.room && data.room.set && data.sets && data.sets[data.room.set]) {
                            emoteCache.ffz.user = data.sets[data.room.set].emoticons || [];
                            console.log('FFZ user emotes loaded:', emoteCache.ffz.user.length);
                        }
                    })
                    .catch(error => console.error('Error fetching FFZ user emotes:', error));
            }
        }

        // Twitch Emote Fetching (via websocket proxy)
        function fetchTwitchEmotes() {
            console.log('Requesting Twitch global emotes...');
            socket.emit('twitch-api-request', {
                endpoint: 'https://api.twitch.tv/helix/chat/emotes/global',
                method: 'GET',
                requestId: 'twitch-global-emotes'
            });
        }

        // Twitch Badge Fetching (via websocket proxy)
        function fetchTwitchBadges() {
            console.log('Requesting Twitch global badges...');
            // Global badges
            socket.emit('twitch-api-request', {
                endpoint: 'https://api.twitch.tv/helix/chat/badges/global',
                method: 'GET',
                requestId: 'twitch-global-badges'
            });

            // User badges
            if (streamerID) {
                console.log('Requesting Twitch user badges for ID:', streamerID);
                socket.emit('twitch-api-request', {
                    endpoint: `https://api.twitch.tv/helix/chat/badges?broadcaster_id=${streamerID}`,
                    method: 'GET',
                    requestId: 'twitch-user-badges'
                });
            } else {
                console.warn('No streamer ID available for user badges request');
            }
        }

        // Cheermote Fetching (via websocket proxy)
        function fetchCheermotes() {
            if (streamerID) {
                console.log('Requesting cheermotes for ID:', streamerID);
                socket.emit('twitch-api-request', {
                    endpoint: `https://api.twitch.tv/helix/bits/cheermotes?broadcaster_id=${streamerID}`,
                    method: 'GET',
                    requestId: 'twitch-cheermotes'
                });
            } else {
                console.warn('No streamer ID available for cheermotes request');
            }
        }

        // Custom Sources: server emits ``chat_add_message`` (same as connectors)
        (function setupMycelianChatPreviewDemo() {
            var previewMode = {{ mycelian_preview_mode | default(false) | tojson }};
            var previewProfile = {{ mycelian_preview_profile | default("persistent") | tojson }};
            if (!previewMode || previewProfile !== 'animated_demo') {
                return;
            }
            function requestSamples() {
                socket.emit('mycelian_preview_emit_chat');
            }
            socket.on('connect', function () {
                setTimeout(requestSamples, 450);
            });
            if (socket.connected) {
                setTimeout(requestSamples, 450);
            }
        })();
    </script>
