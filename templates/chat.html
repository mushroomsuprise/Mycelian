<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mycelian Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script>MycelianLog.init({ templateName: 'chat' });</script>
    <style>
        @font-face {
            font-family: chat-font;
            src: url("/assets/default_assets/fonts/{{FontName}}");
        }

        @font-face {
            font-family: event-font;
            src: url("/assets/default_assets/fonts/{{EventFontName}}");
        }

        @font-face {
            font-family: alert-event-font;
            src: url("/assets/default_assets/fonts/{{AlertEventFontName}}");
        }

        /* Dynamic font classes for randomization */
        .random-message-font {
            /* Font will be set dynamically via JavaScript */
            font-family: inherit; /* Placeholder to avoid empty ruleset warning */
        }

        .random-username-font {
            /* Font will be set dynamically via JavaScript */
            font-family: inherit; /* Placeholder to avoid empty ruleset warning */
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: chat-font, Arial, sans-serif;
            overflow: hidden;
            background: transparent;
        }

        #chat {
            background-color: {{ BGColorWithOpacity }};
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;

            padding: {{ ChatPadding }}px;
            box-sizing: border-box;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* Internet Explorer 10+ */
        }

        #chat::-webkit-scrollbar {
            display: none;
            /* WebKit */
        }

        .chat-message {
            list-style-type: none;

            background-color: {{ MessageBG }};
            box-sizing: border-box;

            padding: {{ MessagePadding }}px;

            margin: {{ MessageMargin }}px 0;

            font-size: {{ FontSize }}px;

            color: {{ FontColor }};

            border-radius: {{ MessageRadius }}px;

            border: {{ MessageBorder }}px solid {{ MessageBorderColor }};
            word-wrap: break-word;
            display: block;

            {% if MessageAnimation == "none" %}
            animation: none;
            {% else %}
            animation: {{ MessageAnimation }} {{ AnimationDuration }}s {{ AnimationEasing }};
            {% endif %}

            min-height: {{ MinMessageHeight }}px;
            flex-shrink: 0;

            /* Prevent messages from shrinking */
            line-height: {{ LineHeight }};
        }

        .message-header {
            display: inline-block;
            white-space: nowrap;
            margin-right: 5px;
            vertical-align: baseline;
        }

        .chat-message.event-message {
            font-family: event-font, chat-font, Arial, sans-serif;
            background-color: {{ EventBG }};
            color: {{ EventColor }};
            font-style: italic;
            font-size: {{ EventFontSize }}px;
            border-left: {{ EventBorderWidth }}px solid {{ EventBorderColor }};
        }

        .chat-message.alert-event-message {
            font-family: alert-event-font, event-font, chat-font, Arial, sans-serif;
            font-size: {{ AlertEventFontSize }}px;
            color: {{ AlertEventColor }};
            font-weight: {{ AlertEventFontWeight }};
            font-style: {{ AlertEventFontStyle }};
            line-height: {{ AlertEventLineHeight }};
            display: flex;
            align-items: center;
            gap: {{ AlertEventMediaGap }}px;
            position: relative;
            overflow: hidden;
            border: {{ AlertEventBorderWidth }}px solid {{ AlertEventBorderColor }};
            border-radius: {{ AlertEventBorderRadius }}px;
            padding: {{ AlertEventPadding }}px;
            {% if AlertEventEnterAnimation == "none" %}
            animation: none;
            {% else %}
            animation: {{ AlertEventEnterAnimation }} {{ AlertEventEnterDuration }}s {{ AlertEventEnterEasing }};
            {% endif %}
            {% if AlertEventBG and AlertEventBG != 'transparent' %}
            background-color: {{ AlertEventBG }};
            {% endif %}
            {% if AlertEventBGImage %}
            background-image: url('{{ AlertEventBGImage }}');
            background-size: {{ AlertEventBGSize }};
            background-position: {{ AlertEventBGPosition }};
            background-repeat: {{ AlertEventBGRepeat }};
            {% endif %}
        }

        .chat-message.alert-event-message .alert-event-media,
        .chat-message.alert-event-message .alert-event-body {
            position: relative;
            z-index: 2;
        }

        {% if AlertEventShimmer %}
        .chat-message.alert-event-message::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(
                100deg,
                transparent 15%,
                {{ AlertEventShimmerColor }} 50%,
                transparent 85%
            );
            opacity: {{ AlertEventShimmerOpacity }};
            transform: translateX(-150%);
            animation: alertEventShimmer {{ AlertEventShimmerDuration }}s ease-in-out {{ AlertEventShimmerRepeat }};
            pointer-events: none;
            z-index: 1;
        }
        {% endif %}

        .alert-event-media {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            padding: {{ AlertEventMediaPadding }}px;
        }

        .alert-event-media img,
        .alert-event-media video {
            height: calc({{ AlertEventFontSize }}px * {{ AlertMediaScale }});
            width: auto;
            object-fit: contain;
            vertical-align: middle;
            border-radius: 2px;
        }

        .alert-event-body {
            flex: 1;
            min-width: 0;
            padding: {{ AlertEventTextPadding }}px;
        }

        .alert-event-text {
            display: inline;
        }

        .alert-event-user-message {
            display: block;
            margin-top: 2px;
            font-size: calc({{ AlertEventFontSize }}px * {{ AlertEventUserMessageScale }});
            font-style: {{ AlertEventUserMessageStyle }};
            {% if AlertEventUserMessageColor and AlertEventUserMessageColor != 'inherit' %}
            color: {{ AlertEventUserMessageColor }};
            {% endif %}
            opacity: {{ AlertEventUserMessageOpacity }};
        }

        .alert-event-user-message .emote-img,
        .alert-event-user-message .emote-base,
        .alert-event-user-message .emote-zw,
        .alert-event-user-message .cheermote-img {
            height: calc(28px * {{ AlertEventUserMessageEmoteScale }});
        }

        .alert-event-user-message .emote-img,
        .alert-event-user-message .emote-container,
        .alert-event-user-message .emote-zw,
        .alert-event-user-message .cheermote-container {
            margin: 0 {{ AlertEventUserMessageEmoteMargin }}px;
        }

        /* Activity feed event message styles */
        .chat-message.activity-event {
            font-style: italic;
            color: rgba(180, 180, 180, 0.8);
            background-color: transparent;
            border: none;
            border-left: 2px solid rgba(120, 120, 120, 0.3);

            font-size: calc({{ FontSize }}px * 0.85);
            opacity: 0.8;
            margin: calc({{ MessageMargin }}px * 0.3) 0;
            padding: calc({{ MessagePadding }}px * 0.4) calc({{ MessagePadding }}px * 0.6);
        min-height: auto;
        font-weight: 300;
        }

        .chat-message.activity-event .message-content {
            color: inherit;
            font-size: inherit;
        }

        /* Moderation event styles */
        .chat-message.moderation-delete {
            background-color: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff0000;
        }

        .chat-message.moderation-timeout {
            background-color: rgba(255, 165, 0, 0.2);
            border-left: 4px solid #ffa500;
        }

        .chat-message.moderation-ban {
            background-color: rgba(128, 0, 128, 0.2);
            border-left: 4px solid #800080;
        }

        .chat-message.moderation-warning {
            background-color: rgba(255, 255, 0, 0.2);
            border-left: 4px solid #ffff00;
        }

        .message-badges {
            display: inline;
            margin-right: {{ BadgeGap }}px;
        }

        .badge-img {
            width: {{ BadgeSize }}px;
            height: {{ BadgeSize }}px;
            vertical-align: middle;
            border-radius: {{ BadgeRadius }}px;
            margin-right: {{ BadgeGap }}px;
        }

        .message-username {
            font-size: {{ UsernameFontSize }}px;
            font-weight: {{ UsernameFontWeight }};
            color: {{ UsernameColor }};
            margin-right: {{ UsernameMargin }}px;
            flex-shrink: 0;
            text-shadow: {{ UsernameTextShadow }};
        }

        .message-content {
            display: inline;
            vertical-align: baseline;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-content-block {
            display: block;
            margin-top: 2px;
            margin-left: 0;
            text-indent: 0;
        }

        /* Emotes: layout uses height (not transform scale) so inline flow matches visual size (~28px nominal) */
        .emote-img,
        .emote-base,
        .emote-zw {
            height: calc(28px * {{ EmoteScale }});
            width: auto;
            object-fit: contain;
            vertical-align: middle;
            border-radius: {{ EmoteRadius }}px;
            box-sizing: border-box;
        }

        .emote-img {
            margin: 0 {{ EmoteMargin }}px;
        }

        .emote-container {
            position: relative;
            display: inline-block;
            margin: 0 {{ EmoteMargin }}px;
            vertical-align: middle;
        }

        .emote-base {
            display: block;
        }

        .emote-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: {{ EmoteRadius }}px;
            pointer-events: none;
            z-index: 1;
            box-sizing: border-box;
        }

        .emote-zw {
            /* Visual indicator for standalone zero-width emotes */
            opacity: 0.8;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            margin: 0 {{ EmoteMargin }}px;
        }

        /* Gigantified: 112px CDN tier; height matches EmoteScale * multiplier vs normal ~28px emote */
        .gigantified-emote {
            height: calc(28px * {{ EmoteScale }} * {{ GigantifiedTwitchDisplayScale }}) !important;
            width: auto !important;
            object-fit: contain !important;
            vertical-align: middle;
            margin: 0 !important;
        }

        .emote-img.gigantified-emote {
            margin: 0 {{ EmoteMargin }}px !important;
        }

        .gigantified-emote.emote-zw {
            /* Zero-width gigantified emotes should still be visible */
            opacity: 1;
            border: none;
        }

        /* Messages containing gigantified emotes need extra line height to prevent overlap */
        .chat-message.gigantified-message {
            line-height: calc({{ LineHeight }} * (0.55 + {{ GigantifiedTwitchDisplayScale }} * 0.35));
            padding: calc({{ MessagePadding }}px * (1 + {{ GigantifiedTwitchDisplayScale }} * 0.2)) {{ MessagePadding }}px;
        }

        .cheermote-container {
            display: inline-block;
            align-items: center;
            gap: 2px;
            margin: 0 {{ EmoteMargin }}px;
        }

        .cheermote-img {
            height: calc(28px * {{ EmoteScale }});
            width: auto;
            object-fit: contain;
            vertical-align: middle;
        }

        .cheermote-amount {
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .timestamp {
            font-size: {{ TimestampSize }}px;
            color: {{ TimestampColor }};
            margin-right: {{ TimestampMargin }}px;
            opacity: {{ TimestampOpacity }};
            vertical-align: baseline;
        }

        .message-reply {
            display: block;
            font-size: calc({{ FontSize }}px * {{ ReplyFontScale }});
            color: {{ ReplyColor }};
            opacity: 0.85;
            margin-bottom: 4px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .point-cost {
            margin-left: 6px;
            font-weight: 500;
        }

        .point-icon {
            width: {{ PointIconSize }}px;
            height: {{ PointIconSize }}px;
            vertical-align: middle;
            margin-left: 6px;
            object-fit: contain;
        }

        /* Animation keyframes */
        @keyframes slideIn {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInTop {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideInBottom {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes flipInX {
            0% {
                transform: perspective(420px) rotateX(88deg);
                opacity: 0;
            }

            100% {
                transform: perspective(420px) rotateX(0deg);
                opacity: 1;
            }
        }

        @keyframes elasticIn {
            0% {
                transform: scale(0.25);
                opacity: 0;
            }

            45% {
                transform: scale(1.06);
            }

            65% {
                transform: scale(0.94);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes alertEventShimmer {
            0% {
                transform: translateX(-150%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .chat-message {
                font-size: calc({{ FontSize }}px * 0.9);
                padding: calc({{ MessagePadding }}px * 0.8);
            }

        .chat-message.activity-event {
            font-size: calc({{ FontSize }}px * 0.75);
            padding: calc({{ MessagePadding }}px * 0.3) calc({{ MessagePadding }}px * 0.5);
            margin: calc({{ MessageMargin }}px * 0.2) 0;
        }

        .message-header {
            margin-right: 3px;
        }

        .message-content {
            /* Remove margin-top for inline flow */
            margin-top: 0; /* Explicitly set to avoid empty ruleset warning */
        }

        .emote-img:not(.gigantified-emote),
        .emote-base:not(.gigantified-emote),
        .emote-zw:not(.gigantified-emote) {
            height: calc(28px * {{ EmoteScale }} * 0.8);
        }

        .emote-img.gigantified-emote,
        .emote-base.gigantified-emote,
        .emote-zw.gigantified-emote {
            height: calc(28px * {{ EmoteScale }} * {{ GigantifiedTwitchDisplayScale }} * 0.8) !important;
        }

        .cheermote-img {
            height: calc(28px * {{ EmoteScale }} * 0.8);
        }

        .emote-container {
            margin: 0 calc({{ EmoteMargin }}px * 0.8);
        }

        .cheermote-container {
            margin: 0 calc({{ EmoteMargin }}px * 0.8);
        }
        }

        /* Text wrapping styles */
        .message-content {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>

<body>
    <div id="chat"></div>

    <script>
        // Global variables
        function resetChatClientState() {
            emoteFetchInProgress = false;
            badgeFetchInProgress = false;
        }

        function recoverChatOverlay() {
            resetChatClientState();
            requestStreamerInfo();
            setTimeout(function () {
                if (streamerID) {
                    fetchAllEmotesAndBadges();
                }
            }, 400);
        }

        var socket = MycelianOverlay.connect('http://' + document.domain + ':' + location.port, {
            services: ['twitch'],
            onRecovery: recoverChatOverlay
        });
        var messageCount = 0;
        var maxMessages = {{ MaxMessages | tojson }};
        var showTimestamps = {{ ShowTimestamps | tojson }};
        var timestampFormat = {{ TimestampFormat | tojson }};
        var showReplies = {{ ShowReplies | tojson }};
        var replyMaxLength = {{ ReplyMaxLength | tojson }};
        var showPointCost = {{ ShowPointCost | tojson }};
        var showPointIcon = {{ ShowPointIcon | tojson }};
        var pointIconSize = {{ PointIconSize | tojson }};
        var filterUnknownSlashCommands = {{ FilterUnknownSlashCommands | tojson }};
        var enableEmotes = {{ EnableEmotes | tojson }};
        var enableBadges = {{ EnableBadges | tojson }};
        var alertShowActivitySummary = {{ AlertShowActivitySummary | tojson }};
        var alertShowTwitchChat = {{ AlertShowTwitchChat | tojson }};
        var alertShowMediaEvent = {{ AlertShowMediaEvent | tojson }};
        var eventFontSize = {{ EventFontSize | tojson }};
        var alertMediaScale = {{ AlertMediaScale | tojson }};
        var streamerID = null;
        var emoteFetchInProgress = false;
        var badgeFetchInProgress = false;
        var CHAT_DEBUG = false;

        function chatLog() {
            if (CHAT_DEBUG) {
                console.log.apply(console, arguments);
            }
        }

        // Font randomization settings
        var enableMessageFontRandomization = {{ EnableMessageFontRandomization | tojson }};
        var enableUsernameFontRandomization = {{ EnableUsernameFontRandomization | tojson }};
        var randomFontList = {{ RandomFontList | tojson }}.split('\n').map(function (font) {
            return font.trim();
        }).filter(function (font) {
            return font.length > 0;
        });

        // Username filtering settings
        var enableUsernameFiltering = {{ EnableUsernameFiltering | tojson }};
        var filteredUsernames = {{ FilteredUsernames | tojson }}.toLowerCase().split('\n').map(function (username) {
            return username.trim();
        }).filter(function (username) {
            return username.length > 0;
        });

        // Keep in sync with modules/twitch_chat_commands.py TWITCH_SLASH_COMMANDS (/me excluded — shown as ACTION)
        var TWITCH_SLASH_COMMANDS = [
            'mods', 'vips', 'color', 'block', 'unblock', 'disconnect', 'whisper',
            'user', 'timeout', 'ban', 'unban', 'slow', 'slowoff', 'followers', 'followersoff',
            'subscribers', 'subscribersoff', 'clear', 'uniquechat', 'uniquechatoff',
            'emoteonly', 'emoteonlyoff', 'commercial', 'host', 'unhost', 'raid', 'unraid',
            'marker', 'mod', 'unmod', 'vip', 'unvip'
        ];

        var channelPointsIconCache = {
            broadcasterId: null,
            url: null,
            loaded: false,
            failed: false
        };

        function isAllowedSlashMessage(message) {
            var text = (message || '').trim();
            if (text.charAt(0) !== '/') {
                return true;
            }
            var cmd = text.substring(1).split(/\s+/)[0].toLowerCase();
            return TWITCH_SLASH_COMMANDS.indexOf(cmd) === -1;
        }

        function normalizeTimestamp(ts) {
            var n = Number(ts);
            if (!n) {
                return Date.now();
            }
            return n > 1e12 ? n : n * 1000;
        }

        function pickChannelPointsIconUrl(icons) {
            if (!icons) {
                return null;
            }
            var size = Number(pointIconSize) || 14;
            var dpr = window.devicePixelRatio || 1;
            if (size * dpr > 56 && icons.url_4x) {
                return icons.url_4x;
            }
            if (size * dpr > 28 && icons.url_2x) {
                return icons.url_2x;
            }
            return icons.url_1x || icons.url_2x || icons.url_4x || null;
        }

        function preloadChannelPointsIcon(url) {
            if (!url) {
                channelPointsIconCache.loaded = false;
                channelPointsIconCache.failed = true;
                return;
            }
            channelPointsIconCache.url = url;
            channelPointsIconCache.loaded = false;
            channelPointsIconCache.failed = false;
            var img = new Image();
            img.onload = function () {
                channelPointsIconCache.loaded = true;
            };
            img.onerror = function () {
                channelPointsIconCache.failed = true;
            };
            img.src = url;
        }

        function applyChannelPointsIconFromStreamerInfo(data) {
            if (!data || !data.channel_points_icon) {
                channelPointsIconCache.url = null;
                channelPointsIconCache.loaded = false;
                channelPointsIconCache.failed = false;
                return;
            }
            var url = pickChannelPointsIconUrl(data.channel_points_icon);
            channelPointsIconCache.broadcasterId = data.user_id || null;
            preloadChannelPointsIcon(url);
        }

        function buildReplyHeaderHtml(reply) {
            if (!showReplies || !reply) {
                return '';
            }
            var parentUser = reply.parent_user_name || reply.parent_user_login || 'Unknown';
            var body = (reply.parent_message_body || '').trim();
            body = body.split(/\r?\n/)[0].trim();
            var mentionPrefix = '@' + parentUser;
            if (body.toLowerCase().indexOf(mentionPrefix.toLowerCase()) === 0) {
                body = body.substring(mentionPrefix.length).trim();
            }
            if (body.length > replyMaxLength) {
                body = body.substring(0, replyMaxLength) + '\u2026';
            }
            var parentId = reply.parent_message_id || reply.thread_message_id || '';
            return '<div class="message-reply" data-reply-parent-id="' + escapeHtml(parentId) + '">' +
                '\u21A9 Replying to @' + escapeHtml(parentUser) + ': ' + escapeHtml(body) + '</div>';
        }

        function stripReplyMentionFromMessage(text, reply) {
            if (!reply || text == null) {
                return { text: text, removedChars: 0 };
            }
            var trimmed = String(text).trim();
            var candidates = [];
            if (reply.parent_user_login) {
                candidates.push(reply.parent_user_login);
            }
            if (reply.parent_user_name) {
                candidates.push(reply.parent_user_name);
            }
            for (var i = 0; i < candidates.length; i++) {
                var login = candidates[i];
                if (!login) {
                    continue;
                }
                var escapedLogin = login.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var prefixRe = new RegExp('^@' + escapedLogin + '\\s*', 'i');
                var match = trimmed.match(prefixRe);
                if (match) {
                    var removedChars = match[0].length;
                    return { text: trimmed.substring(removedChars).trimStart(), removedChars: removedChars };
                }
            }
            return { text: trimmed, removedChars: 0 };
        }

        function isPointsActivityAlert(alertData) {
            var badgeType = (alertData.badge_type || '').toLowerCase();
            var alertType = (alertData.type || alertData.alert_type || '').toLowerCase();
            return badgeType === 'points' || alertType === 'points' || alertType === 'point';
        }

        function resolvePointCost(alertData) {
            if (alertData.point_cost != null) {
                return Number(alertData.point_cost) || 0;
            }
            if (alertData.stored_alert_data && alertData.stored_alert_data.point_cost != null) {
                return Number(alertData.stored_alert_data.point_cost) || 0;
            }
            return 0;
        }

        function buildPointRedemptionSuffixHtml(alertData) {
            if (!isPointsActivityAlert(alertData)) {
                return '';
            }
            var suffix = '';
            if (showPointIcon && channelPointsIconCache.url && channelPointsIconCache.loaded) {
                suffix += '<img class="point-icon" src="' + escapeHtml(channelPointsIconCache.url) + '" alt="">';
            }
            var cost = resolvePointCost(alertData);
            if (showPointCost && cost > 0) {
                suffix += '<span class="point-cost">' + escapeHtml(cost.toLocaleString()) + '</span>';
            }
            return suffix;
        }

        // Username color randomization
        var randomUsernameColors = [
            "rgb(255, 0, 0)",
            "rgb(0, 0, 255)",
            "rgb(0, 128, 0)",
            "rgb(178, 34, 34)",
            "rgb(255, 127, 80)",
            "rgb(154, 205, 50)",
            "rgb(255, 69, 0)",

            var style = document.createElement('style');

                '@font-face {' +

        // Handle Twitch API responses
        function handleTwitchApiResponse(data) {
            chatLog('Received twitch-api-response:', data);

            if (!data || !data.requestId) {
                console.error('Invalid response data:', data);
                return;
            }

            try {
                chatLog('Processing request ID:', data.requestId, 'Success:', data.success);

                if (!data.success) {
                    var errText = (data.error || '').toLowerCase();
                    var retryableTwitch =
                        data.requestId &&
                        data.requestId.indexOf('twitch-') === 0 &&
                        (errText.indexOf('not initialized') !== -1 ||
                            errText.indexOf('not ready') !== -1 ||
                            errText.indexOf('not connected') !== -1 ||
                            errText.indexOf('network error') !== -1 ||
                            errText.indexOf('cannot connect') !== -1);
                    if (retryableTwitch) {
                        if (typeof MycelianLog !== 'undefined') {
                            MycelianLog.warn(
                                'API request failed (retry scheduled): ' + data.error + ' for request: ' + data.requestId,
                                { source: 'handleTwitchApiResponse' }
                            );
                        } else {
                            console.warn('API request failed:', data.error, 'for request:', data.requestId);
                        }
                        chatLog('Scheduling Twitch API retry for', data.requestId);
                        setTimeout(function () {
                            emoteFetchInProgress = false;
                            if (data.requestId === 'twitch-global-badges' ||
                                data.requestId === 'twitch-user-badges') {
                                fetchTwitchBadges();
                            } else if (data.requestId === 'twitch-global-emotes') {
                                fetchTwitchEmotes();
                            } else if (data.requestId === 'twitch-cheermotes') {
                                fetchCheermotes();
                            } else {
                                fetchAllEmotesAndBadges();
                            }
                        }, 2000);
                    } else {
                        console.error('API request failed:', data.error, 'for request:', data.requestId);
                        emoteFetchInProgress = false;
                    }
                    return;
                }

                switch (data.requestId) {
                    case 'twitch-global-emotes':
                        chatLog('Processing twitch-global-emotes response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            emoteCache.twitch.global = data.data.data;
                            rebuildEmoteLookupMap();
                            chatLog('Twitch global emotes loaded:', emoteCache.twitch.global.length);
                        } else {
                            console.error('Invalid twitch-global-emotes response structure:', data.data);
                        }
                        break;

                    case 'twitch-global-badges':
                        chatLog('Processing twitch-global-badges response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            badgeCache.global = data.data.data;
                            chatLog('Twitch global badges loaded:', badgeCache.global.length);
                        } else {
                            console.error('Invalid twitch-global-badges response structure:', data.data);
                        }
                        break;

                    case 'twitch-user-badges':
                        chatLog('Processing twitch-user-badges response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            badgeCache.user = data.data.data;
                            chatLog('Twitch user badges loaded:', badgeCache.user.length);
                        } else {
                            console.error('Invalid twitch-user-badges response structure:', data.data);
                        }
                        break;

                    case 'twitch-cheermotes':
                        chatLog('Processing twitch-cheermotes response:', data.data);
                        if (data.success && data.data && data.data.data) {
                            processCheermotes(data.data.data);
                            chatLog('Cheermotes loaded');
                        } else {
                            console.error('Invalid twitch-cheermotes response structure:', data.data);
                        }
                        break;

                    default:
                        console.warn('Unknown request ID:', data.requestId);
                        break;
                }
            } catch (error) {
                console.error('Error handling Twitch API response:', error, 'for data:', data);
            }

            // Mark fetch as complete after all requests
            setTimeout(() => {
                emoteFetchInProgress = false;
            }, 1000);
        }

        // Process cheermotes into usable format
        function processCheermotes(cheermoteData) {
            emoteCache.cheermotes = {};

            cheermoteData.forEach(function (cheermote) {
                var prefix = cheermote.prefix.toLowerCase();
                emoteCache.cheermotes[prefix] = {};

                cheermote.tiers.forEach(function (tier) {
                    var minBits = tier.min_bits;
                    var images = tier.images;

                    // Use the animated version if available, otherwise static
                    var imageUrl = '';
                    var color = tier.color || '#ffffff';

                    if (images.dark && images.dark.animated && images.dark.animated['1']) {
                        imageUrl = images.dark.animated['1'];
                    } else if (images.dark && images.dark.static && images.dark.static['1']) {
                        imageUrl = images.dark.static['1'];
                    } else if (images.light && images.light.animated && images.light.animated['1']) {
                        imageUrl = images.light.animated['1'];
                    } else if (images.light && images.light.static && images.light.static['1']) {
                        imageUrl = images.light.static['1'];
                    }

                    if (imageUrl) {
                        emoteCache.cheermotes[prefix][minBits] = {};
                        emoteCache.cheermotes[prefix][minBits][imageUrl] = color;
                    }
                });
            });
        }

        function formatWatchStreakMessage(username, streakCount, includeUsername) {

        function lookupChatAlertField(alertData, key1, key2, key3, key4) {
            var keys = Array.prototype.slice.call(arguments, 1);
            var stored = alertData.stored_alert_data;
            if (!stored || typeof stored !== 'object') {
                stored = {};
            }
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key in alertData && alertData[key] != null) {
                    return alertData[key];
                }
                if (key in stored && stored[key] != null) {
                    return stored[key];
                }
            }
            return null;
        }

        function formatGiftSubMessage(alertData) {
            var username = lookupChatAlertField(alertData, 'username') || extractUsernameFromMessage(alertData) || 'Someone';
            var qtyRaw = lookupChatAlertField(alertData, 'gift_qty', 'quantity');
            var qty = parseInt(qtyRaw, 10);
            if (isNaN(qty) || qty < 1) {
                var message = alertData.message || '';
                var qtyMatch = message.match(/gifted\s+(\d+)/i);
                qty = qtyMatch ? parseInt(qtyMatch[1], 10) : 1;
            }
            if (isNaN(qty) || qty < 1) {
                qty = 1;
            }
            var tier = lookupChatAlertField(alertData, 'tier') || 1;
            var recipient = String(
                lookupChatAlertField(alertData, 'recipient', 'recipient_name') || ''
            ).trim();
            if (qty === 1 && recipient) {
                return username + ' gifted a tier ' + tier + ' sub to ' + recipient + '!';
            }
            if (qty === 1) {
                return username + ' gifted a tier ' + tier + ' sub!';
            }
            return username + ' gifted ' + qty + ' tier ' + tier + ' subs!';
        }

        function formatBitsMessage(alertData) {
            var username = lookupChatAlertField(alertData, 'username') || extractUsernameFromMessage(alertData) || 'Someone';
            var amount = parseInt(lookupChatAlertField(alertData, 'amt_cheered', 'bits', 'amount'), 10) || 1;
            var label = amount === 1 ? 'bit' : 'bits';
            return username + ' cheered ' + amount + ' ' + label + '!';

        function formatResubMessage(alertData) {
            var username = lookupChatAlertField(alertData, 'username') || extractUsernameFromMessage(alertData) || 'Someone';
            var months = parseInt(
                lookupChatAlertField(alertData, 'resub_month', 'months', 'total_months', 'cumulative_months'),
                10

            var monthLabel = months === 1 ? 'month' : 'months';
            return username + ' has resubscribed for ' + months + ' ' + monthLabel + '!';

        function isHypeTrainAlertType(alertData) {
            var t = normalizeChatAlertType(alertData);

        function resolveHypeTrainLevel(alertData) {
            var level = lookupChatAlertField(alertData, 'level', 'hype_train_level');
            if (level != null) {
                var parsed = parseInt(level, 10);
                if (!isNaN(parsed)) {
                    return parsed;

            var message = alertData.message || '';

        function resolveHypeTrainTypePhrase(alertData) {
            var raw = lookupChatAlertField(alertData, 'hype_train_type');
            var trainType = raw != null ? String(raw).trim().toLowerCase() : 'regular';
            if (trainType === 'treasure') {
                return 'Treasure Train';

            if (trainType === 'golden_kappa') {
                return 'Golden Kappa train';

            return 'hype train';

        function isHypeTrainEndMessage(alertData) {

        function formatHypeTrainMessage(alertData) {
            var level = resolveHypeTrainLevel(alertData);

        function resolveActivityEventText(alertData) {
            var eventText = '';
            var alertType = (alertData.type || alertData.alert_type || '').toLowerCase();

            if (alertType === 'streak') {

                eventText = formatWatchStreakMessage(

                );
            } else if (alertType === 'giftsub') {
                eventText = formatGiftSubMessage(alertData);
            } else if (alertType === 'bits' || alertType === 'bit') {
                eventText = formatBitsMessage(alertData);
            } else if (alertType === 'resub') {
                eventText = formatResubMessage(alertData);
            } else if (isHypeTrainAlertType(alertData)) {
                eventText = formatHypeTrainMessage(alertData);
            } else if (alertData.message) {
                eventText = alertData.message;
            } else {
                alertType = alertData.type || 'Unknown';
                var username = extractUsernameFromMessage(alertData) || 'Someone';

                switch (alertType.toLowerCase()) {

        function resolveRaidRaiderCount(alertData) {

            if (stored.raider_count != null) {
                return stored.raider_count;

            var message = alertData.message || '';
            var raidMatch = message.match(/(\d+)\s*viewers?/i);

        function generateAlertMessage(alertData) {
            var username = alertData.username || extractUsernameFromMessage(alertData.message || '');
            var alertType = (alertData.alert_type || alertData.type || '').toLowerCase();

            var resubMonths = parseInt(
                lookupChatAlertField(alertData, 'resub_month', 'months', 'total_months', 'cumulative_months'),
                10
            ) || 1;

            if (alertType === 'resub' || (alertType === 'sub' && resubMonths > 1)) {
                return formatResubMessage(alertData);
            }

            if (alertType === 'giftsub') {
                return formatGiftSubMessage(alertData);
            }

            if (alertType === 'bit' || alertType === 'bits') {
                return formatBitsMessage(alertData);
            }

            if (alertType === 'streak') {
                return formatWatchStreakMessage(username, resolveWatchStreakCount(alertData), true);
            }

            if (alertType === 'raid') {
                var raiderCount = resolveRaidRaiderCount(alertData);
                var gameName = resolveRaidGameName(alertData);
                if (raiderCount || gameName) {
                    return formatRaidActivityMessage(username, raiderCount, gameName);

            return alertData.message || resolveActivityEventText(alertData);

        // Parse badges into HTML
        function parseBadges(badgeString) {
            chatLog('parseBadges called with:', badgeString);

            if (!badgeString || badgeString === 'null') {
                chatLog('No badges to parse');
                return '';
            }

            var badges = badgeString.split(',');
            var badgeHTML = '';

            chatLog('Split badges:', badges);

            badges.forEach(function (badge) {
                var parts = badge.split('/');
                if (parts.length !== 2) {
                    chatLog('Invalid badge format:', badge);
                    return;
                }

                var badgeSet = parts[0];
                var badgeId = parts[1];

                chatLog('Processing badge:', badgeSet, '/', badgeId);

                // Check if badge is disabled
                if (disabledBadges[badgeSet]) {
                    chatLog('Badge disabled:', badgeSet);
                    return;
                }

                var badgeUrl = findBadgeUrl(badgeSet, badgeId);
                chatLog('Found badge URL for', badgeSet, '/', badgeId, ':', badgeUrl);

                if (badgeUrl) {
                    badgeHTML += '<img src="' + badgeUrl + '" class="badge-img" alt="' + badgeSet + '">';
                } else {
                    chatLog('No URL found for badge:', badgeSet, '/', badgeId);
                }
            });

            chatLog('Final badge HTML:', badgeHTML);
            return badgeHTML;
        }

        // Find badge URL in cache
        function findBadgeUrl(badgeSet, badgeId) {
            // Check user badges first
            for (var i = 0; i < badgeCache.user.length; i++) {
                var badge = badgeCache.user[i];
                if (badge.set_id === badgeSet) {
                    for (var j = 0; j < badge.versions.length; j++) {
                        if (badge.versions[j].id === badgeId) {
                            return badge.versions[j].image_url_1x;
                        }
                    }
                }
            }

            // Check global badges
            for (var i = 0; i < badgeCache.global.length; i++) {
                var badge = badgeCache.global[i];
                if (badge.set_id === badgeSet) {
                    for (var j = 0; j < badge.versions.length; j++) {
                        if (badge.versions[j].id === badgeId) {
                            return badge.versions[j].image_url_1x;
                        }
                    }
                    // If exact match not found, try to find a fallback version
                    if (badge.versions.length > 0) {
                        // For subscriber badges, try to find the appropriate tier
                        if (badgeSet === 'subscriber') {
                            var targetMonths = parseInt(badgeId);
                            var bestMatch = null;

                            // Sort versions by month count (ascending)
                            var sortedVersions = badge.versions.slice().sort(function (a, b) {
                                return parseInt(a.id) - parseInt(b.id);
                            });

                            // Find the highest tier that's still <= target months
                            for (var k = sortedVersions.length - 1; k >= 0; k--) {
                                var versionMonths = parseInt(sortedVersions[k].id);
                                if (versionMonths <= targetMonths) {
                                    bestMatch = sortedVersions[k];
                                    break;
                                }
                            }

                            // If no suitable tier found (target is less than all tiers), use the lowest tier
                            if (!bestMatch && sortedVersions.length > 0) {
                                bestMatch = sortedVersions[0];
                            }

                            if (bestMatch) {
                                chatLog('Using subscriber badge tier for', targetMonths, 'months:', bestMatch.id + '-month badge');
                                return bestMatch.image_url_1x;
                            }
                        }

                        // For other badges, use the first available version
                        return badge.versions[0].image_url_1x;
                    }
                }
            }

            return null;
        }

        function parseSubscriptionEmotesMessage(text, emotesList) {

            list.forEach(function (emote) {
                replacements.push({

                    emoteId: String(emote.id)

            });
            replacements.sort(function (a, b) { return b.start - a.start; });
            var processed = text;
            replacements.forEach(function (replacement) {
                var fallbackText = text.substring(replacement.start, replacement.end + 1);
                var before = processed.substring(0, replacement.start);
                var after = processed.substring(replacement.end + 1);
                processed = before + renderTwitchEmoteImg(replacement.emoteId, fallbackText) + after;
            });
            if (processed.indexOf('<img') !== -1 && processed.indexOf('emote-img') !== -1) {
                var parts = processed.split(/(<img[^>]*>)/);
                return parts.map(function (part) {

        function renderCheermoteFragment(frag) {

            var tier = null;
            for (var i = 0; i < tiers.length; i++) {

            if (tier === null) {

            var cheermoteData = emoteCache.cheermotes[prefix][tier];

        function parseBitsFragmentsMessage(text, fragments) {

        function parseAlertUserMessageHtml(alertData, userMessageText) {

        // Parse emotes in message

            pointIconSize = pointIconSizeCfg;
            var animRule = (messageAnimation === 'none')
                ? 'animation: none;'
                : ('animation: ' + messageAnimation + ' ' + animationDuration + 's ' + animationEasing + ';');

            return (
                '@font-face { font-family: chat-font; src: url("/assets/default_assets/fonts/' + fontName + '"); }' +
                '@font-face { font-family: event-font; src: url("/assets/default_assets/fonts/' + eventFontName + '"); }' +
                '@font-face { font-family: alert-event-font; src: url("/assets/default_assets/fonts/' + alertEventFontName + '"); }' +
                'html, body { font-family: chat-font, Arial, sans-serif; }' +
                '#chat { background-color: ' + bgColor + '; padding: ' + chatPadding + 'px; }' +
                '.chat-message { background-color: ' + messageBG + '; padding: ' + messagePadding + 'px; margin: ' + messageMargin + 'px 0; ' +
                'font-size: ' + fontSize + 'px; color: ' + fontColor + '; border-radius: ' + messageRadius + 'px; ' +
                'border: ' + messageBorder + 'px solid ' + messageBorderColor + '; ' + animRule +
                ' min-height: ' + minMessageHeight + 'px; line-height: ' + lineHeight + '; }' +
                '.chat-message.event-message { font-family: event-font, chat-font, Arial, sans-serif; background-color: ' + eventBG + '; ' +
                'color: ' + eventColor + '; font-size: ' + eventFontSizeCfg + 'px; border-left: ' + eventBorderWidth + 'px solid ' + eventBorderColor + '; }' +
                '.chat-message.alert-event-message { font-family: alert-event-font, event-font, chat-font, Arial, sans-serif; ' +
                'font-size: ' + alertEventFontSizeCfg + 'px; color: ' + alertEventColor + '; font-weight: ' + alertEventFontWeight + '; ' +
                'font-style: ' + alertEventFontStyle + '; line-height: ' + alertEventLineHeight + '; display: flex; align-items: center; gap: ' + alertEventMediaGap + 'px; ' +
                'position: relative; overflow: hidden; ' + alertEnterAnimRule + ' ' +
                'border: ' + alertEventBorderWidth + 'px solid ' + alertEventBorderColor + '; ' +
                'border-radius: ' + alertEventBorderRadius + 'px; padding: ' + alertEventPadding + 'px; ' +
                (alertEventBG && alertEventBG !== 'transparent' ? ('background-color: ' + alertEventBG + '; ') : '') +
                (alertEventBGImage ? (
                    'background-image: url("' + alertEventBGImage.replace(/"/g, '\\"') + '"); ' +
                    'background-size: ' + alertEventBGSize + '; ' +
                    'background-position: ' + alertEventBGPosition + '; ' +
                    'background-repeat: ' + alertEventBGRepeat + '; '
                ) : '') +
                '}' +
                '.chat-message.alert-event-message .alert-event-media, .chat-message.alert-event-message .alert-event-body { position: relative; z-index: 2; }' +
                '.alert-event-media { padding: ' + alertEventMediaPadding + 'px; }' +
                '.alert-event-body { padding: ' + alertEventTextPadding + 'px; }' +
                alertEventShimmerCss +
                '.alert-event-user-message { font-size: calc(' + alertEventFontSizeCfg + 'px * ' + alertEventUserMessageScale + '); ' +
                'font-style: ' + alertEventUserMessageStyle + '; opacity: ' + alertEventUserMessageOpacity + '; ' +
                (alertEventUserMessageColor ? ('color: ' + alertEventUserMessageColor + '; ') : '') +
                '}' +
                '.alert-event-user-message .emote-img, .alert-event-user-message .emote-base, .alert-event-user-message .emote-zw, ' +
                '.alert-event-user-message .cheermote-img { height: calc(28px * ' + alertUserEmoteScale + '); }' +
                '.alert-event-user-message .emote-img, .alert-event-user-message .emote-container, .alert-event-user-message .emote-zw, ' +
                '.alert-event-user-message .cheermote-container { margin: 0 ' + alertUserEmoteMargin + 'px; }' +
                '.alert-event-media img, .alert-event-media video { height: calc(' + alertEventFontSizeCfg + 'px * ' + alertMediaScaleCfg + '); width: auto; object-fit: contain; }' +
                '.chat-message.activity-event { font-size: calc(' + fontSize + 'px * 0.85); margin: calc(' + messageMargin + 'px * 0.3) 0; ' +
                'padding: calc(' + messagePadding + 'px * 0.4) calc(' + messagePadding + 'px * 0.6); }' +
                '.message-badges { margin-right: ' + badgeGap + 'px; }' +
                '.badge-img { width: ' + badgeSize + 'px; height: ' + badgeSize + 'px; border-radius: ' + badgeRadius + 'px; margin-right: ' + badgeGap + 'px; }' +
                '.message-username { font-size: ' + usernameFontSize + 'px; font-weight: ' + usernameFontWeight + '; color: ' + usernameColor + '; ' +
                'margin-right: ' + usernameMargin + 'px; text-shadow: ' + usernameTextShadow + '; }' +
                '.emote-img, .emote-base, .emote-zw { height: calc(28px * ' + emoteScale + '); border-radius: ' + emoteRadius + 'px; }' +
                '.emote-img { margin: 0 ' + emoteMargin + 'px; }' +
                '.emote-container { margin: 0 ' + emoteMargin + 'px; }' +
                '.emote-overlay { border-radius: ' + emoteRadius + 'px; }' +
                '.emote-zw { margin: 0 ' + emoteMargin + 'px; }' +
                '.gigantified-emote { height: calc(28px * ' + emoteScale + ' * ' + gigScale + ') !important; }' +
                '.emote-img.gigantified-emote { margin: 0 ' + emoteMargin + 'px !important; }' +
                '.chat-message.gigantified-message { line-height: calc(' + lineHeight + ' * (0.55 + ' + gigScale + ' * 0.35)); ' +
                'padding: calc(' + messagePadding + 'px * (1 + ' + gigScale + ' * 0.2)) ' + messagePadding + 'px; }' +
                '.cheermote-container { margin: 0 ' + emoteMargin + 'px; }' +
                '.cheermote-img { height: calc(28px * ' + emoteScale + '); }' +
                '.timestamp { font-size: ' + timestampSize + 'px; color: ' + timestampColor + '; margin-right: ' + timestampMargin + 'px; opacity: ' + timestampOpacity + '; }' +
                '.message-reply { font-size: calc(' + fontSize + 'px * ' + replyFontScale + '); color: ' + replyColor + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }' +
                '.point-icon { width: ' + pointIconSizeCfg + 'px; height: ' + pointIconSizeCfg + 'px; }' +
                '@media (max-width: 768px) { .chat-message { font-size: calc(' + fontSize + 'px * 0.9); padding: calc(' + messagePadding + 'px * 0.8); } ' +
                '.chat-message.activity-event { font-size: calc(' + fontSize + 'px * 0.75); padding: calc(' + messagePadding + 'px * 0.3) calc(' + messagePadding + 'px * 0.5); ' +
                'margin: calc(' + messageMargin + 'px * 0.2) 0; } ' +
                '.emote-img:not(.gigantified-emote), .emote-base:not(.gigantified-emote), .emote-zw:not(.gigantified-emote) { height: calc(28px * ' + emoteScale + ' * 0.8); } ' +
                '.emote-img.gigantified-emote, .emote-base.gigantified-emote, .emote-zw.gigantified-emote { height: calc(28px * ' + emoteScale + ' * ' + gigScale + ' * 0.8) !important; } ' +
                '.cheermote-img { height: calc(28px * ' + emoteScale + ' * 0.8); } ' +
                '.emote-container, .cheermote-container { margin: 0 calc(' + emoteMargin + 'px * 0.8); } }'
            );
        }

        function applyChatConfigGlobals(config) {
            if (config.MaxMessages !== undefined) { maxMessages = Number(config.MaxMessages); }
            if (config.ShowTimestamps !== undefined) { showTimestamps = !!config.ShowTimestamps; }
            if (config.TimestampFormat !== undefined) { timestampFormat = config.TimestampFormat; }
            if (config.ShowReplies !== undefined) { showReplies = !!config.ShowReplies; }
            if (config.ReplyMaxLength !== undefined) { replyMaxLength = Number(config.ReplyMaxLength); }
            if (config.ShowPointCost !== undefined) { showPointCost = !!config.ShowPointCost; }
            if (config.ShowPointIcon !== undefined) { showPointIcon = !!config.ShowPointIcon; }
            if (config.PointIconSize !== undefined) { pointIconSize = Number(config.PointIconSize); }
            if (config.FilterUnknownSlashCommands !== undefined) {
                filterUnknownSlashCommands = !!config.FilterUnknownSlashCommands;
            }
            if (config.EnableEmotes !== undefined) { enableEmotes = !!config.EnableEmotes; }
            if (config.EnableBadges !== undefined) { enableBadges = !!config.EnableBadges; }
            if (config.AlertShowActivitySummary !== undefined) {
                alertShowActivitySummary = !!config.AlertShowActivitySummary;
            }
            if (config.AlertShowTwitchChat !== undefined) {
                alertShowTwitchChat = !!config.AlertShowTwitchChat;
            }
            if (config.AlertShowMediaEvent !== undefined) {
                alertShowMediaEvent = !!config.AlertShowMediaEvent;
            }
            if (config.EventFontSize !== undefined) {
                eventFontSize = Number(config.EventFontSize);
            }
            if (config.AlertMediaScale !== undefined) {
                alertMediaScale = Number(config.AlertMediaScale);
            }
            if (config.EnableMessageFontRandomization !== undefined) {
                enableMessageFontRandomization = !!config.EnableMessageFontRandomization;
            }
            if (config.EnableUsernameFontRandomization !== undefined) {
                enableUsernameFontRandomization = !!config.EnableUsernameFontRandomization;
            }
            if (config.RandomFontList !== undefined) {
                randomFontList = String(config.RandomFontList).split('\n').map(function (f) {
                    return f.trim();
                }).filter(function (f) { return f.length > 0; });
            }
            updateChatSettings({
                maxMessages: maxMessages,
                showTimestamps: showTimestamps,
                timestampFormat: timestampFormat,
                showReplies: showReplies,
                replyMaxLength: replyMaxLength,
                showPointCost: showPointCost,
                showPointIcon: showPointIcon,
                pointIconSize: pointIconSize,
                alertShowActivitySummary: alertShowActivitySummary,
                alertShowTwitchChat: alertShowTwitchChat,
                alertShowMediaEvent: alertShowMediaEvent,
                eventFontSize: eventFontSize,
                alertMediaScale: alertMediaScale,
                filterUnknownSlashCommands: filterUnknownSlashCommands,
                enableEmotes: enableEmotes,
                enableBadges: enableBadges,
                enableMessageFontRandomization: enableMessageFontRandomization,
                enableUsernameFontRandomization: enableUsernameFontRandomization,
                randomFontList: config.RandomFontList,
                enableUsernameFiltering: config.EnableUsernameFiltering,
                filteredUsernames: config.FilteredUsernames
            });
            if (config.DisableModerator !== undefined) { disabledBadges.moderator = !!config.DisableModerator; }
            if (config.DisableVIP !== undefined) { disabledBadges.vip = !!config.DisableVIP; }
            if (config.DisableSubscriber !== undefined) { disabledBadges.subscriber = !!config.DisableSubscriber; }
            if (config.DisableFounder !== undefined) { disabledBadges.founder = !!config.DisableFounder; }
            if (config.DisableBroadcaster !== undefined) { disabledBadges.broadcaster = !!config.DisableBroadcaster; }
            if (config.DisableTurbo !== undefined) { disabledBadges.turbo = !!config.DisableTurbo; }
            if (config.DisableStaff !== undefined) { disabledBadges.staff = !!config.DisableStaff; }
            if (config.DisableBits !== undefined) { disabledBadges.bits = !!config.DisableBits; }
            if (config.DisableAdmin !== undefined) { disabledBadges.admin = !!config.DisableAdmin; }
            if (config.DisablePartner !== undefined) { disabledBadges.partner = !!config.DisablePartner; }
        }

        function applyTemplateConfig(config) {
            var styleEl = document.getElementById('mycelian-chat-preview-dynamic');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'mycelian-chat-preview-dynamic';
                document.head.appendChild(styleEl);
            }
            styleEl.textContent = buildChatPreviewCss(config);
            applyChatConfigGlobals(config);
        }

        async function loadTemplateConfig() {
            try {
                var response = await fetch('/api/template-config/chat', { credentials: 'same-origin' });
                if (!response.ok) {
                    console.error('Failed to load template configs:', response.status);
                    return;
                }
                var chatConfigData = await response.json();
                if (!chatConfigData || !chatConfigData.elements) {
                    console.warn('No chat config found in response');
                    return;
                }
                var config = {};
                chatConfigData.elements.forEach(function (element) {
                    if (element && element.id && element.type !== 'separator') {
                        config[element.id] = element.value;
                    }
                });
                applyTemplateConfig(config);
            } catch (error) {
                console.error('Error loading template config:', error);
            }
        }

        loadTemplateConfig();

        // Initialize
        chatLog('Mycelian Chat initialized');

        // BTTV Emote Fetching
        function fetchBTTVEmotes() {
            // Global BTTV emotes
            fetch('https://api.betterttv.net/3/cached/emotes/global')
                .then(response => response.json())
                .then(data => {
                    emoteCache.bttv.global = data;
                    rebuildEmoteLookupMap();
                    chatLog('BTTV global emotes loaded:', data.length);
                })
                .catch(error => console.error('Error fetching BTTV global emotes:', error));

            // User BTTV emotes
            if (streamerID) {
                fetch(`https://api.betterttv.net/3/cached/users/twitch/${streamerID}`)
                    .then(response => response.json())
                    .then(data => {
                        emoteCache.bttv.user = (data.channelEmotes || []).concat(data.sharedEmotes || []);
                        rebuildEmoteLookupMap();
                        chatLog('BTTV user emotes loaded:', emoteCache.bttv.user.length);
                    })
                    .catch(error => console.error('Error fetching BTTV user emotes:', error));
            }
        }

        // 7TV Emote Fetching
        function fetchSevenTVEmotes() {
            // Global 7TV emotes
            fetch('https://7tv.io/v3/emote-sets/global')
                .then(response => response.json())
                .then(data => {
                    emoteCache.seventv.global = data.emotes || [];
                    rebuildEmoteLookupMap();
                    chatLog('7TV global emotes loaded:', emoteCache.seventv.global.length);
                })
                .catch(error => console.error('Error fetching 7TV global emotes:', error));

            // User 7TV emotes
            if (streamerID) {
                fetch(`https://7tv.io/v3/users/twitch/${streamerID}`)
                    .then(response => response.json())
                    .then(data => {
                        emoteCache.seventv.user = (data.emote_set && data.emote_set.emotes) || [];
                        rebuildEmoteLookupMap();
                        chatLog('7TV user emotes loaded:', emoteCache.seventv.user.length);
                    })
                    .catch(error => console.error('Error fetching 7TV user emotes:', error));
            }
        }

        // FFZ Emote Fetching
        function fetchFFZEmotes() {
            // Global FFZ emotes
            fetch('https://api.frankerfacez.com/v1/set/global')
                .then(response => response.json())
                .then(data => {
                    emoteCache.ffz.global = (data.sets && data.sets['3'] && data.sets['3'].emoticons) || [];
                    rebuildEmoteLookupMap();
                    chatLog('FFZ global emotes loaded:', emoteCache.ffz.global.length);
                })
                .catch(error => console.error('Error fetching FFZ global emotes:', error));

            // User FFZ emotes
            if (streamerID) {
                fetch(`https://api.frankerfacez.com/v1/room/id/${streamerID}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.room && data.room.set && data.sets && data.sets[data.room.set]) {
                            emoteCache.ffz.user = data.sets[data.room.set].emoticons || [];
                            rebuildEmoteLookupMap();
                            chatLog('FFZ user emotes loaded:', emoteCache.ffz.user.length);
                        }
                    })
                    .catch(error => console.error('Error fetching FFZ user emotes:', error));
            }
        }

        // Twitch Emote Fetching (via websocket proxy)
        function fetchTwitchEmotes() {
            chatLog('Requesting Twitch global emotes...');
            socket.emit('twitch-api-request', {
                endpoint: 'https://api.twitch.tv/helix/chat/emotes/global',
                method: 'GET',
                requestId: 'twitch-global-emotes'
            });
        }

        // Twitch Badge Fetching (via websocket proxy)
        function fetchTwitchBadges() {
            chatLog('Requesting Twitch global badges...');
            // Global badges
            socket.emit('twitch-api-request', {
                endpoint: 'https://api.twitch.tv/helix/chat/badges/global',
                method: 'GET',
                requestId: 'twitch-global-badges'
            });

            // User badges
            if (streamerID) {
                chatLog('Requesting Twitch user badges for ID:', streamerID);
                socket.emit('twitch-api-request', {
                    endpoint: `https://api.twitch.tv/helix/chat/badges?broadcaster_id=${streamerID}`,
                    method: 'GET',
                    requestId: 'twitch-user-badges'
                });
            } else {
                console.warn('No streamer ID available for user badges request');
            }
        }

        // Cheermote Fetching (via websocket proxy)
        function fetchCheermotes() {
            if (streamerID) {
                chatLog('Requesting cheermotes for ID:', streamerID);
                socket.emit('twitch-api-request', {
                    endpoint: `https://api.twitch.tv/helix/bits/cheermotes?broadcaster_id=${streamerID}`,
                    method: 'GET',
                    requestId: 'twitch-cheermotes'
                });
            } else {
                console.warn('No streamer ID available for cheermotes request');
            }
        }
    </script>
