<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF7 Overlay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <style>
        @font-face {
            font-family: 'FF7Reactor';
            src: url("/assets/default_assets/fonts/{{ FontFile }}") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --ff7-bg-top: #263884;
            --ff7-bg-bot: #0a0a2e;
            --ff7-bg-ul: #263884;
            --ff7-bg-ur: #263884;
            --ff7-bg-ll: #0a0a2e;
            --ff7-bg-lr: #0a0a2e;
            --ff7-bg-center: #182159;
            /* Menu window chrome: fixed PS1-style silver bevel (does not follow window tint). */
            --ff7-chrome-outer: #060608;
            --ff7-chrome-highlight: #e8e8f0;
            --ff7-chrome-face: #6e6e7c;
            --ff7-chrome-shadow: #24242c;
            --ff7-chrome-deep: #14141a;
            --ff7-text: #ffffff;
            /* Match body text; HP/MP low + dead still use --ff7-hp-yellow / --ff7-hp-red on .stat-val and .name-dead */
            --ff7-label: #ffffff;
            --ff7-hp-yellow: #ffff00;
            --ff7-hp-red: #ff2020;
            --ff7-bar-bg: #181828;
            --ff7-bar-border: #404060;
            --ff7-bar-track-red: #401018;
            --ff7-bar-track-grey: #242428;
            --ff7-hp-fill-teal: #0d9488;
            --ff7-hp-fill-white: #ffffff;
            --ff7-mp-fill-green: #22c55e;
            --ff7-mp-fill-white: #ffffff;
            --ff7-limit-fill-top: #f0899e;
            --ff7-limit-fill-bot: #c83a55;
            --ff7-limit-flash-pink: #e85d7a;
            --ff7-limit-flash-yellow: #facc15;
            --ff7-limit-flash-blue: #3b82f6;
            --ff7-limit-flash-green: #22c55e;
            --ff7-time-charging-top: #ecfdf5;
            --ff7-time-charging-mid: #86efac;
            --ff7-time-charging-bot: #4ade80;
            --ff7-time-ready-top: #fff9c4;
            --ff7-time-ready-mid: #fde68a;
            --ff7-time-ready-bot: #e8d06a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'FF7Reactor', 'Consolas', monospace;
            color: var(--ff7-text);
            overflow: hidden;
            font-size: 14px;
            -webkit-font-smoothing: none;
            image-rendering: pixelated;
        }

        #ff7Root {
            min-height: 100vh;
            padding: 4px;
        }

        #ff7Grid {
            display: grid;
            width: 100%;
            min-width: 0;
        }
        #ff7Grid > .panel {
            min-width: 0;
            width: 100%;
        }

        /* --- FF7 panel: interior follows hook palette; frame is static metallic chrome like in-game menus --- */
        .panel {
            position: relative;
            background-color: var(--ff7-bg-center);
            background-image:
                radial-gradient(ellipse 115% 115% at 0% 0%, var(--ff7-bg-ul) 0%, transparent 72%),
                radial-gradient(ellipse 115% 115% at 100% 0%, var(--ff7-bg-ur) 0%, transparent 72%),
                radial-gradient(ellipse 115% 115% at 0% 100%, var(--ff7-bg-ll) 0%, transparent 72%),
                radial-gradient(ellipse 115% 115% at 100% 100%, var(--ff7-bg-lr) 0%, transparent 72%);
            border: 1px solid var(--ff7-chrome-outer);
            border-radius: 5px;
            padding: 10px 14px;
            box-shadow:
                /* raised metallic rim: light top/left, dark bottom/right */
                inset 1px 1px 0 var(--ff7-chrome-highlight),
                inset -1px -1px 0 var(--ff7-chrome-shadow),
                inset 2px 2px 0 rgba(255, 255, 255, 0.22),
                inset -2px -2px 0 rgba(0, 0, 0, 0.55),
                /* mid grey body of the frame */
                inset 0 0 0 3px var(--ff7-chrome-face),
                /* inner dark line before window fill */
                inset 0 0 0 4px var(--ff7-chrome-deep),
                /* slight lift off the page */
                0 2px 8px rgba(0, 0, 0, 0.65);
        }

        .panel-title {
            font-size: var(--title-font, 11px);
            letter-spacing: 0.12em;
            color: var(--ff7-label);
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow:
                0 0 1px #000,
                1px 1px 0 #000,
                -1px -1px 0 #000,
                0 1px 0 #000;
        }

        /* --- Debug status bar --- */
        .status-bar {
            font-size: 10px;
            color: var(--ff7-label);
            margin-bottom: 4px;
            min-height: 14px;
            display: none;
        }
        .status-bar.visible { display: block; }
        .status-bar.err { color: var(--ff7-hp-red); }

        /* --- Column headers row --- */
        .col-headers {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            padding-bottom: 3px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .col-h {
            font-size: var(--title-font, 10px);
            color: var(--ff7-label);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            text-shadow: 0 0 1px #000, 1px 1px 0 #000, -1px -1px 0 #000;
        }

        .col-name  { flex: 2; text-align: left; }
        .col-hp    { flex: 2; }
        .col-mp    { flex: 0.9; }
        /* Party: name + HP/MP row share one column (matches .char-party-main) */
        #panelParty .col-party-main {
            flex: 2.7;
            min-width: 0;
            text-align: left;
        }
        .col-limit { flex: 1.2; }
        .col-time  { flex: 1.2; }
        #panelParty .col-status { flex: 3.35; min-width: 0; text-align: center; }
        .col-status { flex: 2.4; min-width: 0; text-align: center; }

        /* --- Character row (shared by party + enemy) --- */
        .char-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .char-row:last-child {
            border-bottom: none;
        }

        .char-name {
            flex: 2;
            font-size: var(--name-font, 15px);
            color: var(--ff7-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #enemyBody {
            min-width: 0;
            width: 100%;
        }
        #panelEnemies .char-row {
            min-width: 0;
        }
        /* Enemy names: clip + inner span scrolls when overflow (party keeps ellipsis on .char-name).
           width:0 + flex forces the column to take only its flex share; otherwise min-content grows the row. */
        #panelEnemies .char-name {
            flex: 2 1 0%;
            min-width: 0;
            width: 0;
            overflow: hidden;
            text-overflow: clip;
        }
        #panelEnemies .char-name .enemy-name-text {
            display: inline-block;
            white-space: nowrap;
            vertical-align: top;
            max-width: none;
        }
        /* Fallback when element.animate (WAAPI) is missing: var() in @keyframes is flaky in some WebViews */
        #panelEnemies .char-name .enemy-name-text.enemy-name-scroll {
            animation: enemyNamePingPong 10s ease-in-out infinite;
        }
        @keyframes enemyNamePingPong {
            0%, 10% { transform: translateX(0); }
            45%, 55% { transform: translateX(calc(-1 * var(--enemy-marquee-dist, 0px))); }
            90%, 100% { transform: translateX(0); }
        }

        /* Party: name on first line; HP values+bar and MP value+bar on second (MP ~1/3 HP width) */
        #panelParty .char-row {
            padding: 1px 0;
        }
        #panelParty .char-party-main {
            flex: 2.7;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 0;
        }
        #panelParty .char-party-main .char-name {
            flex: 0 0 auto;
            width: 100%;
            margin-top: -3px;
            line-height: 1.15;
        }
        #panelParty .char-hpmp-row {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 6px;
            width: 100%;
            min-width: 0;
            margin-top: 4px;
        }
        #panelParty .hp-block {
            flex: 2.06;
            min-width: 0;
        }
        #panelParty .mp-block {
            flex: 0.71;
            min-width: 0;
        }
        #panelParty .hp-block .stat-cell.hp-cell,
        #panelParty .mp-block .stat-cell.mp-cell {
            flex: 0 0 auto;
            width: 100%;
            gap: 1px;
        }
        #panelParty .hp-block .ff7-hpbar,
        #panelParty .mp-block .ff7-mpbar {
            width: 100%;
            margin-left: 0;
        }

        /* --- Stat cell (values above a thin bar) --- */
        .stat-cell {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 2px;
        }
        .stat-cell.hp-cell { flex: 2; }
        .stat-cell.mp-cell { flex: 0.9; }

        .stat-values {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 2px;
        }

        .hp-cell .stat-values,
        .mp-cell .stat-values {
            justify-content: flex-end;
            width: 100%;
        }

        .stat-val {
            color: var(--ff7-text);
            text-align: right;
        }

        .hp-cell .stat-val { font-size: var(--hp-font, 14px); }
        .mp-cell .stat-val { font-size: var(--mp-font, 14px); }

        .stat-sep {
            color: var(--ff7-label);
            font-size: 12px;
        }

        .hp-ok   .stat-val { color: var(--ff7-text); }
        .hp-warn .stat-val { color: var(--ff7-hp-yellow); }
        .hp-dead .stat-val { color: var(--ff7-hp-red); }

        #panelEnemies .hp-cell.hp-ok .stat-val.hp-max { color: var(--ff7-text); }

        /* Party row: per-stat colors (dead = name + both HP numbers red; warn = current HP + MP yellow only) */
        .char-name.name-dead {
            color: var(--ff7-hp-red);
        }
        .stat-val.val-dead { color: var(--ff7-hp-red); }
        /* Beat .hp-ok .stat-val when party is in low-resource state */
        .hp-cell .stat-val.val-warn,
        .mp-cell .stat-val.val-warn { color: var(--ff7-hp-yellow); }

        /* --- Bar cell wrapper (LIMIT / TIME) --- */
        .bar-cell {
            display: flex;
            align-items: center;
        }
        .bar-cell.limit-cell { flex: 1.2; }
        .bar-cell.time-cell  { flex: 1.2; }

        /* --- HP bar (thin gradient under values) --- */
        .ff7-hpbar {
            width: 100%;
            height: var(--hp-bar-h, 4px);
            background: var(--ff7-bar-track-red);
            border-radius: 1px;
            overflow: hidden;
        }

        .ff7-hpbar .fill {
            height: 100%;
            width: 0%;
            transition: width 0.15s linear;
            background: linear-gradient(
                90deg,
                var(--ff7-hp-fill-teal) 0%,
                var(--ff7-hp-fill-white) 100%
            );
        }

        /* --- MP bar (thin green gradient under value) --- */
        .ff7-mpbar {
            width: 90%;
            margin-left: auto;
            height: var(--mp-bar-h, 4px);
            background: var(--ff7-bar-track-red);
            border-radius: 1px;
            overflow: hidden;
        }

        .ff7-mpbar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(
                90deg,
                var(--ff7-mp-fill-green) 0%,
                var(--ff7-mp-fill-white) 100%
            );
            transition: width 0.15s linear;
        }

        /* --- Limit bar (boxed with border) --- */
        .ff7-limitbar {
            width: 100%;
            height: var(--limit-bar-h, 8px);
            background: var(--ff7-bar-track-grey);
            border: 1px solid var(--ff7-bar-border);
            border-radius: 1px;
            overflow: hidden;
        }

        .ff7-limitbar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(
                180deg,
                var(--ff7-limit-fill-top) 0%,
                var(--ff7-limit-fill-bot) 100%
            );
            transition: width 0.15s linear;
        }

        .ff7-limitbar.full .fill {
            animation: limitFullFlash 0.36s linear infinite;
        }

        @keyframes limitFullFlash {
            0%, 22% { background: var(--ff7-limit-flash-pink); }
            25%, 47% { background: var(--ff7-limit-flash-yellow); }
            50%, 72% { background: var(--ff7-limit-flash-blue); }
            75%, 97% { background: var(--ff7-limit-flash-green); }
            100% { background: var(--ff7-limit-flash-pink); }
        }

        /* --- Time / ATB bar (boxed with border) --- */
        .ff7-timebar {
            width: 100%;
            height: var(--time-bar-h, 8px);
            background: var(--ff7-bar-track-grey);
            border: 1px solid var(--ff7-bar-border);
            border-radius: 1px;
            overflow: hidden;
        }

        .ff7-timebar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(
                180deg,
                var(--ff7-time-charging-top) 0%,
                var(--ff7-time-charging-mid) 55%,
                var(--ff7-time-charging-bot) 100%
            );
            transition: width 0.12s linear;
        }

        .ff7-timebar.ready .fill {
            background: linear-gradient(
                180deg,
                var(--ff7-time-ready-top) 0%,
                var(--ff7-time-ready-mid) 55%,
                var(--ff7-time-ready-bot) 100%
            );
        }

        /* --- Stats panel (Gil / Play time) --- */
        .stat-line {
            margin: 3px 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .stat-line .slabel {
            color: var(--ff7-label);
            font-size: var(--stats-label-font, 11px);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-line .sval {
            color: var(--ff7-text);
            font-size: var(--stats-value-font, 15px);
        }

        /* --- Bosses panel --- */
        .boss-name-list {
            font-size: var(--boss-text-font, 13px);
            color: var(--ff7-text);
            line-height: 1.35;
            word-break: break-word;
            overflow-wrap: anywhere;
            min-width: 0;
        }

        .boss-empty {
            color: var(--ff7-label);
            font-size: var(--boss-text-font, 12px);
        }

        .boss-text {
            font-size: var(--boss-text-font, 13px);
            color: var(--ff7-text);
        }

        #panelBosses .boss-kv-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            min-width: 0;
        }

        #panelBosses .boss-kv-label {
            color: var(--ff7-label);
            font-size: var(--title-font, 11px);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            flex-shrink: 0;
        }

        #panelBosses .boss-kv-val {
            color: var(--ff7-text);
            font-size: var(--boss-text-font, 13px);
            text-align: right;
            min-width: 0;
            word-break: break-word;
        }

        .party-rotor {
            /* Match HP+MP column height so materia/gear never stretch the row */
            height: var(--party-rotor-max-h, 48px);
            min-height: var(--party-rotor-max-h, 48px);
            max-height: var(--party-rotor-max-h, 48px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }
        .enemy-rotor {
            /* Fixed height so inner rotor-viewport can measure (min-height alone breaks height:100%) */
            height: calc(var(--limit-bar-h, 8px) + var(--time-bar-h, 8px) + 6px);
            min-height: calc(var(--limit-bar-h, 8px) + var(--time-bar-h, 8px) + 6px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #panelParty .char-row .party-rotor {
            flex: 3.35;
            min-width: 0;
        }
        .char-row .enemy-rotor {
            flex: 2.4;
            min-width: 0;
        }
        .party-rotor-inner-bars {
            display: flex;
            width: 100%;
            gap: 6px;
            align-items: center;
        }
        .party-rotor-inner-bars .bar-cell { flex: 1; min-width: 0; }
        .gear-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            font-size: 17px;
            line-height: 1.1;
            color: var(--ff7-label);
            letter-spacing: 0.03em;
        }
        .gear-stack .gear-line {
            font-size: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }
        /* Materia: FF7-style frames (assets/ff7.png) over segment background */
        .mat-rows-equipped {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
            height: 100%;
            max-height: 100%;
            min-height: 0;
            box-sizing: border-box;
            background: transparent;
            align-items: flex-start;
            justify-content: center;
        }
        .mat-divider {
            width: 92%;
            height: 0;
            margin: 0;
            padding: 0;
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .mat-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start;
            align-items: center;
            gap: 2px;
            width: 100%;
            background: transparent;
            flex: 0 0 auto;
            max-height: 50%;
            min-height: 0;
        }
        .mat-row.mat-row-dynamic {
            flex-wrap: nowrap;
            max-width: 100%;
            overflow-x: hidden;
            overflow-y: visible;
            justify-content: flex-start;
        }
        .mat-cell {
            position: relative;
            flex-shrink: 0;
            background: transparent;
            overflow: visible;
        }
        .mat-cell-single {
            width: 22px;
            height: 22px;
        }
        .mat-cell-linked {
            width: 46px;
            height: 22px;
        }
        .mat-cell .mat-frame,
        .mat-cell .mat-frame-linked {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            image-rendering: pixelated;
            pointer-events: none;
            z-index: 0;
        }
        .mat-cell .mat-orb,
        .mat-cell .mat-orb-left,
        .mat-cell .mat-orb-right {
            position: absolute;
            object-fit: contain;
            image-rendering: pixelated;
            pointer-events: none;
            z-index: 1;
            top: 50%;
            /* Explicit px so orbs scale visibly in the WebView (tiny % deltas on 18px cells looked unchanged). */
            width: 17px;
            height: 17px;
            box-sizing: border-box;
        }
        .mat-cell-single .mat-orb {
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .mat-cell-linked .mat-orb-left {
            left: 25%;
            transform: translate(-50%, -50%);
        }
        .mat-cell-linked .mat-orb-right {
            left: 75%;
            transform: translate(-50%, -50%);
        }
        .ailment-strip {
            font-size: 17px;
            color: var(--ff7-label);
            line-height: 1.25;
            text-align: center;
            max-width: 100%;
            word-break: break-word;
        }

        /*
         * Parent defines four shared columns; each .stats-sync-row uses subgrid so all rows
         * share the same label/value column widths. Inter-block: 8px margin on L values + 12px gap = 20px.
         */
        #panelStats .stats-pair--contents {
            display: contents;
        }
        #panelStats .stats-columns {
            display: grid;
            grid-template-columns: max-content max-content max-content minmax(0, 1fr);
            column-gap: 12px;
            row-gap: 3px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        #panelStats .stats-sync-row {
            display: grid;
            grid-template-columns: subgrid;
            grid-column: 1 / -1;
            align-items: baseline;
        }
        #panelStats .stats-l-label,
        #panelStats .stats-r-label {
            color: var(--ff7-label);
            font-size: var(--stats-label-font, 11px);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: left;
            justify-self: start;
            margin: 0;
            white-space: nowrap;
        }
        #panelStats .stats-l-label {
            grid-column: 1;
        }
        #panelStats .stats-l-val {
            grid-column: 2;
            color: var(--ff7-text);
            font-size: var(--stats-value-font, 15px);
            margin: 0;
            min-width: 0;
            white-space: nowrap;
            text-align: right;
            justify-self: end;
            margin-right: 8px;
        }
        #panelStats .stats-r-label {
            grid-column: 3;
        }
        #panelStats .stats-r-val {
            grid-column: 4;
            color: var(--ff7-text);
            font-size: var(--stats-value-font, 15px);
            margin: 0;
            min-width: 0;
            white-space: nowrap;
            text-align: right;
            justify-self: end;
        }
        #panelStats.panel {
            max-width: 100%;
            overflow-x: auto;
            /* ~⅓ less horizontal inset than .panel (14px → 9px); keep vertical 10px */
            padding: 10px 9px;
        }

        .hidden { display: none !important; }

        /* Rotor horizontal scroll: viewport clips; track is a row of one or two panes */
        .party-rotor .rotor-viewport,
        .enemy-rotor .rotor-viewport {
            width: 100%;
            height: 100%;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }
        .party-rotor .rotor-track,
        .enemy-rotor .rotor-track {
            display: flex;
            flex-direction: row;
            height: 100%;
            flex-shrink: 0;
            align-items: stretch;
        }
        .party-rotor .rotor-pane,
        .enemy-rotor .rotor-pane {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-width: 0;

        }

        #panelBattleLog.panel {
            display: flex;

            /* Hide scrollbar (content still scrolls with wheel / touch) */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .battle-log-body::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="ff7Root">
        <div id="statusLine" class="status-bar">Waiting for data…</div>
        <div id="ff7Grid">
            <div id="panelParty" class="panel hidden">

            </div>
            <div id="panelStats" class="panel hidden">
                <div class="stats-columns">

                        </div>
                        <div id="rowField" class="stats-pair stats-pair--contents">
                            <span class="slabel stats-r-label">Location</span><span class="sval stats-r-val" id="fieldVal">—</span>
                        </div>
                    </div>
                    <div class="stats-sync-row">
                        <div id="rowTime" class="stats-pair stats-pair--contents">
                            <span class="slabel stats-l-label">Time</span><span class="sval stats-l-val" id="timeVal">--:--:--</span>
                        </div>
                        <div id="rowModule" class="stats-pair stats-pair--contents">
                            <span class="slabel stats-r-label">Module</span><span class="sval stats-r-val module-val" id="moduleVal">—</span>
                        </div>
                    </div>
                    <div class="stats-sync-row">
                        <div id="rowAvgLevel" class="stats-pair stats-pair--contents">
                            <span class="slabel stats-l-label">Avg Lv</span><span class="sval stats-l-val" id="avgLevelVal">0</span>
                        </div>
                        <div id="rowMateriaCount" class="stats-pair stats-pair--contents">
                            <span class="slabel stats-r-label">Materia Count</span><span class="sval stats-r-val" id="materiaCountVal">0</span>
                        </div>
                    </div>

                        <div id="rowBattleAtb" class="stats-pair stats-pair--contents">

                <div id="bossPanelTitle" class="panel-title">Bosses</div>
                <div id="bossBody"></div>

    </div>

    <script>
        let cfg = {};
        const FF7_DEBUG = new URLSearchParams(window.location.search).get('ff7debug') === '1';
        let ff7PayloadCount = 0;
        let ff7LastThrottleLog = 0;
        let socket = null;

        if (FF7_DEBUG) {
            document.getElementById('statusLine').classList.add('visible');
        }

        function ff7Summarize(d) {
            if (!d) return null;
            return {
                attached: d.attached, disabled: d.disabled, error: d.error,
                battle: d.battle,
                battle_ui: d.battle_ui,
                current_module: d.current_module,
                gil: d.gil,
                playtime_text: d.playtime_text,
                partyLen: (d.party || []).length, enemiesLen: (d.enemies || []).length,
                debug: d.debug
            };
        }

        function num(v, d) {
            const n = Number(v);
            return Number.isFinite(n) ? n : d;
        }

        function applyGrid(el, row, col, rowSpan, colSpan) {
            const r = Math.max(1, num(row, 1));
            const c = Math.max(1, num(col, 1));
            const rs = Math.max(1, num(rowSpan, 1));
            const cs = Math.max(1, num(colSpan, 1));
            el.style.gridRow = r + ' / span ' + rs;
            el.style.gridColumn = c + ' / span ' + cs;
        }

        function asBool(v, defaultTrue) {
            if (v === undefined || v === null) return defaultTrue;
            if (typeof v === 'string') return v !== 'false' && v !== '0';
            return Boolean(v);
        }

        /** After DOM/text updates, keep scroll at bottom (tail-follow). */
        function scrollElementToBottom(el) {
            if (!el) return;
            var run = function () {
                el.scrollTop = el.scrollHeight;
            };
            if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(function () {
                    requestAnimationFrame(run);
                });
            } else {
                setTimeout(run, 0);
            }
        }

        function ff7PartySlot(actor) {
            if (actor.party_slot !== undefined && actor.party_slot !== null) return Number(actor.party_slot);
            if (actor.slot !== undefined && actor.slot !== null) return Number(actor.slot);
            return 0;
        }

        function formatGil(n) {
            var x = Math.floor(Number(n) || 0);
            if (x < 0) x = 0;
            return x.toLocaleString('en-US');
        }

        function partyFieldModesList() {
            var m = [];
            if (asBool(cfg.PartyRotateGear, true)) m.push('gear');
            if (asBool(cfg.PartyRotateMateria, true)) m.push('materia');
            if (asBool(cfg.PartyRotateBars, true)) m.push('bars');
            if (!m.length) m.push('bars');
            return m;
        }

        function partyFieldStatusHeaderLabel(mode, battle) {
            if (battle) {
                if (mode === 'ailments') return 'Status';
                return 'Limit / ATB';
            }
            if (mode === 'gear') return 'Equipment';
            if (mode === 'materia') return 'Materia';
            return 'Limit / ATB';
        }

        function ff7GearSlotLabel(actor, stem) {
            var nm = actor[stem + '_name'];
            if (nm !== undefined && nm !== null && String(nm).trim() !== '') return String(nm).trim();
            var id = actor[stem + '_id'];
            if (id === undefined || id === null || id < 0 || id === 255) return '—';
            return '?';
        }

        function materiaOrbJpg(orbStem) {
            var m = {
                materia_green: 'green_materia',
                materia_red: 'red_materia',
                materia_blue: 'blue_materia',
                materia_yellow: 'yellow_materia',
                materia_purple: 'purple_materia'
            };
            var base = m[String(orbStem || '')] || 'green_materia';
            return '/assets/ff7/' + base + '.png';
        }

        function matEscapeAttr(s) {
            if (!s) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function matSlotData(slots, idx) {
            var s = slots || [];
            var sl = s[idx];
            if (!sl || sl.empty) return { empty: true, src: '', title: '' };
            var t = (sl.name !== undefined && sl.name !== null) ? String(sl.name) : '';
            return { empty: false, src: materiaOrbJpg(sl.orb), title: t };
        }

        function matOrbImgTag(d, cls) {
            if (d.empty) return '';
            var ta = d.title ? (' title="' + matEscapeAttr(d.title) + '"') : '';
            return '<img class="' + cls + '" src="' + d.src + '"' + ta + ' alt="" loading="lazy">';
        }

        function matSingleCell(slots, idx) {
            var d = matSlotData(slots, idx);
            var orb = matOrbImgTag(d, 'mat-orb');
            return (
                '<div class="mat-cell mat-cell-single">' +
                    '<img class="mat-frame" src="/assets/ff7/single_slot.png" alt="" loading="lazy">' +
                    orb +
                '</div>'
            );
        }

        function matLinkedCell(slots, leftIdx, rightIdx) {
            var L = matSlotData(slots, leftIdx);
            var R = matSlotData(slots, rightIdx);
            var lo = matOrbImgTag(L, 'mat-orb mat-orb-left');
            var ro = matOrbImgTag(R, 'mat-orb mat-orb-right');
            return (
                '<div class="mat-cell mat-cell-linked">' +
                    '<img class="mat-frame-linked" src="/assets/ff7/linked_slots.png" alt="" loading="lazy">' +
                    lo + ro +
                '</div>'
            );
        }

        /* KERNEL-style slot-type bytes: 0 none; 1/5 single; 2/6 left link; 3/7 right link (ff7-flat-wiki). */
        function buildMateriaStripHtml(slots, slotTypes) {
            var s = (slots && slots.length) ? slots.slice(0, 8) : [];
            var t = (slotTypes && slotTypes.length) ? slotTypes.slice(0, 8) : [];
            while (s.length < 8) s.push({ empty: true });
            while (t.length < 8) t.push(5);
            var html = '';
            var i = 0;
            while (i < 8) {
                var st = Number(t[i]) | 0;
                if (st === 0) {
                    i += 1;
                    continue;
                }
                if (st === 6 || st === 2) {
                    if (i + 1 < 8) {
                        html += matLinkedCell(s, i, i + 1);
                        i += 2;
                    } else {
                        html += matSingleCell(s, i);
                        i += 1;
                    }
                    continue;
                }
                if (st === 7 || st === 3) {
                    html += matSingleCell(s, i);
                    i += 1;
                    continue;
                }
                if (st === 5 || st === 1) {
                    html += matSingleCell(s, i);
                    i += 1;
                    continue;
                }
                i += 1;
            }
            return '<div class="mat-row mat-row-dynamic">' + html + '</div>';
        }

        function buildPartyRotorInnerHtml(actor, mode, inBattle) {
            var maxHp = actor.max_hp || 1;
            var hp = actor.hp || 0;
            var maxMp = actor.max_mp || 0;
            var mp = actor.mp || 0;
            var limRaw = actor.limit || 0;
            var limPctVal = limitPct(limRaw);
            var limFull = limRaw >= 255;
            var atbPct = Math.max(0, Math.min(100, (actor.atb || 0) * 100));
            var atbReady = atbPct >= 99;
            if (mode === 'gear') {
                var w = ff7GearSlotLabel(actor, 'weapon');
                var a = ff7GearSlotLabel(actor, 'armor');
                var z = ff7GearSlotLabel(actor, 'accessory');
                return (
                    '<div class="gear-stack">' +
                        '<div class="gear-line">' + w + '</div>' +
                        '<div class="gear-line">' + a + '</div>' +
                        '<div class="gear-line">' + z + '</div>' +
                    '</div>'
                );
            }
            if (mode === 'materia') {
                return (
                    '<div class="mat-rows mat-rows-equipped">' +
                        buildMateriaStripHtml(actor.materia_weapon, actor.materia_weapon_slot_types) +
                        '<div class="mat-divider" role="presentation"></div>' +
                        buildMateriaStripHtml(actor.materia_armor, actor.materia_armor_slot_types) +
                    '</div>'
                );
            }
            if (mode === 'ailments') {
                var al = actor.ailments || [];
                var t = al.length ? al.join(', ') : (inBattle ? '—' : '');
                return '<div class="ailment-strip">' + t + '</div>';
            }
            /* bars */
            return (
                '<div class="party-rotor-inner-bars">' +
                    '<div class="bar-cell limit-cell">' +
                        '<div class="ff7-limitbar' + (limFull ? ' full' : '') + '">' +
                            '<div class="fill" style="width:' + limPctVal + '%"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="bar-cell time-cell">' +
                        '<div class="ff7-timebar' + (atbReady ? ' ready' : '') + '">' +
                            '<div class="fill" style="width:' + atbPct + '%"></div>' +
                        '</div>' +
                    '</div>' +
                '</div>'
            );
        }

        function buildEnemyRotorInnerHtml(actor, mode) {
            var atbPct = Math.max(0, Math.min(100, (actor.atb || 0) * 100));
            var atbReady = atbPct >= 99;
            if (mode === 'ailments') {
                var al = actor.ailments || [];
                var t = al.length ? al.join(', ') : '—';
                return '<div class="ailment-strip">' + t + '</div>';
            }
            return (
                '<div class="ff7-timebar' + (atbReady ? ' ready' : '') + '">' +
                    '<div class="fill" style="width:' + atbPct + '%"></div>' +
                '</div>'
            );
        }

        var FF7_ROTOR_ANIM_MS = 560;
        var FF7_ROTOR_ANIM_FALLBACK_MS = FF7_ROTOR_ANIM_MS + 280;

        function ff7RotorClear(rotorEl) {
            if (rotorEl._ff7RotorTe && rotorEl._ff7RotorTeFn) {
                try {
                    rotorEl._ff7RotorTe.removeEventListener('transitionend', rotorEl._ff7RotorTeFn);
                } catch (e0) {}
                rotorEl._ff7RotorTe = null;
                rotorEl._ff7RotorTeFn = null;
            }
            if (rotorEl._ff7RotorFinishTimer) {
                clearTimeout(rotorEl._ff7RotorFinishTimer);
                rotorEl._ff7RotorFinishTimer = null;
            }
            rotorEl._ff7RotorAnimating = false;
            rotorEl._ff7RotorPendingMode = undefined;
            rotorEl.innerHTML = '';
            rotorEl._ff7RotorMode = undefined;
            rotorEl._ff7RotorAnimToken = (rotorEl._ff7RotorAnimToken || 0) + 1;
        }

        function ff7RotorSyncPaneSize(rotorEl) {
            var vp = rotorEl.querySelector(':scope > .rotor-viewport');
            var track = vp && vp.querySelector(':scope > .rotor-track');
            if (!vp || !track || track.children.length !== 1) return;
            var W = vp.clientWidth;
            if (W <= 0) W = vp.offsetWidth;
            var H = vp.clientHeight;
            if (H <= 0) H = vp.offsetHeight;
            if (W <= 0 || H <= 0) return;
            var pane = track.children[0];
            pane.style.flexBasis = W + 'px';
            pane.style.width = W + 'px';
            pane.style.minWidth = W + 'px';
            pane.style.maxWidth = W + 'px';
            pane.style.height = '100%';
            pane.style.minHeight = H + 'px';
        }

        function ff7RotorSetContent(rotorEl, html, modeKey) {
            if (!html) {
                ff7RotorClear(rotorEl);
                return;
            }
            var vp = rotorEl.querySelector(':scope > .rotor-viewport');
            var track = vp ? vp.querySelector(':scope > .rotor-track') : null;
            var sameMode = (rotorEl._ff7RotorMode === modeKey);

            /* Avoid clobbering a running transition: interval (280ms) is faster than anim (~320ms). */
            if (rotorEl._ff7RotorAnimating && rotorEl._ff7RotorPendingMode === modeKey) {
                return;
            }

            if (sameMode && vp && track && track.children.length === 1) {
                var onlyPane = track.querySelector(':scope > .rotor-pane');
                if (onlyPane) onlyPane.innerHTML = html;
                return;
            }

            if (rotorEl._ff7RotorTe && rotorEl._ff7RotorTeFn) {
                try {
                    rotorEl._ff7RotorTe.removeEventListener('transitionend', rotorEl._ff7RotorTeFn);
                } catch (e1) {}
                rotorEl._ff7RotorTe = null;
                rotorEl._ff7RotorTeFn = null;
            }
            if (rotorEl._ff7RotorFinishTimer) {
                clearTimeout(rotorEl._ff7RotorFinishTimer);
                rotorEl._ff7RotorFinishTimer = null;
            }
            rotorEl._ff7RotorAnimating = false;
            rotorEl._ff7RotorPendingMode = undefined;

            rotorEl._ff7RotorAnimToken = (rotorEl._ff7RotorAnimToken || 0) + 1;
            var animTok = rotorEl._ff7RotorAnimToken;

            var prevMode = rotorEl._ff7RotorMode;
            var canAnim = prevMode !== undefined && prevMode !== modeKey && vp && track && track.children.length === 1;

            if (!canAnim) {
                rotorEl.innerHTML =
                    '<div class="rotor-viewport">' +
                        '<div class="rotor-track">' +
                            '<div class="rotor-pane">' + html + '</div>' +
                        '</div>' +
                    '</div>';
                rotorEl._ff7RotorMode = modeKey;
                requestAnimationFrame(function () {
                    ff7RotorSyncPaneSize(rotorEl);
                });
                return;
            }

            var myTok = animTok;
            var pane0 = track.children[0];
            var pane1 = document.createElement('div');
            pane1.className = 'rotor-pane';
            pane1.innerHTML = html;
            track.appendChild(pane1);

            var W = vp.clientWidth;
            if (W <= 0) W = vp.offsetWidth;
            var H = vp.clientHeight;
            if (H <= 0) H = vp.offsetHeight;
            if (W <= 0 || H <= 0) {
                track.removeChild(pane1);
                rotorEl.innerHTML =
                    '<div class="rotor-viewport">' +
                        '<div class="rotor-track">' +
                            '<div class="rotor-pane">' + html + '</div>' +
                        '</div>' +
                    '</div>';
                rotorEl._ff7RotorMode = modeKey;
                return;
            }

            rotorEl._ff7RotorAnimating = true;
            rotorEl._ff7RotorPendingMode = modeKey;

            pane0.style.flexBasis = W + 'px';
            pane0.style.width = W + 'px';
            pane0.style.minWidth = W + 'px';
            pane0.style.maxWidth = W + 'px';
            pane0.style.height = '100%';
            pane1.style.flexBasis = W + 'px';
            pane1.style.width = W + 'px';
            pane1.style.minWidth = W + 'px';
            pane1.style.maxWidth = W + 'px';
            pane1.style.height = '100%';
            track.style.width = (W * 2) + 'px';
            track.style.height = '100%';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            track.offsetHeight;

            var collapsedOnce = false;
            function finishCollapse() {
                if (collapsedOnce) return;
                if (rotorEl._ff7RotorAnimToken !== myTok) return;
                collapsedOnce = true;
                try {
                    track.removeEventListener('transitionend', onEnd);
                } catch (e2) {}
                rotorEl._ff7RotorTe = null;
                rotorEl._ff7RotorTeFn = null;
                rotorEl._ff7RotorAnimating = false;
                rotorEl._ff7RotorPendingMode = undefined;
                if (rotorEl._ff7RotorFinishTimer) {
                    clearTimeout(rotorEl._ff7RotorFinishTimer);
                    rotorEl._ff7RotorFinishTimer = null;
                }
                track.innerHTML = '';
                var collapsed = document.createElement('div');
                collapsed.className = 'rotor-pane';
                collapsed.innerHTML = html;
                track.appendChild(collapsed);
                track.style.transition = '';
                track.style.transform = '';
                track.style.width = '';
                track.style.height = '';
                collapsed.style.flexBasis = '';
                collapsed.style.width = '';
                collapsed.style.minWidth = '';
                collapsed.style.maxWidth = '';
                collapsed.style.height = '';
                pane0.style.flexBasis = '';
                pane0.style.width = '';
                pane0.style.minWidth = '';
                pane0.style.maxWidth = '';
                pane0.style.height = '';
                rotorEl._ff7RotorMode = modeKey;
                requestAnimationFrame(function () {
                    ff7RotorSyncPaneSize(rotorEl);
                });
            }

            function onEnd(ev) {
                if (ev.target !== track || ev.propertyName !== 'transform') return;
                if (rotorEl._ff7RotorAnimToken !== myTok) return;
                if (rotorEl._ff7RotorFinishTimer) {
                    clearTimeout(rotorEl._ff7RotorFinishTimer);
                    rotorEl._ff7RotorFinishTimer = null;
                }
                finishCollapse();
            }

            track.addEventListener('transitionend', onEnd);
            rotorEl._ff7RotorTe = track;
            rotorEl._ff7RotorTeFn = onEnd;

            rotorEl._ff7RotorFinishTimer = setTimeout(function () {
                rotorEl._ff7RotorFinishTimer = null;
                finishCollapse();
            }, FF7_ROTOR_ANIM_FALLBACK_MS);

            /* Double rAF + short delay so layout commits before transition (embedded WebViews). */
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    setTimeout(function () {
                        if (rotorEl._ff7RotorAnimToken !== myTok) return;
                        track.style.transition = 'transform ' + (FF7_ROTOR_ANIM_MS / 1000) + 's ease-out';
                        track.style.transform = 'translateX(' + (-W) + 'px)';
                    }, 32);
                });
            });
        }

        function enemyBattleStatusHeaderLabel(emode) {
            return emode === 'ailments' ? 'Status' : 'ATB';
        }

        function updateFf7Rotors() {
            var st = window._ff7RenderState;
            if (!st || !st.d || !st.d.attached) return;
            var battle = typeof st.d.battle_ui === 'boolean' ? st.d.battle_ui : st.d.battle;
            var party = st.d.party || [];
            var enemies = st.d.enemies || [];

            var partyModes;
            var partyMs;
            if (battle) {
                partyModes = ['bars', 'ailments'];
                partyMs = num(cfg.PartyBattleRotateMs, 3500);
            } else {
                partyModes = partyFieldModesList();
                partyMs = num(cfg.PartyFieldRotateMs, 4000);
            }
            var partyN = partyModes.length || 1;
            var partyPhase = Math.floor(Date.now() / partyMs) % partyN;
            var partyMode = partyModes[partyPhase] || partyModes[0];
            var hdr = document.getElementById('partyStatusHeader');
            if (hdr) hdr.textContent = partyFieldStatusHeaderLabel(partyMode, battle);

            var ems = ['atb', 'ailments'];
            var emsMs = num(cfg.EnemyBattleRotateMs, 3500);
            var en = ems.length;
            var eph = Math.floor(Date.now() / emsMs) % en;
            var emode = ems[eph];
            var ehdr = document.getElementById('enemyStatusHeader');
            if (ehdr) ehdr.textContent = battle ? enemyBattleStatusHeaderLabel(emode) : 'ATB';

            document.querySelectorAll('[data-party-rotor]').forEach(function (el) {
                var slot = parseInt(el.getAttribute('data-party-rotor'), 10);
                var actor = null;
                for (var i = 0; i < party.length; i++) {
                    var p = party[i];
                    if (p.slot_empty) continue;
                    if (ff7PartySlot(p) === slot) {
                        actor = p;
                        break;
                    }
                }
                if (!actor) {
                    ff7RotorClear(el);
                    return;
                }
                ff7RotorSetContent(el, buildPartyRotorInnerHtml(actor, partyMode, battle), partyMode);
            });

            document.querySelectorAll('[data-enemy-rotor]').forEach(function (el) {
                var slot = parseInt(el.getAttribute('data-enemy-rotor'), 10);
                var actor = null;
                for (var j = 0; j < enemies.length; j++) {
                    if (Number(enemies[j].slot) === slot) {
                        actor = enemies[j];
                        break;
                    }
                }
                if (!actor) {
                    ff7RotorClear(el);
                    return;
                }
                ff7RotorSetContent(el, buildEnemyRotorInnerHtml(actor, emode), emode);
            });

        async function loadTemplateConfig() {
            try {
                var response = await fetch('/api/template-config/ff7', { credentials: 'same-origin' });

                var block = await response.json();
                if (!block || !block.elements) return;
                var flat = {};
                block.elements.forEach(function (el) {
                    if (el.type !== 'section' && el.type !== 'separator' && el.id !== undefined) {
                        flat[el.id] = el.value;
                    }
                });
                applyTemplateConfig(flat);

        function hpPct(hp, maxHp) {
            if (!maxHp || maxHp <= 0) return 0;
            return Math.max(0, Math.min(100, (hp / maxHp) * 100));
        }

        function limitPct(lim) {
            if (lim === undefined || lim === null) return 0;
            var v = Number(lim);
            if (v >= 255) return 100;
            return Math.max(0, Math.min(100, (v / 255) * 100));
        }

        function hpState(hp, maxHp) {
            if (hp <= 0) return 'hp-dead';
            if (maxHp > 0 && (hp / maxHp) < 0.25) return 'hp-warn';
            return 'hp-ok';
        }

        function ff7EnemiesDomKey(enemies) {
            if (!Array.isArray(enemies) || enemies.length === 0) return '';
            var parts = [];
            for (var i = 0; i < enemies.length; i++) {
                var e = enemies[i];
                parts.push(String(e.slot != null ? e.slot : '') + ':' + String(e.name || '?'));
            }
            return parts.join('|');
        }

        function ff7PartyDomKey(party) {
            if (!Array.isArray(party) || party.length === 0) return '';
            var parts = [];
            for (var i = 0; i < party.length; i++) {
                var p = party[i];
                if (p.slot_empty) continue;
                var ps = ff7PartySlot(p);
                parts.push(String(ps) + ':' + String(p.id != null ? p.id : '') + ':' + String(p.name || '?'));
            }
            return parts.join('|');
        }

        function patchPartyRowStats(container, party) {
            var members = [];

                var hp = actor.hp || 0;
                var maxMp = actor.max_mp || 0;
                var mp = actor.mp || 0;
                var hpPctVal = hpPct(hp, maxHp);
                var mpPctVal = maxMp > 0 ? hpPct(mp, maxMp) : 0;
                var dead = hp <= 0;
                var lowHp = !dead && maxHp > 0 && (hp / maxHp) < 0.25;
                var lowMp = !dead && maxMp > 0 && (mp / maxMp) < 0.25;

                    if (mpVal) {

                    }

                    if (mpFill) mpFill.style.width = mpPctVal + '%';
                }
            }

        function refreshEnemyNameMarquees() {
            var root = document.getElementById('enemyBody');
            if (!root) return;
            root.querySelectorAll('.char-name').forEach(function (wrap) {
                var inner = wrap.querySelector('.enemy-name-text');
                if (!inner) return;

                var cw = wrap.getBoundingClientRect().width;
                var extraRaw = inner.scrollWidth - cw;
                if (FF7_DEBUG && inner.textContent) {
                    console.log('[ff7] enemy name marquee measure', {
                        text: inner.textContent.slice(0, 48),
                        cw: cw,
                        scrollW: inner.scrollWidth,
                        extra: extraRaw
                    });
                }

                if (extraRaw <= 0.5 || cw <= 0) {
                    if (inner._ff7MarqueeAnim) {
                        try {
                            inner._ff7MarqueeAnim.cancel();
                        } catch (e) {}
                        inner._ff7MarqueeAnim = null;
                    }
                    inner.style.removeProperty('will-change');
                    inner.classList.remove('enemy-name-scroll');
                    inner.style.removeProperty('--enemy-marquee-dist');
                    inner._ff7MarqueeSnapKey = '';
                    return;
                }

                var extra = Math.ceil(extraRaw);
                var cwR = Math.round(cw * 100) / 100;
                var snapKey = cwR + ':' + extra;
                if (inner._ff7MarqueeAnim && inner._ff7MarqueeSnapKey === snapKey) {
                    try {
                        if (inner._ff7MarqueeAnim.playState === 'paused') {
                            inner._ff7MarqueeAnim.play();
                        }
                    } catch (e2) {}
                    return;
                }

                if (inner._ff7MarqueeAnim) {
                    try {
                        inner._ff7MarqueeAnim.cancel();
                    } catch (e) {}
                    inner._ff7MarqueeAnim = null;
                }
                inner.style.removeProperty('will-change');
                inner.classList.remove('enemy-name-scroll');
                inner.style.removeProperty('--enemy-marquee-dist');

                inner._ff7MarqueeSnapKey = snapKey;
                inner.style.willChange = 'transform';
                if (typeof inner.animate === 'function') {
                    inner._ff7MarqueeAnim = inner.animate(
                        [
                            { transform: 'translateX(0px)', offset: 0 },
                            { transform: 'translateX(0px)', offset: 0.1 },
                            { transform: 'translateX(' + -extra + 'px)', offset: 0.45 },
                            { transform: 'translateX(' + -extra + 'px)', offset: 0.55 },
                            { transform: 'translateX(0px)', offset: 0.9 },
                            { transform: 'translateX(0px)', offset: 1 }
                        ],
                        { duration: 10000, iterations: Infinity, easing: 'ease-in-out' }
                    );
                } else {
                    inner.style.setProperty('--enemy-marquee-dist', extra + 'px');
                    inner.classList.add('enemy-name-scroll');
                }
            });
        }

                    '<span class="' + hpMaxClass + '">' + maxHp + '</span>' +
                '</div>' +
                '<div class="ff7-hpbar"><div class="fill" style="width:' + hpPctVal + '%"></div></div>';
            hpBlock.appendChild(hpCell);

            var mpBlock = document.createElement('div');
            mpBlock.className = 'mp-block';
            var mpCell = document.createElement('div');
            mpCell.className = 'stat-cell mp-cell';
            mpCell.innerHTML =
                '<div class="stat-values">' +
                    '<span class="' + mpValClass + '">' + mp + '</span>' +
                '</div>' +
                '<div class="ff7-mpbar"><div class="fill" style="width:' + mpPctVal + '%"></div></div>';
            mpBlock.appendChild(mpCell);

            hpMpRow.appendChild(hpBlock);
            hpMpRow.appendChild(mpBlock);
            partyMain.appendChild(hpMpRow);
            row.appendChild(partyMain);

            var rotor = document.createElement('div');
            rotor.className = 'bar-cell party-rotor';
            rotor.setAttribute('data-party-rotor', String(ff7PartySlot(actor)));
            row.appendChild(rotor);

            container.appendChild(row);
        }

        function renderEnemyRow(container, actor) {
            var maxHp = actor.max_hp || 1;
            var hp = actor.hp || 0;
            var maxMp = actor.max_mp || 0;
            var mp = actor.mp || 0;
            var hpPctVal = hpPct(hp, maxHp);
            var mpPctVal = maxMp > 0 ? hpPct(mp, maxMp) : 0;
            var dead = hp <= 0;
            var lowHp = !dead && maxHp > 0 && (hp / maxHp) < 0.25;
            var hpCellClass = 'stat-cell hp-cell ' + (dead ? 'hp-dead' : 'hp-ok');
            var curCls = 'stat-val hp-current' + (dead ? ' val-dead' : (lowHp ? ' val-warn' : ''));
            var maxCls = 'stat-val hp-max' + (dead ? ' val-dead' : '');

            var row = document.createElement('div');
            row.className = 'char-row';

            var nameEl = document.createElement('div');
            nameEl.className = 'char-name' + (dead ? ' name-dead' : '');
            var nameInner = document.createElement('span');
            nameInner.className = 'enemy-name-text';
            nameInner.textContent = actor.name || '?';
            nameEl.appendChild(nameInner);
            row.appendChild(nameEl);

            var hpCell = document.createElement('div');
            hpCell.className = hpCellClass;
            hpCell.innerHTML =
                '<div class="stat-values">' +
                    '<span class="' + curCls + '">' + hp + '</span>' +
                    '<span class="stat-sep">/</span>' +
                    '<span class="' + maxCls + '">' + maxHp + '</span>' +
                '</div>' +
                '<div class="ff7-hpbar"><div class="fill" style="width:' + hpPctVal + '%"></div></div>';
            row.appendChild(hpCell);

            var mpCell = document.createElement('div');
            mpCell.className = 'stat-cell mp-cell';
            mpCell.innerHTML =
                '<div class="stat-values">' +
                    '<span class="stat-val">' + mp + '</span>' +
                '</div>' +
                '<div class="ff7-mpbar"><div class="fill" style="width:' + mpPctVal + '%"></div></div>';
            row.appendChild(mpCell);

            var rotor = document.createElement('div');
            rotor.className = 'bar-cell enemy-rotor';
            rotor.setAttribute('data-enemy-rotor', String(actor.slot != null ? actor.slot : ''));
            row.appendChild(rotor);

            container.appendChild(row);
        }

        function renderPayload(payload) {
            ff7PayloadCount += 1;
            var now = Date.now();
            var status = document.getElementById('statusLine');
            var d = payload && payload.hooks && payload.hooks.ff7;

            if (FF7_DEBUG) {
                console.log('[ff7] game_hook_payload #' + ff7PayloadCount, payload);
            } else if (ff7PayloadCount <= 2) {
                console.log('[ff7] first payloads', { n: ff7PayloadCount, summary: ff7Summarize(d) });
            }

            if (now - ff7LastThrottleLog > 2000) {
                ff7LastThrottleLog = now;
                if (FF7_DEBUG) {
                    console.log('[ff7] heartbeat', { payloadsSeen: ff7PayloadCount, summary: ff7Summarize(d) });
                }
            }

            if (!payload || !d) {
                if (FF7_DEBUG) {
                    status.textContent = d ? '' : 'No FF7 hook in payload.';
                    status.className = 'status-bar visible err';
                }
                return;
            }

            if (FF7_DEBUG) {
                status.className = 'status-bar visible';
                if (d.disabled) {
                    status.textContent = 'FF7 hook disabled in settings.';
                } else if (d.error) {
                    status.textContent = 'FF7: ' + d.error;
                    status.className = 'status-bar visible err';
                } else if (!d.attached) {
                    status.textContent = 'FF7: not attached';
                    status.className = 'status-bar visible err';
                } else {
                    status.textContent = d.battle ? 'In battle' : 'Field / menu';
                }
            }

            if (d.disabled || d.error || !d.attached) {
                document.getElementById('panelEnemies').classList.add('hidden');
                document.getElementById('panelBattleLog').classList.add('hidden');
                return;
            }

            /* menu_theme: server prefers live display RAM (same layout as in-game menu); savemap fallback if read fails. */
            var mt = d.menu_theme;
            if (typeof window._ff7LastMenuThemeKey === 'undefined') {
                window._ff7LastMenuThemeKey = null;
            }
            var themeComplete = ff7MenuThemeIsComplete(mt);
            var themeKey = themeComplete ? JSON.stringify(mt) : '__default__';
            if (themeKey !== window._ff7LastMenuThemeKey) {
                window._ff7LastMenuThemeKey = themeKey;
                var root = document.documentElement;
                if (themeComplete) {
                    root.style.setProperty('--ff7-bg-top', mt.bg_top);
                    root.style.setProperty('--ff7-bg-bot', mt.bg_bot);
                    root.style.setProperty('--ff7-bg-ul', mt.bg_ul);
                    root.style.setProperty('--ff7-bg-ur', mt.bg_ur);
                    root.style.setProperty('--ff7-bg-ll', mt.bg_ll);
                    root.style.setProperty('--ff7-bg-lr', mt.bg_lr);
                    root.style.setProperty('--ff7-bg-center', mt.bg_center);
                } else {
                    ['--ff7-bg-top', '--ff7-bg-bot', '--ff7-bg-ul', '--ff7-bg-ur', '--ff7-bg-ll', '--ff7-bg-lr', '--ff7-bg-center'].forEach(function (p) {
                        root.style.removeProperty(p);
                    });
                }
            }

            document.getElementById('panelParty').classList.toggle('hidden', !asBool(cfg.ShowParty, true));

            var partyEl = document.getElementById('partyBody');
            if (typeof window._ff7PartyDomKey === 'undefined') {
                window._ff7PartyDomKey = '';
            }
            if (!asBool(cfg.ShowParty, true) || !Array.isArray(d.party)) {
                window._ff7PartyDomKey = '';
                partyEl.innerHTML = '';
            } else {
                var partyFiltered = [];
                for (var pi = 0; pi < d.party.length; pi++) {
                    if (!d.party[pi].slot_empty) partyFiltered.push(d.party[pi]);
                }
                var partyDomKey = ff7PartyDomKey(d.party);
                var partyRowCount = partyEl.querySelectorAll('.char-row').length;
                var needPartyRebuild =
                    partyDomKey !== window._ff7PartyDomKey ||
                    partyRowCount !== partyFiltered.length;
                if (needPartyRebuild) {
                    window._ff7PartyDomKey = partyDomKey;
                    partyEl.innerHTML = '';
                    d.party.forEach(function (p) {
                        if (p.slot_empty) return;
                        renderPartyRow(partyEl, p);
                    });
                } else {
                    patchPartyRowStats(partyEl, d.party);
                }
            }

            var enemyEl = document.getElementById('enemyBody');
            var showEnemies = asBool(cfg.ShowEnemies, true);

            /* Server ``battle_ui`` latches combat for overlay; raw ``battle`` stays instant for logic. */
            var showBattleUi = typeof d.battle_ui === 'boolean' ? d.battle_ui : d.battle;

            var hasEnemies = showBattleUi && Array.isArray(d.enemies) && d.enemies.length > 0;

            var enemyListRebuilt = false;
            var hideEnemyPanel = !showEnemies || !showBattleUi;
            if (showEnemies && hasEnemies) {
                var domKey = ff7EnemiesDomKey(d.enemies);
                var needRebuild =
                    domKey !== window._ff7EnemyDomKey ||
                    enemyEl.children.length !== d.enemies.length;
                if (needRebuild) {
                    window._ff7EnemyDomKey = domKey;
                    enemyEl.innerHTML = '';
                    d.enemies.forEach(function (e) {
                        renderEnemyRow(enemyEl, e);
                    });
                    enemyListRebuilt = true;
                } else {
                    patchEnemyRowStats(enemyEl, d.enemies);
                }
            } else if (hideEnemyPanel) {
                window._ff7EnemyDomKey = '';
                enemyEl.innerHTML = '';
            }
            window._ff7RenderState = { d: d };
            updateFf7Rotors();

            document.getElementById('panelEnemies').classList.toggle('hidden', hideEnemyPanel);

            if (enemyListRebuilt) {
                scheduleRefreshEnemyNameMarquees();
                scheduleRefreshEnemyNameMarqueesDelayed();
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(function () {
                        scheduleRefreshEnemyNameMarquees();
                        scheduleRefreshEnemyNameMarqueesDelayed();
                    });
                }
            }

            document.getElementById('panelStats').classList.toggle('hidden', !recordsPanelVisible());
            if (recordsPanelVisible()) {
                if (cfg.ShowGil !== undefined ? asBool(cfg.ShowGil, true) : asBool(cfg.ShowStats, true)) {
                    document.getElementById('gilVal').textContent = formatGil(d.gil != null ? d.gil : 0);
                }
                if (cfg.ShowPlaytime !== undefined ? asBool(cfg.ShowPlaytime, true) : asBool(cfg.ShowStats, true)) {
                    document.getElementById('timeVal').textContent = d.playtime_text || '--:--:--';
                }
                if (asBool(cfg.ShowFieldName, true)) {
                    document.getElementById('fieldVal').textContent = (d.field_name && String(d.field_name).trim()) ? d.field_name : '—';
                }
                if (asBool(cfg.ShowModuleName, true)) {
                    var mn = d.current_module_name || '';
                    var mc = d.current_module;
                    var mcNum = mc !== undefined && mc !== null ? Number(mc) : NaN;
                    var modDisp = '—';
                    if (!isNaN(mcNum) && mcNum === 17) {
                        modDisp = 'Victory';
                    } else if (mn) {
                        modDisp = mn + (!isNaN(mcNum) ? ' (' + mcNum + ')' : '');
                    } else if (!isNaN(mcNum)) {
                        modDisp = String(mcNum);
                    }
                    document.getElementById('moduleVal').textContent = modDisp;
                }
                if (asBool(cfg.ShowAvgPartyLevel, true)) {
                    var al = d.avg_party_level;
                    document.getElementById('avgLevelVal').textContent =
                        al !== undefined && al !== null && !isNaN(Number(al)) ? String(Math.round(Number(al))) : '0';
                }
                if (asBool(cfg.ShowMateriaCount, true)) {
                    var mt = d.equipped_materia_count;
                    document.getElementById('materiaCountVal').textContent =
                        mt !== undefined && mt !== null && !isNaN(Number(mt)) ? String(Math.max(0, Math.floor(Number(mt)))) : '0';
                }
                if (asBool(cfg.ShowBattleAtbMode, true)) {
                    var atbEl = document.getElementById('battleAtbVal');
                    if (atbEl) {
                        atbEl.textContent = ff7BattleAtbLabel(d.battle_atb_mode, d.battle_mode_ram);
                    }
                }
                if (asBool(cfg.ShowRecentItem, true)) {
                    var riEl = document.getElementById('recentItemVal');
                    if (riEl) {
                        var ri = d.recent_item;
                        if (ri && ri.name) {
                            var dlt = ri.delta != null ? Number(ri.delta) : 0;
                            riEl.textContent = ri.name + (dlt ? ' +' + String(dlt) : '');
                        } else {
                            riEl.textContent = '—';
                        }
                    }
                }
            }

            var blogPan = document.getElementById('panelBattleLog');
            var blogBody = document.getElementById('battleLogBody');
            var showBlog = asBool(cfg.ShowBattleLog, false);
            var hideBlog = !showBlog || !showBattleUi;
            if (blogPan) blogPan.classList.toggle('hidden', hideBlog);
            if (blogBody && showBlog && showBattleUi) {
                var lines = Array.isArray(d.battle_log) ? d.battle_log : [];
                var maxL = num(cfg.BattleLogMaxLines, 40);
                var use = lines.length > maxL ? lines.slice(-maxL) : lines;
                blogBody.textContent = use.length ? use.join('\n') : '—';
                scrollElementToBottom(blogBody);
            }

            var bossBody = document.getElementById('bossBody');
            bossBody.innerHTML = '';
            var bosses = d.bosses || { names: [], last: '', count: 0 };
            var mode = cfg.BossDisplayMode || 'list';
            if (asBool(cfg.ShowBosses, true)) {
                if (mode === 'count') {
                    var countRow = document.createElement('div');
                    countRow.className = 'boss-kv-row';
                    var countLab = document.createElement('span');
                    countLab.className = 'boss-kv-label';
                    countLab.textContent = String(cfg.BossCountLabel != null ? cfg.BossCountLabel : 'Defeated');
                    var countVal = document.createElement('span');
                    countVal.className = 'boss-kv-val';
                    countVal.textContent = String(bosses.count || 0);
                    countRow.appendChild(countLab);
                    countRow.appendChild(countVal);
                    bossBody.appendChild(countRow);
                } else if (mode === 'last') {
                    var lastRow = document.createElement('div');
                    lastRow.className = 'boss-kv-row';
                    var lastLab = document.createElement('span');
                    lastLab.className = 'boss-kv-label';
                    lastLab.textContent = String(cfg.BossLastLabel != null ? cfg.BossLastLabel : 'Last');
                    var lastVal = document.createElement('span');
                    lastVal.className = 'boss-kv-val';
                    lastVal.textContent = bosses.last ? String(bosses.last) : '—';
                    lastRow.appendChild(lastLab);
                    lastRow.appendChild(lastVal);
                    bossBody.appendChild(lastRow);
                } else {
                    var names = bosses.names || [];
                    if (!names.length) {
                        var emptyList = document.createElement('span');
                        emptyList.className = 'boss-empty';
                        emptyList.textContent = 'No bosses recorded yet.';
                        bossBody.appendChild(emptyList);
                    } else {
                        var nameBlock = document.createElement('div');
                        nameBlock.className = 'boss-name-list';
                        nameBlock.textContent = names.join(', ');
                        bossBody.appendChild(nameBlock);
                    }
                }
            }
        }

        applyTemplateConfig({});

        var socketUrl = window.location.protocol + '//' + window.location.host;
        socket = typeof MycelianOverlay !== 'undefined'
            ? MycelianOverlay.connect(socketUrl, {
                socketOptions: { path: '/socket.io', transports: ['polling', 'websocket'] }
            })
            : (typeof io !== 'undefined'
                ? io(socketUrl, { path: '/socket.io', transports: ['polling', 'websocket'] })
                : null);

        if (socket) {
            socket.on('connect', function () {
                if (FF7_DEBUG) console.log('[ff7] socket connected', socket.id);
            });
            socket.on('disconnect', function (reason) {
                if (FF7_DEBUG) console.warn('[ff7] socket disconnect', reason);
            });
            socket.on('connect_error', function (err) {
                console.error('[ff7] socket connect_error', err);
            });
            socket.on('game_hook_payload', renderPayload);

            socket.on('ff7_clear_bosses', function () {
                socket.emit('game_hook_command', { hook: 'ff7', action: 'clear_bosses' });
            });
            socket.on('template_config_updated', function (data) {
                if (data && data.template && data.template !== 'ff7') return;
                loadTemplateConfig();
            });
        }

        loadTemplateConfig();
    </script>
</body>
</html>
