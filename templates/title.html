<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mycelian Title Display</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script>MycelianLog.init({ templateName: 'title' });</script>
    <style>
        @font-face {
            font-family: title-font;
            src: url("/assets/default_assets/fonts/{{ FontName | default('Renogare.ttf', true) }}");
        }

        :root {
            --title-font-size: {{ FontSize | default(60, true) }}px;
            --title-white-space: {{ 'nowrap' if TextWrap == 'nowrap' else 'normal' }};
            --title-text-align: {{ 'left' if TitleAlign == 'flex-start' else ('right' if TitleAlign == 'flex-end' else 'center') }};
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: title-font, Arial, sans-serif;
        }

        /* The stage fills the whole browser source. Size the OBS source to the
           area you want the text to occupy - there is no inner text box. */
        #titleStage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: {{ ContainerBG | default('transparent', true) }};
            border: {{ ContainerBorder | default(0) }}px solid {{ ContainerBorderColor | default('transparent', true) }};
            border-radius: {{ ContainerRadius | default(0) }}px;
            padding: {{ ContainerPadding | default(0) }}px;
            overflow: hidden;
        }

        /* Fills the stage content box (inside border + padding). Absolutely
           positioned children resolve against this, so padding is respected. */
        #titleViewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* One full-size flex box per text layer; handles both alignments. */
        .title-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: {{ TitleAlign | default('center', true) }};
            align-items: {{ TitleVAlign | default('center', true) }};
            overflow: hidden;
        }

        #wipeLayer {
            display: none;
        }

        .title-text {
            font-size: var(--title-font-size);
            font-weight: {{ FontWeight | default('bold', true) }};
            color: {{ FontColor | default('#ffffff', true) }};
            text-shadow: {{ TextShadow | default('none', true) }};
            line-height: {{ LineHeight | default(1.2, true) }};
            text-align: var(--title-text-align);
            white-space: var(--title-white-space);
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        /* Fade transition (used when the wipe animation is off) */
        .title-text.updating {
            opacity: {{ PulseOpacity | default(0.7, true) }};
            transition: opacity {{ TransitionDuration | default(0.3, true) }}s ease;
        }

        .title-text.updated {
            opacity: 1;
            transition: opacity {{ TransitionDuration | default(0.3, true) }}s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: {{ PulseOpacity | default(0.7, true) }};
            }
        }

        .title-text.pulse {
            animation: pulse {{ PulseSpeed | default(2, true) }}s infinite;
        }

        .title-text.glow {
            text-shadow: {{ TextShadow | default('none', true) }},
            0 0 10px {{ GlowColor | default('#ffffff', true) }},
            0 0 20px {{ GlowColor | default('#ffffff', true) }};
        }

        /* Off-screen measuring element for auto font scaling */
        #titleProbe {
            position: absolute !important;
            left: -99999px !important;
            top: 0 !important;
            visibility: hidden !important;
            max-width: none !important;
            max-height: none !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>
    <div id="titleStage">
        <div id="titleViewport">
            <div class="title-layer" id="titleTextLayer">
                <div class="title-text" id="titleText">Stream Title</div>
            </div>
            <div class="title-layer" id="wipeLayer" aria-hidden="true">
                <div class="title-text" id="wipeText"></div>
            </div>
        </div>
    </div>

    <script>
        var mycelianPreviewMode = {{ mycelian_preview_mode | default(false) | tojson }};

        var socket = MycelianOverlay.connect('http://' + document.domain + ':' + location.port, {
            onRecovery: refreshStreamData
        });

        var titleData = {
            placeholder: "Stream Title",
            showCategory: {{ ShowCategory | default(true) | tojson }},
            categoryPrefix: {{ CategoryPrefix | default('') | tojson }},
            categorySuffix: {{ CategorySuffix | default('') | tojson }}
        };

        var settings = {
            enableAnimations: {{ EnableAnimations | default(true) | tojson }},
            enablePulse: {{ EnablePulse | default(false) | tojson }},
            enableGlow: {{ EnableGlow | default(false) | tojson }},
            enableWipe: {{ EnableWipe | default(true) | tojson }},
            wipeDirection: {{ WipeDirection | default('left-to-right', true) | tojson }},
            wipeEasing: {{ WipeEasing | default(0.25, true) | tojson }},
            transitionDuration: {{ TransitionDuration | default(0.3, true) | tojson }},
            autoFitText: {{ AutoFitText | default(true) | tojson }},
            textWrap: {{ TextWrap | default('wrap', true) | tojson }},
            fontSize: {{ FontSize | default(60, true) | tojson }},
            minFontSize: {{ MinFontSize | default(12, true) | tojson }},
            dataSource: {{ DataSource | default('api_and_eventsub', true) | tojson }},
            apiPollInterval: {{ ApiPollInterval | default(60) | tojson }}
        };

        // ── Data source mode ──────────────────────────────────────────────
        // api_and_eventsub: poll Helix on a timer AND accept live EventSub pushes
        // eventsub_only:    only accept live EventSub pushes
        // api_only:         only poll Helix (ignore EventSub pushes)
        function useApi() {
            return settings.dataSource === 'api_only' || settings.dataSource === 'api_and_eventsub';
        }

        function useEventSub() {
            return settings.dataSource === 'eventsub_only' || settings.dataSource === 'api_and_eventsub';
        }

        var MIN_POLL_SECONDS = 15;

        function pollIntervalMs() {
            var seconds = Number(settings.apiPollInterval);
            if (!isFinite(seconds) || seconds <= 0) {
                return 0;
            }
            return Math.max(MIN_POLL_SECONDS, seconds) * 1000;
        }

        var currentCategory = "";
        var manualTitle = {{ ManualTitle | default('') | tojson }};
        var currentStreamerName = "";
        var broadcasterId = "";

        var displayedText = "";
        var pendingText = null;
        var isAnimating = false;
        var animationTimers = [];

        var streamerInfoInFlight = false;
        var streamerInfoRetryTimer = null;
        var streamerInfoRetryMs = 1000;
        var STREAMER_INFO_RETRY_MAX_MS = 30000;

        var pendingApiRequestId = null;
        var apiWatchdogTimer = null;
        var API_WATCHDOG_MS = 10000;
        var apiRetryTimer = null;
        var apiRetryMs = 5000;
        var API_RETRY_BASE_MS = 5000;
        var API_RETRY_MAX_MS = 60000;
        var apiPollTimer = null;

        var manualTitleSaveTimeout = null;
        var connectorRevertTimeout = null;

        var STORAGE_KEYS = {
            MANUAL_TITLE: 'mycelian_title_manual_title',
            OVERRIDE: 'mycelian_title_override'
        };

        var LEGACY_STORAGE_KEYS = [
            'mycelian_title_show_category',
            'mycelian_title_manual_mode'
        ];

        // ── Auto font scaling ─────────────────────────────────────────────

        function getViewport() {
            return document.getElementById('titleViewport');
        }

        function getProbe() {
            var probe = document.getElementById('titleProbe');
            if (!probe) {
                probe = document.createElement('div');
                probe.id = 'titleProbe';
                probe.className = 'title-text';
                document.body.appendChild(probe);
            }
            return probe;
        }

        function probeFits(probe, size, availWidth, availHeight, wrap) {
            probe.style.fontSize = size + 'px';
            if (wrap) {
                // Fixed width so the text wraps; only height can overflow, but a
                // single unbreakable word can still blow out the width.
                if (probe.scrollWidth > availWidth + 1) {
                    return false;
                }
                return probe.scrollHeight <= availHeight + 1;
            }
            return probe.scrollWidth <= availWidth + 1 && probe.scrollHeight <= availHeight + 1;
        }

        // Largest integer font size (between MinFontSize and FontSize) at which
        // `text` fits the source without overflowing.
        function computeFittedFontSize(text) {
            var maxSize = Number(settings.fontSize) || 60;
            if (!settings.autoFitText) {
                return maxSize;
            }

            var viewport = getViewport();
            if (!viewport || !text) {
                return maxSize;
            }

            var availWidth = viewport.clientWidth;
            var availHeight = viewport.clientHeight;
            if (availWidth <= 0 || availHeight <= 0) {
                return maxSize;
            }

            var minSize = Number(settings.minFontSize) || 1;
            if (minSize > maxSize) {
                minSize = maxSize;
            }

            var wrap = settings.textWrap !== 'nowrap';
            var probe = getProbe();
            probe.textContent = text;
            probe.style.whiteSpace = wrap ? 'normal' : 'nowrap';
            probe.style.width = wrap ? availWidth + 'px' : 'auto';

            if (probeFits(probe, maxSize, availWidth, availHeight, wrap)) {
                return maxSize;
            }

            var low = minSize;
            var high = maxSize;
            var best = minSize;
            while (low <= high) {
                var mid = Math.floor((low + high) / 2);
                if (probeFits(probe, mid, availWidth, availHeight, wrap)) {
                    best = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }
            return best;
        }

        function applyFittedFontSize() {
            // Fit against the longest text currently on screen so a mid-wipe
            // outgoing string is never clipped.
            var text = displayedText;
            var wipeText = document.getElementById('wipeText');
            if (isAnimating && wipeText && wipeText.textContent.length > text.length) {
                text = wipeText.textContent;
            }
            var size = computeFittedFontSize(text);
            document.documentElement.style.setProperty('--title-font-size', size + 'px');
        }

        var fitScheduled = false;

        function scheduleFit() {
            if (fitScheduled) {
                return;
            }
            fitScheduled = true;
            requestAnimationFrame(function () {
                fitScheduled = false;
                applyFittedFontSize();
            });
        }

        function applyTextWrapMode() {
            document.documentElement.style.setProperty(
                '--title-white-space',
                settings.textWrap === 'nowrap' ? 'nowrap' : 'normal'
            );
        }

        // OBS sources are resized to arbitrary sizes at runtime; refit whenever
        // the window changes so the text always stays inside the source.
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(scheduleFit).observe(document.documentElement);
        }
        window.addEventListener('resize', scheduleFit);

        // The @font-face loads asynchronously - a first-paint measurement would
        // otherwise be taken against the fallback font and come out wrong.
        if (document.fonts) {
            document.fonts.ready.then(scheduleFit);
            try {
                document.fonts.load('1em title-font').then(scheduleFit, function () { });
            } catch (e) {
                /* older browsers: fonts.ready is enough */
            }
        }

        // ── Text rendering ────────────────────────────────────────────────

        function clearAnimationTimers() {
            animationTimers.forEach(function (id) {
                clearTimeout(id);
            });
            animationTimers = [];
        }

        function addAnimationTimer(callback, delayMs) {
            var id = setTimeout(function () {
                animationTimers = animationTimers.filter(function (other) {
                    return other !== id;
                });
                callback();
            }, delayMs);
            animationTimers.push(id);
            return id;
        }

        function applyEffects() {
            ['titleText', 'wipeText'].forEach(function (id) {
                var el = document.getElementById(id);
                if (!el) {
                    return;
                }
                el.classList.remove('pulse', 'glow');
                if (settings.enablePulse) {
                    el.classList.add('pulse');
                }
                if (settings.enableGlow) {
                    el.classList.add('glow');
                }
            });
        }

        function resetLayers() {
            var textLayer = document.getElementById('titleTextLayer');
            var wipeLayer = document.getElementById('wipeLayer');
            var wipeText = document.getElementById('wipeText');
            if (textLayer) {
                textLayer.style.transition = 'none';
                textLayer.style.transform = 'none';
            }
            if (wipeLayer) {
                wipeLayer.style.transition = 'none';
                wipeLayer.style.transform = 'none';
                wipeLayer.style.display = 'none';
            }
            if (wipeText) {
                wipeText.textContent = '';
            }
        }

        function commitText(text) {
            var titleText = document.getElementById('titleText');
            if (titleText) {
                titleText.textContent = text;
                titleText.classList.remove('updating', 'updated');
            }
            displayedText = text;
            resetLayers();
            applyEffects();
            scheduleFit();
        }

        // Requests are coalesced into a single pending slot: a change that
        // arrives mid-animation is applied when the animation drains instead of
        // destroying the running transition.
        function renderText(text) {
            pendingText = text;
            if (isAnimating) {
                return;
            }
            drainPendingText();
        }

        function drainPendingText() {
            if (pendingText === null) {
                return;
            }
            var target = pendingText;
            pendingText = null;

            if (target === displayedText) {
                return;
            }

            if (!shouldAnimateTitleChange()) {
                commitText(target);
                return;
            }

            if (settings.enableWipe) {
                startWipe(target);
            } else {
                startFade(target);
            }
        }

        function setTextImmediate(text) {
            clearAnimationTimers();
            isAnimating = false;
            pendingText = null;
            commitText(text);
        }

        function shouldAnimateTitleChange() {
            // Custom titles are typed character by character; animating them
            // would drop keystrokes.
            return titleData.showCategory && settings.enableAnimations;
        }

        function wipeOffsets() {
            var direction = settings.wipeDirection;
            if (direction === 'right-to-left') {
                return { axis: 'X', enter: '-100%', exit: '100%' };
            }
            if (direction === 'top-to-bottom') {
                return { axis: 'Y', enter: '-100%', exit: '100%' };
            }
            if (direction === 'bottom-to-top') {
                return { axis: 'Y', enter: '100%', exit: '-100%' };
            }
            return { axis: 'X', enter: '100%', exit: '-100%' };
        }

        function startWipe(newText) {
            var textLayer = document.getElementById('titleTextLayer');
            var wipeLayer = document.getElementById('wipeLayer');
            var wipeText = document.getElementById('wipeText');
            if (!textLayer || !wipeLayer || !wipeText) {
                commitText(newText);
                return;
            }

            isAnimating = true;
            clearAnimationTimers();

            var offsets = wipeOffsets();
            var duration = Number(settings.transitionDuration) || 0.3;
            var easing = 'cubic-bezier(' + settings.wipeEasing + ', 0.46, 0.45, 0.94)';

            wipeText.textContent = newText;
            applyEffects();
            applyFittedFontSize();

            textLayer.style.transition = 'none';
            textLayer.style.transform = 'translate' + offsets.axis + '(0%)';
            wipeLayer.style.display = 'flex';
            wipeLayer.style.transition = 'none';
            wipeLayer.style.transform = 'translate' + offsets.axis + '(' + offsets.enter + ')';

            // Force a reflow so the browser records the start positions before
            // the transition is attached.
            void wipeLayer.offsetHeight;

            textLayer.style.transition = 'transform ' + duration + 's ' + easing;
            wipeLayer.style.transition = 'transform ' + duration + 's ' + easing;
            textLayer.style.transform = 'translate' + offsets.axis + '(' + offsets.exit + ')';
            wipeLayer.style.transform = 'translate' + offsets.axis + '(0%)';

            addAnimationTimer(function () {
                isAnimating = false;
                commitText(newText);
                drainPendingText();
            }, duration * 1000 + 40);
        }

        function startFade(newText) {
            var titleText = document.getElementById('titleText');
            if (!titleText) {
                commitText(newText);
                return;
            }

            isAnimating = true;
            clearAnimationTimers();

            var duration = Number(settings.transitionDuration) || 0.3;
            titleText.classList.remove('updated');
            titleText.classList.add('updating');

            addAnimationTimer(function () {
                var live = document.getElementById('titleText');
                if (!live) {
                    isAnimating = false;
                    return;
                }
                live.textContent = newText;
                displayedText = newText;
                live.classList.remove('updating');
                live.classList.add('updated');
                applyEffects();
                scheduleFit();

                addAnimationTimer(function () {
                    var el = document.getElementById('titleText');
                    if (el) {
                        el.classList.remove('updated');
                    }
                    isAnimating = false;
                    drainPendingText();
                }, duration * 1000);
            }, duration * 500);
        }

        function computeDesiredText() {
            if (!titleData.showCategory) {
                return manualTitle.trim().length === 0 ? '' : manualTitle;
            }
            if (currentCategory) {
                return titleData.categoryPrefix + currentCategory + titleData.categorySuffix;
            }
            return titleData.placeholder;
        }

        function updateTitle(immediate) {
            var desired = computeDesiredText();
            if (immediate) {
                setTextImmediate(desired);
            } else {
                renderText(desired);
            }
        }

        // Always record the category, whatever the Show Category toggle says.
        // Only rendering consults the toggle, so switching it back on paints the
        // live value instantly instead of a stale one.
        function setCategory(category) {
            var next = category || "";
            if (next === currentCategory) {
                return;
            }
            currentCategory = next;
            updateTitle();
        }

        // ── Persistence ───────────────────────────────────────────────────

        function saveManualTitleSettings() {
            try {
                localStorage.setItem(STORAGE_KEYS.MANUAL_TITLE, manualTitle);
            } catch (e) {
                console.warn('Failed to save title settings:', e);
            }
        }

        function scheduleManualTitleSave() {
            if (manualTitleSaveTimeout) {
                clearTimeout(manualTitleSaveTimeout);
            }
            manualTitleSaveTimeout = setTimeout(function () {
                manualTitleSaveTimeout = null;
                saveManualTitleSettings();
            }, 250);
        }

        // Show Category deliberately does NOT come from localStorage. It used to,
        // which meant a single stuck 'false' silently discarded every EventSub
        // category update for good. The template config (persisted server-side by
        // the toggle) is now the only source of truth. localStorage caches just
        // the typed custom title, which has no server-side persistence.
        function loadManualTitleSettings() {
            try {
                LEGACY_STORAGE_KEYS.forEach(function (key) {
                    localStorage.removeItem(key);
                });
                var savedTitle = localStorage.getItem(STORAGE_KEYS.MANUAL_TITLE);
                if (savedTitle !== null && !manualTitle) {
                    manualTitle = savedTitle;
                }
            } catch (e) {
                console.warn('Failed to load title settings:', e);
            }
        }

        function saveOverride(override) {
            try {
                if (override) {
                    localStorage.setItem(STORAGE_KEYS.OVERRIDE, JSON.stringify(override));
                } else {
                    localStorage.removeItem(STORAGE_KEYS.OVERRIDE);
                }
            } catch (e) {
                console.warn('Failed to save title override:', e);
            }
        }

        function readOverride() {
            try {
                var raw = localStorage.getItem(STORAGE_KEYS.OVERRIDE);
                if (!raw) {
                    return null;
                }
                var parsed = JSON.parse(raw);
                return (parsed && typeof parsed === 'object') ? parsed : null;
            } catch (e) {
                return null;
            }
        }

        function applyOverrideRevert(override) {
            if (override && override.revert) {
                titleData.showCategory = override.revert.showCategory !== false;
                manualTitle = typeof override.revert.manualTitle === 'string'
                    ? override.revert.manualTitle
                    : '';
            }
            saveOverride(null);
            saveManualTitleSettings();
        }

        function scheduleOverrideRevert(override) {
            if (connectorRevertTimeout) {
                clearTimeout(connectorRevertTimeout);
                connectorRevertTimeout = null;
            }
            var remaining = Number(override.expiresAt) - Date.now();
            if (!isFinite(remaining)) {
                return;
            }
            if (remaining <= 0) {
                applyOverrideRevert(override);
                updateTitle();
                refreshStreamData();
                return;
            }
            connectorRevertTimeout = setTimeout(function () {
                connectorRevertTimeout = null;
                applyOverrideRevert(override);
                updateTitle();
                refreshStreamData();
            }, remaining);
        }

        // A timed connector title used to be reverted by an in-memory timer, so a
        // source refresh during the window stranded Show Category off forever.
        // The expiry is now absolute and re-checked on every load.
        function restorePendingOverride() {
            var override = readOverride();
            if (!override || !override.expiresAt) {
                return;
            }
            if (Number(override.expiresAt) <= Date.now()) {
                applyOverrideRevert(override);
                return;
            }
            if (typeof override.text === 'string') {
                manualTitle = override.text;
                titleData.showCategory = false;
            }
            scheduleOverrideRevert(override);
        }

        // ── Stream data ───────────────────────────────────────────────────

        function requestStreamerInfo() {
            if (streamerInfoInFlight) {
                return;
            }
            streamerInfoInFlight = true;
            socket.emit('get-streamer-info');
        }

        function stopStreamerInfoRetry() {
            if (streamerInfoRetryTimer) {
                clearTimeout(streamerInfoRetryTimer);
                streamerInfoRetryTimer = null;
            }
        }

        // The web engine is up about a second before Twitch auth completes, so an
        // OBS source that loads first gets a response with no user_id. Keep asking
        // instead of giving up.
        function scheduleStreamerInfoRetry() {
            stopStreamerInfoRetry();
            streamerInfoRetryTimer = setTimeout(function () {
                streamerInfoRetryTimer = null;
                streamerInfoRetryMs = Math.min(STREAMER_INFO_RETRY_MAX_MS, streamerInfoRetryMs * 2);
                requestStreamerInfo();
            }, streamerInfoRetryMs);
        }

        function clearApiWatchdog() {
            if (apiWatchdogTimer) {
                clearTimeout(apiWatchdogTimer);
                apiWatchdogTimer = null;
            }
        }

        function stopApiRetry() {
            if (apiRetryTimer) {
                clearTimeout(apiRetryTimer);
                apiRetryTimer = null;
            }
        }

        function scheduleApiRetry() {
            stopApiRetry();
            apiRetryTimer = setTimeout(function () {
                apiRetryTimer = null;
                apiRetryMs = Math.min(API_RETRY_MAX_MS, apiRetryMs * 2);
                fetchChannelInfo();
            }, apiRetryMs);
        }

        function stopApiPoll() {
            if (apiPollTimer) {
                clearInterval(apiPollTimer);
                apiPollTimer = null;
            }
        }

        // The poll is a standing safety net. It is deliberately NOT cancelled when
        // EventSub delivers, because EventSub can die silently and the server-side
        // health check can take up to 45 minutes to rebuild subscriptions.
        function startApiPoll() {
            stopApiPoll();
            var interval = pollIntervalMs();
            if (!useApi() || interval <= 0) {
                return;
            }
            apiPollTimer = setInterval(fetchChannelInfo, interval);
        }

        // /helix/channels works whether or not the stream is live and is keyed by
        // broadcaster_id, unlike /helix/streams?user_login= which returns an empty
        // array while offline and needs a login rather than a display name.
        function fetchChannelInfo() {
            if (!useApi() || !broadcasterId || pendingApiRequestId) {
                return;
            }

            pendingApiRequestId = 'title_channel_' + Date.now() + '_' +
                Math.random().toString(36).slice(2, 8);

            clearApiWatchdog();
            apiWatchdogTimer = setTimeout(function () {
                // The server's bounded Twitch worker queue drops requests without
                // replying; without this the overlay would block fetches forever.
                apiWatchdogTimer = null;
                pendingApiRequestId = null;
                console.warn('Twitch API request timed out; will retry');
                scheduleApiRetry();
            }, API_WATCHDOG_MS);

            socket.emit('twitch-api-request', {
                endpoint: 'https://api.twitch.tv/helix/channels?broadcaster_id=' +
                    encodeURIComponent(broadcasterId),
                requestId: pendingApiRequestId
            });
        }

        function refreshStreamData() {
            streamerInfoRetryMs = 1000;
            apiRetryMs = API_RETRY_BASE_MS;
            stopApiRetry();
            requestStreamerInfo();
            if (useApi() && broadcasterId) {
                fetchChannelInfo();
            }
        }

        // ── Socket events ─────────────────────────────────────────────────

        socket.on('connect', function () {
            // A request that was in flight when the socket dropped will never be
            // answered, so clear the single-flight guards rather than letting
            // them block every later fetch.
            streamerInfoInFlight = false;
            pendingApiRequestId = null;
            clearApiWatchdog();
            refreshStreamData();
        });

        socket.on('disconnect', function () {
            console.log('Title socket disconnected');
            streamerInfoInFlight = false;
            pendingApiRequestId = null;
            clearApiWatchdog();
        });

        socket.on('connect_error', function (error) {
            console.warn('Title socket connection error:', error);
        });

        socket.on('template_config_updated', function (data) {
            var name = (data && (data.template_name || data.templateName || data.template)) || '';
            if (name === 'title') {
                // Hot-apply rather than reload so the overlay never flashes.
                loadTemplateConfig();
            }
        });

        socket.on('streamer-info', function (data) {
            streamerInfoInFlight = false;

            if (!data) {
                scheduleStreamerInfoRetry();
                return;
            }

            if (data.streamer_name) {
                currentStreamerName = data.streamer_name;
            }

            // Paint the server's cached category straight away so a source
            // refresh shows the right text without waiting for an API round-trip.
            if (typeof data.current_category === 'string' &&
                data.current_category &&
                data.current_category !== 'No Category') {
                setCategory(data.current_category);
            }

            if (data.user_id) {
                broadcasterId = String(data.user_id);
                stopStreamerInfoRetry();
                streamerInfoRetryMs = 1000;
                if (useApi()) {
                    fetchChannelInfo();
                    startApiPoll();
                }
            } else {
                // Twitch is not authenticated yet.
                scheduleStreamerInfoRetry();
            }
        });

        socket.on('streamer-info-error', function (error) {
            streamerInfoInFlight = false;
            console.error('Streamer info error:', error);
            scheduleStreamerInfoRetry();
        });

        socket.on('twitch-api-response', function (data) {
            // Exact match: a stale or unrelated response must not be mistaken for
            // the one this overlay is waiting on.
            if (!data || !data.requestId || data.requestId !== pendingApiRequestId) {
                return;
            }

            pendingApiRequestId = null;
            clearApiWatchdog();

            var channels = data.success && data.data && data.data.data;
            if (Array.isArray(channels) && channels.length > 0) {
                var channel = channels[0];
                if (channel.game_name !== undefined) {
                    setCategory(channel.game_name || '');
                }
                apiRetryMs = API_RETRY_BASE_MS;
                stopApiRetry();
                return;
            }

            console.warn('No channel data in Twitch API response; scheduling retry');
            scheduleApiRetry();
        });

        socket.on('twitch_data_update', function (data) {
            if (!useEventSub()) {
                return;
            }
            if (!data || data.current_category === undefined) {
                return;
            }
            setCategory(data.current_category || '');
        });

        // ── Dynamic controls ──────────────────────────────────────────────

        socket.on('title_toggle_show_category', function (data) {
            if (!data || typeof data.enabled !== 'boolean') {
                return;
            }
            titleData.showCategory = data.enabled;
            saveManualTitleSettings();
            updateTitle();
            if (titleData.showCategory) {
                refreshStreamData();
            }
        });

        socket.on('title_set_manual_title', function (data) {
            if (!data || data.text === undefined || data.text === null) {
                return;
            }
            manualTitle = String(data.text);
            scheduleManualTitleSave();
            // Typing no longer flips Show Category off; that used to strand the
            // overlay so EventSub category updates were silently ignored.
            if (!titleData.showCategory) {
                updateTitle(true);
            }
        });

        socket.on('title_clear_manual_title', function (data) {
            manualTitle = "";
            titleData.showCategory = true;
            saveOverride(null);
            if (connectorRevertTimeout) {
                clearTimeout(connectorRevertTimeout);
                connectorRevertTimeout = null;
            }
            saveManualTitleSettings();
            updateTitle();
            refreshStreamData();
        });

        socket.on('title_set_wipe_direction', function (data) {
            if (data && data.direction) {
                var allowed = ['left-to-right', 'right-to-left', 'top-to-bottom', 'bottom-to-top'];
                if (allowed.indexOf(data.direction) !== -1) {
                    settings.wipeDirection = data.direction;
                }
            }
        });

        socket.on('title_toggle_wipe_animation', function (data) {
            if (data && typeof data.enabled === 'boolean') {
                settings.enableWipe = data.enabled;
            }
        });

        socket.on('title_refresh_title', function () {
            refreshStreamData();
        });

        // ── Connector actions ─────────────────────────────────────────────

        socket.on('title_change_title', function (data) {
            if (!data) {
                return;
            }

            var text = '';
            if (typeof data.title_text === 'string') {
                text = data.title_text.trim();
            } else if (typeof data.title === 'string') {
                text = data.title.trim();
            }

            if (connectorRevertTimeout) {
                clearTimeout(connectorRevertTimeout);
                connectorRevertTimeout = null;
            }

            var duration = Number(data.display_duration);
            if (isNaN(duration) || duration < 0) {
                duration = 0;
            }

            var setCustom = data.set_custom === true || data.set_custom === 'true';

            var override = null;
            if (duration > 0) {
                // Store an absolute expiry so a refresh mid-window still reverts.
                override = {
                    text: text,
                    expiresAt: Date.now() + duration * 1000,
                    revert: {
                        showCategory: titleData.showCategory,
                        manualTitle: manualTitle
                    }
                };
            }

            manualTitle = text;
            if (setCustom || duration > 0 || (duration === 0 && text.length > 0)) {
                titleData.showCategory = false;
            }

            if (override) {
                saveOverride(override);
            } else {
                saveOverride(null);
            }
            saveManualTitleSettings();
            updateTitle();

            if (override) {
                scheduleOverrideRevert(override);
            }
        });

        // ── Config (Source Settings + Spore Studio preview) ───────────────

        function _titleCfg(config, key, fallback) {
            var v = config[key];
            return (v !== undefined && v !== null && v !== '') ? v : fallback;
        }

        function buildTitleCss(config) {
            var fontName = _titleCfg(config, 'FontName', 'Renogare.ttf');
            var titleAlign = _titleCfg(config, 'TitleAlign', 'center');
            var titleVAlign = _titleCfg(config, 'TitleVAlign', 'center');
            var containerBG = _titleCfg(config, 'ContainerBG', 'transparent');
            var containerRadius = _titleCfg(config, 'ContainerRadius', 0);
            var containerBorder = _titleCfg(config, 'ContainerBorder', 0);
            var containerBorderColor = _titleCfg(config, 'ContainerBorderColor', 'transparent');
            var containerPadding = _titleCfg(config, 'ContainerPadding', 0);
            var fontWeight = _titleCfg(config, 'FontWeight', 'bold');
            var fontColor = _titleCfg(config, 'FontColor', '#ffffff');
            var textShadow = _titleCfg(config, 'TextShadow', 'none');
            var lineHeight = _titleCfg(config, 'LineHeight', 1.2);
            var transitionDuration = _titleCfg(config, 'TransitionDuration', 0.3);
            var pulseOpacity = _titleCfg(config, 'PulseOpacity', 0.7);
            var pulseSpeed = _titleCfg(config, 'PulseSpeed', 2);
            var glowColor = _titleCfg(config, 'GlowColor', '#ffffff');

            var textAlign = titleAlign === 'flex-start'
                ? 'left'
                : (titleAlign === 'flex-end' ? 'right' : 'center');

            return (
                '@font-face { font-family: title-font; src: url("/assets/default_assets/fonts/' + fontName + '"); }' +
                ':root { --title-text-align: ' + textAlign + '; }' +
                'body { font-family: title-font, Arial, sans-serif; }' +
                '#titleStage { background: ' + containerBG + '; ' +
                'border: ' + containerBorder + 'px solid ' + containerBorderColor + '; ' +
                'border-radius: ' + containerRadius + 'px; padding: ' + containerPadding + 'px; }' +
                '.title-layer { justify-content: ' + titleAlign + '; align-items: ' + titleVAlign + '; }' +
                '.title-text { font-weight: ' + fontWeight + '; color: ' + fontColor + '; ' +
                'text-shadow: ' + textShadow + '; line-height: ' + lineHeight + '; }' +
                '.title-text.updating { opacity: ' + pulseOpacity + '; transition: opacity ' + transitionDuration + 's ease; }' +
                '.title-text.updated { opacity: 1; transition: opacity ' + transitionDuration + 's ease; }' +
                '@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: ' + pulseOpacity + '; } }' +
                '.title-text.pulse { animation: pulse ' + pulseSpeed + 's infinite; }' +
                '.title-text.glow { text-shadow: ' + textShadow + ', 0 0 10px ' + glowColor + ', 0 0 20px ' + glowColor + '; }'
            );
        }

        function applyTemplateConfig(config) {
            var styleEl = document.getElementById('mycelian-title-dynamic');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'mycelian-title-dynamic';
                document.head.appendChild(styleEl);
            }
            styleEl.textContent = buildTitleCss(config);

            if (config.CategoryPrefix !== undefined) { titleData.categoryPrefix = String(config.CategoryPrefix); }
            if (config.CategorySuffix !== undefined) { titleData.categorySuffix = String(config.CategorySuffix); }
            if (config.EnableAnimations !== undefined) { settings.enableAnimations = !!config.EnableAnimations; }
            if (config.EnablePulse !== undefined) { settings.enablePulse = !!config.EnablePulse; }
            if (config.EnableGlow !== undefined) { settings.enableGlow = !!config.EnableGlow; }
            if (config.EnableWipe !== undefined) { settings.enableWipe = !!config.EnableWipe; }
            if (config.WipeDirection !== undefined) { settings.wipeDirection = config.WipeDirection; }
            if (config.WipeEasing !== undefined) { settings.wipeEasing = config.WipeEasing; }
            if (config.TransitionDuration !== undefined) { settings.transitionDuration = config.TransitionDuration; }
            if (config.AutoFitText !== undefined) { settings.autoFitText = !!config.AutoFitText; }
            if (config.TextWrap !== undefined) { settings.textWrap = config.TextWrap; }
            if (config.FontSize !== undefined) { settings.fontSize = config.FontSize; }
            if (config.MinFontSize !== undefined) { settings.minFontSize = config.MinFontSize; }
            if (config.ShowCategory !== undefined) { titleData.showCategory = !!config.ShowCategory; }
            if (config.ManualTitle !== undefined) { manualTitle = String(config.ManualTitle); }

            var dataSourceChanged = config.DataSource !== undefined &&
                config.DataSource !== settings.dataSource;
            var pollChanged = config.ApiPollInterval !== undefined &&
                config.ApiPollInterval !== settings.apiPollInterval;
            if (config.DataSource !== undefined) { settings.dataSource = config.DataSource; }
            if (config.ApiPollInterval !== undefined) { settings.apiPollInterval = config.ApiPollInterval; }

            applyTextWrapMode();
            applyEffects();
            updateTitle();
            scheduleFit();

            if (dataSourceChanged || pollChanged) {
                startApiPoll();
                if (useApi()) {
                    fetchChannelInfo();
                }
            }
        }

        async function loadTemplateConfig() {
            try {
                var response = await fetch('/api/template-config/title', { credentials: 'same-origin' });
                if (!response.ok) {
                    console.error('Failed to load title template config:', response.status);
                    return null;
                }
                var titleConfigData = await response.json();
                if (!titleConfigData || !titleConfigData.elements) {
                    console.warn('No title config elements in response');
                    return null;
                }
                var config = {};
                titleConfigData.elements.forEach(function (element) {
                    if (element && element.id && element.type !== 'separator') {
                        config[element.id] = element.value;
                    }
                });
                applyTemplateConfig(config);
                return config;
            } catch (error) {
                console.error('Error loading template config:', error);
                return null;
            }
        }

        // ── Boot ──────────────────────────────────────────────────────────

        async function init() {
            if (mycelianPreviewMode) {
                await loadTemplateConfig();
            }
            applyTextWrapMode();
            loadManualTitleSettings();
            restorePendingOverride();
            updateTitle(true);
            startApiPoll();
            // Kick off a fetch here as well as on 'connect'. Socket.IO buffers
            // emits until the connection is up, and requestStreamerInfo() is
            // single-flight, so this is only a safety net for the case where the
            // connect event is missed and the source would otherwise sit empty.
            refreshStreamData();
        }

        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                refreshStreamData();
            }
        });

        init();
    </script>
</body>

</html>
