<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mycelian Bit Bar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script>MycelianLog.init({ templateName: 'bitbar' });</script>
    <style>
        @font-face {
            font-family: bitbar-font;
            src: url("/assets/default_assets/fonts/{{FontName}}");
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: bitbar-font, Arial, sans-serif;
        }

        .bitbar-container {
            position: absolute;

            bottom: {{ContainerBottom}}px;

            left: {{ContainerLeft}}px;

            width: {{ContainerWidth}}px;

            padding: {{ContainerPadding}}px;

            background: {{ContainerBG}};
            border-radius: {{ContainerRadius}}px;

            border: {{ContainerBorder}}px solid {{ContainerBorderColor}};

            box-shadow: {{ContainerShadow}};
        }

        .bitbar-title {
            font-size: {{TitleFontSize}}px;

            font-weight: {{TitleFontWeight}};

            color: {{TitleColor}};

            text-shadow: {{TitleTextShadow}};

            margin: 0 0 {{TitleMargin}}px 0;

            text-align: {{TitleAlign}};
        }

        .progress-container {
            position: relative;
            width: 100%;

            height: {{BarHeight}}px;

            background: {{BarBG}};
            border-radius: {{BarRadius}}px;

            border: {{BarBorder}}px solid {{BarBorderColor}};
            overflow: hidden;

            box-shadow: {{BarShadow}};

            margin-bottom: {{ProgressMargin}}px;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;

            background: {{BarColor}};
            border-radius: {{BarRadius}}px;

            transition: width {{BarAnimationDuration}}s {{BarAnimationEasing}};

            box-shadow: {{BarInnerShadow}};
            min-width: 0;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-size: {{ProgressFontSize}}px;

            font-weight: {{ProgressFontWeight}};

            color: {{ProgressTextColor}};

            text-shadow: {{ProgressTextShadow}};
            z-index: 10;
            white-space: nowrap;
        }

        .bitbar-message {
            font-size: {{MessageFontSize}}px;

            font-weight: {{MessageFontWeight}};

            color: {{MessageColor}};

            text-shadow: {{MessageTextShadow}};
            margin: 0;

            text-align: {{MessageAlign}};
        }

        .bit-indicator {
            position: absolute;

            top: {{BitIndicatorTop}}px;

            right: {{BitIndicatorRight}}px;

            font-size: {{BitIndicatorFontSize}}px;

            font-weight: {{BitIndicatorFontWeight}};

            color: {{BitIndicatorColor}};

            text-shadow: {{BitIndicatorTextShadow}};
            opacity: 0;
            transform: translateY(0);

            transition: all {{BitIndicatorAnimationDuration}}s {{BitIndicatorAnimationEasing}};
            z-index: 20;
            pointer-events: none;
        }

        .bit-indicator.show {
            opacity: 1;

            transform: translateY(-{{BitIndicatorFloatDistance}}px);
        }

        .goal-reached-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: {{GoalOverlayBG}};
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: {{GoalFontSize}}px;

            font-weight: {{GoalFontWeight}};

            color: {{GoalColor}};

            text-shadow: {{GoalTextShadow}};
            opacity: 0;

            transition: opacity {{GoalAnimationDuration}}s ease;
            z-index: 30;

            border-radius: {{ContainerRadius}}px;
        }

        .goal-reached-overlay.show {
            opacity: 1;
        }

        /* Pulse animation for near goal */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        .progress-bar.near-goal {
            animation: pulse {{PulseSpeed}}s infinite;
        }

        /* Glow effect for goal reached */
        @keyframes glow {

            0%,
            100% {
                box-shadow: {{BarShadow}};
            }

            50% {
                box-shadow: {{BarShadow|tojson}}, 0 0 20px {{GoalGlowColor}};
            }
        }

        .progress-container.goal-reached {
            animation: glow 1s ease-in-out;
        }

        /* Shake animation for new bits */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-1px);
            }

            75% {
                transform: translateX(1px);
            }
        }

        .bitbar-container.shake {
            animation: shake 0.2s ease-in-out;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .bitbar-container {
                width: calc({{ContainerWidth}}px * 0.9);
                padding: calc({{ContainerPadding}}px * 0.8);
            }

            .bitbar-title {
                font-size: calc({{TitleFontSize}}px * 0.9);
            }

            .bitbar-message {
                font-size: calc({{MessageFontSize}}px * 0.9);
            }
        }
    </style>
</head>

<body>
    <div class="bitbar-container" id="bitbarContainer">
        <h2 class="bitbar-title" id="bitbarTitle">{{DefaultTitle}}</h2>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">{{DefaultCurrentBits}}/{{DefaultGoal}} bits</div>
            <div class="goal-reached-overlay" id="goalOverlay">{{GoalReachedText}}</div>
        </div>
        <p class="bitbar-message" id="bitbarMessage">{{DefaultMessage}}</p>
        <div class="bit-indicator" id="bitIndicator"></div>
    </div>

    <script>
        // Global variables
        var socket = MycelianOverlay.connect('http://' + document.domain + ':' + location.port);
        var isEnabled = {{ Enabled| tojson}};
        var bitbarData = {
            currentBits: {{ DefaultCurrentBits| tojson }},
            goalBits: {{ DefaultGoal | tojson }},
            title: {{ DefaultTitle | tojson }},
            message: {{ DefaultMessage | tojson }}
        };

        var settings = {
            nearGoalThreshold: {{ NearGoalThreshold| tojson }},
            autoReset: {{ AutoReset | tojson }},
            resetDelay: {{ ResetDelay | tojson }},
            excludedUsers: [{{ ExcludedUsers| tojson }}],
            skipTestAlerts: {{ SkipTestAlerts | tojson }},
            processReplays: {{ ProcessReplays | tojson }},
            processTests: {{ ProcessTests | tojson }}
        };

        var animationInProgress = false;
        var bitIndicatorTimeout = null;

        // Alert queue system
        var alertQueue = [];
        var processingQueue = false;

        // Socket event listeners
        socket.on('connect', function () {
            console.log('Connected to bitbar server');
            if (!isEnabled) {
                console.log('BitBar is disabled, hiding widget');
                document.body.style.display = 'none';
                return;
            }
            updateDisplay();

            // Send refresh signal after connection (like memecalc)
            setTimeout(function () {
                socket.emit('bitbar-refresh');
            }, 500);
        });

        socket.on('template_config_updated', function (data) {
            if (data && data.template && data.template !== 'bitbar') return;
            loadTemplateConfig();
        });

        socket.on('instant_alert', function (alertData) {
            console.log('Bitbar received instant_alert:', alertData);
            if (!isEnabled) {
                console.log('BitBar is disabled, skipping alert processing');
                return;
            }
            if (alertData && shouldProcessAlert(alertData)) {
                console.log('Bitbar processing alert:', alertData.username, 'cheered', alertData.amt_cheered, 'bits');
                // Add alert to queue instead of processing immediately
                addAlertToQueue(alertData);
            } else {
                console.log('Bitbar rejected alert:', alertData ? 'Failed shouldProcessAlert check' : 'No alert data');
            }
        });

        socket.on('bitbar_update', function (data) {
            if (data) {
                updateBitbarData(data);
            }
        });

        socket.on('bitbar_reset', function () {
            resetBitbar();
        });

        socket.on('bitbar_set_goal', function (newGoal) {
            if (typeof newGoal === 'number' && newGoal > 0) {
                bitbarData.goalBits = newGoal;
                updateDisplay();
                saveBitbarState();
            }
        });

        // Connector action event listeners
        socket.on('bitbar_add_bits', function (data) {
            console.log('Connector action: add bits', data);
            var amount = (data && data.amount) ? parseInt(data.amount) : 100; // Default 100 bits
            if (amount > 0) {
                var oldBits = bitbarData.currentBits;
                bitbarData.currentBits += amount;

                // Check if goal was reached
                var goalReached = oldBits < bitbarData.goalBits && bitbarData.currentBits >= bitbarData.goalBits;

                // Animate changes
                animateBitChange(amount, goalReached);

                // Save state
                saveBitbarState();

                // Auto reset if enabled and goal reached
                if (goalReached && settings.autoReset) {
                    setTimeout(function () {
                        resetBitbar();
                    }, settings.resetDelay * 1000);
                }
            }
        });

        socket.on('bitbar_remove_bits', function (data) {
            console.log('Connector action: remove bits', data);
            var amount = (data && data.amount) ? parseInt(data.amount) : 100; // Default 100 bits
            if (amount > 0) {
                bitbarData.currentBits = Math.max(0, bitbarData.currentBits - amount);

                // Animate changes (negative amount for removal effect)
                animateBitChange(-amount, false);

                // Save state
                saveBitbarState();
            }
        });

        // Alert queue management functions
        function addAlertToQueue(alertData) {
            alertQueue.push(alertData);
            console.log('Added alert to queue. Queue length:', alertQueue.length);

            // Start processing if not already processing
            if (!processingQueue) {
                processNextAlert();
            }
        }

        function processNextAlert() {
            if (alertQueue.length === 0) {
                processingQueue = false;
                console.log('Alert queue empty, processing stopped');
                return;
            }

            if (animationInProgress) {
                console.log('Animation in progress, scheduling retry in 500ms');
                // Schedule a retry instead of just returning
                setTimeout(function () {
                    processNextAlert();
                }, 500);
                return;
            }

            processingQueue = true;
            var alertData = alertQueue.shift();
            console.log('Processing queued alert. Remaining queue length:', alertQueue.length);

            processAlert(alertData);
        }

        function onAnimationComplete() {
            console.log('Animation complete, checking for next alert in queue');
            setTimeout(function () {
                processNextAlert();
            }, 100);
        }

        // Check if alert should be processed
        function shouldProcessAlert(alert) {
            if (!alert || !alert.username) return false;

            // Check if replays should be processed
            if (!settings.processReplays && alert.is_replay) {
                console.log('Bitbar skipping replay alert');
                return false;
            }

            // Check if tests should be processed
            if (!settings.processTests && isTestAlert(alert)) {
                console.log('Bitbar skipping test alert');
                return false;
            }

            // Check if this is a test alert and we should skip it (legacy support)
            if (settings.skipTestAlerts) {
                var username = alert.username.toLowerCase();
                var testUsernames = ['testuser', 'test_user', 'test-user', 'testalert', 'test_alert', 'test-alert'];
                if (testUsernames.includes(username)) {
                    return false;
                }
            }

            // Check excluded users
            if (settings.excludedUsers.includes(alert.username.toLowerCase())) {
                return false;
            }

            // Only process bit alerts - check multiple possible property names
            var alertType = alert.alerttype || alert.alert_type || alert.type;
            if (alertType !== 'bits' && alertType !== 'bit' && alertType !== 'cheer') return false;

            // Check that we have a valid bit amount
            var bitAmount = alert.amt_cheered || 0;
            return bitAmount > 0;
        }

        // Helper function to check if an alert is a test alert
        function isTestAlert(alert) {
            if (!alert) return false;

            // Check username for test patterns
            var username = alert.username ? alert.username.toLowerCase() : '';
            var testUsernames = ['testuser', 'test_user', 'test-user', 'testalert', 'test_alert', 'test-alert'];
            if (testUsernames.includes(username)) {
                return true;
            }

            // Check if alert has test flags or properties
            if (alert.is_test || alert.test_alert || alert.isTest) {
                return true;
            }

            return false;
        }

        // Process incoming bit alert
        function processAlert(alert) {
            var bitsAmount = alert.amt_cheered || 0;
            if (bitsAmount <= 0) {
                console.log('No bits amount, skipping alert');
                onAnimationComplete(); // Continue processing queue even if no change
                return;
            }

            var oldBits = bitbarData.currentBits;
            bitbarData.currentBits += bitsAmount;

            // Check if goal was reached
            var goalReached = oldBits < bitbarData.goalBits && bitbarData.currentBits >= bitbarData.goalBits;

            // Animate changes
            animateBitChange(bitsAmount, goalReached);

            // Save state
            saveBitbarState();

            // Auto reset if enabled and goal reached
            if (goalReached && settings.autoReset) {
                setTimeout(function () {
                    resetBitbar();
                }, settings.resetDelay * 1000);
            }
        }

        // Animate bit changes
        function animateBitChange(bitsAmount, goalReached) {
            animationInProgress = true;

            // Show bit indicator
            showBitIndicator(bitsAmount);

            // Add shake effect
            var container = document.getElementById('bitbarContainer');
            container.classList.add('shake');
            setTimeout(function () {
                container.classList.remove('shake');
            }, 200);

            // Show goal overlay if goal reached
            if (goalReached) {
                showGoalOverlay();

                // Add glow effect
                var progressContainer = document.getElementById('progressContainer');
                progressContainer.classList.add('goal-reached');
                setTimeout(function () {
                    progressContainer.classList.remove('goal-reached');
                }, 1000);
            }

            // Update display after a short delay
            setTimeout(function () {
                updateDisplay();
                animationInProgress = false;
                onAnimationComplete(); // Process next alert in queue
            }, goalReached ? 1000 : 300);
        }

        // Show bit indicator
        function showBitIndicator(bitsAmount) {
            var indicator = document.getElementById('bitIndicator');

            if (bitIndicatorTimeout) {
                clearTimeout(bitIndicatorTimeout);
            }

            indicator.textContent = '+' + bitsAmount + ' bits';
            indicator.className = 'bit-indicator show';

            bitIndicatorTimeout = setTimeout(function () {
                indicator.classList.remove('show');
            }, {{ BitIndicatorDisplayDuration| tojson}} * 1000);
        }

        // Show goal overlay
        function showGoalOverlay() {
            var overlay = document.getElementById('goalOverlay');
            overlay.classList.add('show');

            setTimeout(function () {
                overlay.classList.remove('show');
            }, {{ GoalDisplayDuration| tojson}} * 1000);
        }

        // Update display
        function updateDisplay() {
            var progressBar = document.getElementById('progressBar');
            var progressText = document.getElementById('progressText');
            var bitbarTitle = document.getElementById('bitbarTitle');
            var bitbarMessage = document.getElementById('bitbarMessage');

            // Update title and message
            bitbarTitle.textContent = bitbarData.title;

            // Update message with current values
            var messageText = bitbarData.message;
            messageText = messageText.replace('{current}', bitbarData.currentBits);
            messageText = messageText.replace('{goal}', bitbarData.goalBits);
            messageText = messageText.replace('{remaining}', Math.max(0, bitbarData.goalBits - bitbarData.currentBits));
            bitbarMessage.textContent = messageText;

            // Update progress bar
            var percentage = Math.min(100, (bitbarData.currentBits / bitbarData.goalBits) * 100);
            progressBar.style.width = percentage + '%';

            // Update progress text
            progressText.textContent = bitbarData.currentBits + '/' + bitbarData.goalBits + ' bits';

            // Add near goal effect
            if (percentage >= settings.nearGoalThreshold) {
                progressBar.classList.add('near-goal');
            } else {
                progressBar.classList.remove('near-goal');
            }
        }

        // Save bitbar state to localStorage
        function saveBitbarState() {
            var state = {
                currentBits: bitbarData.currentBits,
                goalBits: bitbarData.goalBits,
                title: bitbarData.title,
                message: bitbarData.message,
                timestamp: Date.now()
            };
            localStorage.setItem('bitbar_state', JSON.stringify(state));
        }

        // Load bitbar state from localStorage
        function loadBitbarState() {
            try {
                var saved = localStorage.getItem('bitbar_state');
                if (saved) {
                    var state = JSON.parse(saved);
                    // Load saved state (no expiration check)
                    bitbarData.currentBits = state.currentBits || bitbarData.currentBits;
                    bitbarData.goalBits = state.goalBits || bitbarData.goalBits;
                    bitbarData.title = state.title || bitbarData.title;
                    bitbarData.message = state.message || bitbarData.message;
                    return true;
                }
            } catch (e) {
                console.error('Error loading bitbar state:', e);
            }
            return false;
        }

        // Reset bitbar to defaults
        function resetBitbar() {
            bitbarData = {
                currentBits: {{ DefaultCurrentBits | tojson }},
                goalBits: {{ DefaultGoal | tojson }},
                title: {{ DefaultTitle | tojson }},
                message: {{ DefaultMessage | tojson }}
            };

        updateDisplay();
        saveBitbarState();
        }

        // Update bitbar data from server
        function updateBitbarData(data) {
            if (typeof data.currentBits === 'number') bitbarData.currentBits = data.currentBits;
            if (typeof data.goalBits === 'number') bitbarData.goalBits = data.goalBits;
            if (data.title) bitbarData.title = data.title;
            if (data.message) bitbarData.message = data.message;

            updateDisplay();
            saveBitbarState();
        }

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                updateDisplay();
            }
        });

        // Load template config directly from API
        async function loadTemplateConfig() {
            try {
                const response = await fetch('/api/template-config/bitbar', { credentials: 'same-origin' });
                if (response.ok) {
                    const bitbarConfigData = await response.json();
                    if (bitbarConfigData && bitbarConfigData.elements) {
                        console.log('Found bitbar template config:', bitbarConfigData);

                        // Extract the config values from the elements array
                        const config = {};
                        bitbarConfigData.elements.forEach(element => {
                            if (element.type !== 'section') {
                                config[element.id] = element.value;
                            }
                        });

                        console.log('Parsed config values:', config);
                        applyTemplateConfig(config);
                    } else {
                        console.warn('No bitbar config found in response');
                    }
                } else {
                    console.error('Failed to load template configs:', response.status);
                }
            } catch (error) {
                console.error('Error loading template config:', error);
            }
        }

        function applyTemplateConfig(config) {
            console.log('Applying template config:', config);

            const bitbarContainer = document.getElementById('bitbarContainer');

            // Apply container position and size
            if (config.ContainerLeft !== undefined) {
                bitbarContainer.style.left = config.ContainerLeft + 'px';
            }
            if (config.ContainerTop !== undefined) {
                bitbarContainer.style.top = config.ContainerTop + 'px';
            }
            if (config.ContainerWidth !== undefined) {
                bitbarContainer.style.width = config.ContainerWidth + 'px';
            }
            if (config.ContainerHeight !== undefined) {
                bitbarContainer.style.height = config.ContainerHeight + 'px';
            }

            // Apply text styling
            const titleElement = document.getElementById('bitbarTitle');
            if (titleElement) {
                if (config.TitleFontFamily) {
                    titleElement.style.fontFamily = config.TitleFontFamily;
                }
                if (config.TitleFontSize !== undefined) {
                    titleElement.style.fontSize = config.TitleFontSize + 'px';
                }
                if (config.TitleColor) {
                    titleElement.style.color = config.TitleColor;
                }
                if (config.DefaultTitle !== undefined) {
                    bitbarData.title = config.DefaultTitle;
                }
            }

            const messageElement = document.getElementById('bitbarMessage');
            if (messageElement) {
                if (config.MessageFontFamily) {
                    messageElement.style.fontFamily = config.MessageFontFamily;
                }
                if (config.MessageFontSize !== undefined) {
                    messageElement.style.fontSize = config.MessageFontSize + 'px';
                }
                if (config.MessageColor) {
                    messageElement.style.color = config.MessageColor;
                }
                if (config.DefaultMessage !== undefined) {
                    bitbarData.message = config.DefaultMessage;
                }
            }

            const progressText = document.getElementById('progressText');
            if (progressText) {
                if (config.ProgressFontFamily) {
                    progressText.style.fontFamily = config.ProgressFontFamily;
                }
                if (config.ProgressFontSize !== undefined) {
                    progressText.style.fontSize = config.ProgressFontSize + 'px';
                }
                if (config.ProgressColor) {
                    progressText.style.color = config.ProgressColor;
                }
            }

            // Apply progress bar styling
            const progressBar = document.getElementById('progressBar');
            if (progressBar) {
                if (config.ProgressBarColor) {
                    progressBar.style.backgroundColor = config.ProgressBarColor;
                }
                if (config.ProgressBarHeight !== undefined) {
                    progressBar.style.height = config.ProgressBarHeight + 'px';
                }
                if (config.ProgressBarBorderRadius !== undefined) {
                    progressBar.style.borderRadius = config.ProgressBarBorderRadius + 'px';
                }
            }

            // Apply background settings
            if (config.EnableBackground) {
                bitbarContainer.style.backgroundColor = config.BackgroundColor || 'rgba(0,0,0,0.5)';
                bitbarContainer.style.padding = (config.BackgroundPadding || 10) + 'px';
                bitbarContainer.style.borderRadius = (config.BackgroundBorderRadius || 5) + 'px';
                if (config.BackgroundOpacity !== undefined) {
                    bitbarContainer.style.opacity = config.BackgroundOpacity;
                }
            } else {
                bitbarContainer.style.backgroundColor = 'transparent';
                bitbarContainer.style.padding = '0';
                bitbarContainer.style.borderRadius = '0';
            }

            // Apply bit bar settings
            if (config.DefaultCurrentBits !== undefined) {
                bitbarData.currentBits = config.DefaultCurrentBits;
            }
            if (config.DefaultGoal !== undefined) {
                bitbarData.goalBits = config.DefaultGoal;
            }

            // Apply animation settings
            if (config.EnableAnimations !== undefined) {
                settings.enableAnimations = config.EnableAnimations;
            }
            if (config.BitIndicatorDisplayDuration !== undefined) {
                settings.bitIndicatorDisplayDuration = config.BitIndicatorDisplayDuration;
            }
            if (config.GoalDisplayDuration !== undefined) {
                settings.goalDisplayDuration = config.GoalDisplayDuration;
            }

            // Apply auto-reset settings
            if (config.AutoReset !== undefined) {
                settings.autoReset = config.AutoReset;
            }
            if (config.ResetDelay !== undefined) {
                settings.resetDelay = config.ResetDelay;
            }
            if (config.NearGoalThreshold !== undefined) {
                settings.nearGoalThreshold = config.NearGoalThreshold;
            }

            // Apply exclusion settings
            if (config.SkipTestAlerts !== undefined) {
                settings.skipTestAlerts = config.SkipTestAlerts;
            }
            if (config.ExcludedUsers !== undefined) {
                settings.excludedUsers = config.ExcludedUsers;
            }

            // Update display with new settings
            updateDisplay();
        }

        // Initialize
        if (!loadBitbarState()) {
            updateDisplay();
        }

        // Load config on startup
        loadTemplateConfig();

        // Start processing any alerts that might have been queued during initialization
        setTimeout(function () {
            if (alertQueue.length > 0 && !processingQueue) {
                console.log('Processing alerts queued during initialization');
                processNextAlert();
            }
        }, 1000);

        // Periodically reload config to pick up changes (every 5 seconds)
        // setInterval(loadTemplateConfig, 5000);

        console.log('Mycelian Bit Bar initialized with instant_alert queue system');
        console.log('Initial bitbar state - currentBits:', bitbarData.currentBits, 'goalBits:', bitbarData.goalBits);
        console.log('Settings - skipTestAlerts:', settings.skipTestAlerts, 'excludedUsers:', settings.excludedUsers);
        console.log('Socket connection status:', socket.connected);
        console.log('Queue system functions: clearBitBarQueue(), getBitBarQueueStatus()');

        // Manual queue management functions that can be called from console
        window.clearBitBarQueue = function () {
            console.log('Manually clearing BitBar alert queue...');
            alertQueue = [];
            processingQueue = false;
            animationInProgress = false;
            console.log('Alert queue cleared');
        };

        window.getBitBarQueueStatus = function () {
            console.log('BitBar Queue Status:');
            console.log('- Queue length:', alertQueue.length);
            console.log('- Processing queue:', processingQueue);
            console.log('- Animation in progress:', animationInProgress);
            console.log('- Queue contents:', alertQueue);
            return {
                queueLength: alertQueue.length,
                processingQueue: processingQueue,
                animationInProgress: animationInProgress,
                queue: alertQueue
            };
        };

        // Debug function to check connection
        window.debugBitbar = function () {
            console.log('Socket connected:', socket.connected);
            console.log('Current bitbar data:', bitbarData);
            console.log('Current settings:', settings);
            return {
                connected: socket.connected,
                data: bitbarData,
                settings: settings
            };
        };
    </script>
</body>

</html>
