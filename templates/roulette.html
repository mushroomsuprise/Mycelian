        crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        @font-face {
            font-family: roulette-font;
            src: url("/assets/default_assets/fonts/{{FontName}}");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;

            background: {{BackgroundColor}};

            ;
            font-family: roulette-font,
            'Inter',
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        #main {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: {{ResultSpacing}}px;

            padding: {{ContainerPadding}}px;

            border-radius: {{ContainerBorderRadius}}px;

            background: {{ContainerBackground}};

            backdrop-filter: {{ContainerBackdropFilter}};

            border: {{ContainerBorderWidth}}px solid {{ContainerBorderColor}};

            box-shadow: {{ContainerShadow}};
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            max-width: calc({{CanvasSize}}px + {{ContainerPadding}}px * 2);
        }

        #main:hover {
            transform: {{ContainerHoverTransform}};

            box-shadow: {{ContainerHoverShadow}};
        }

        .wheel-container {
            position: relative;

            width: {{CanvasSize}}px;

            height: {{CanvasSize}}px;
        }

        #canvas {
            width: {{CanvasSize}}px;

            height: {{CanvasSize}}px;
            border-radius: 50%;

            box-shadow: {{WheelShadow}};

            transition: all {{SpinTransitionDuration}}s {{SpinEasing}};

            background: {{WheelBackground}};
            position: relative;
            overflow: hidden;
        }

        #canvas::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: {{WheelOverlayGradient}};
            border-radius: 50%;

            opacity: {{WheelOverlayOpacity}};
            pointer-events: none;
            z-index: 1;
        }

        .result-display {
            min-height: {{ResultMinHeight}}px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

            background: {{ResultBackground}};

            backdrop-filter: {{ResultBackdropFilter}};

            color: {{ResultTextColor}};

            padding: {{ResultPadding}}px;

            border-radius: {{ResultBorderRadius}}px;

            border: {{ResultBorder}}px solid {{ResultBorderColor}};

            box-shadow: {{ResultShadow}};

            font-size: {{ResultFontSize}}px;

            font-weight: {{ResultFontWeight}};

            text-shadow: {{ResultTextShadow}};

            letter-spacing: {{ResultLetterSpacing}}px;
            opacity: 0;
            transform: translateY(20px) scale(0.9);

            transition: all {{ResultAnimationDuration}}s {{ResultAnimationEasing}};
            text-align: center;
            word-wrap: break-word;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
        }

        .result-display.show {
            opacity: {{ResultOpacity}};
            transform: translateY(0) scale(1);
            animation: resultReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-display.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
        }

        /* Special result animations */
        @keyframes resultReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8) rotateX(90deg);
                filter: blur(10px);
            }

            50% {
                transform: translateY(-5px) scale(1.05) rotateX(0deg);
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
                filter: blur(0px);
            }
        }

        /* Result text shimmer effect */
        .result-display.show::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s ease-in-out;
            z-index: 1;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        /* Winning segment highlight */
        .winning-segment {
            animation: segmentWin 1.5s ease-in-out;
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(147, 51, 234, 0.8));
        }

        @keyframes segmentWin {
            0% {
                filter: brightness(1) drop-shadow(0 0 0px transparent);
                transform: scale(1);
            }

            25% {
                filter: brightness(1.4) drop-shadow(0 0 20px rgba(147, 51, 234, 0.9));
                transform: scale(1.02);
            }

            50% {
                filter: brightness(1.5) drop-shadow(0 0 25px rgba(147, 51, 234, 1));
                transform: scale(1.03);
            }

            75% {
                filter: brightness(1.4) drop-shadow(0 0 20px rgba(147, 51, 234, 0.9));
                transform: scale(1.02);
            }

            100% {
                filter: brightness(1.3) drop-shadow(0 0 15px rgba(147, 51, 234, 0.8));
                transform: scale(1);
            }
        }

        /* Modern glow effect */
        .wheel-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: calc({{CanvasSize}}px + {{GlowSize}}px);

        height: calc({{CanvasSize}}px + {{GlowSize}}px);
        border-radius: 50%;

        background: {{GlowColor}};
        opacity: 0;

        filter: blur({{GlowBlur}}px);

        transition: opacity {{GlowAnimationDuration}}s {{GlowAnimationEasing}};
        z-index: -1;

        animation: {{GlowPulse}};
        }

        .wheel-glow.active {
            opacity: {{GlowOpacity}};

            animation: pulseGlow {{GlowPulseDuration}}s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);

                opacity: {{GlowOpacity}};
            }

            50% {
                transform: translate(-50%, -50%) scale(1.02);

                opacity: calc({{GlowOpacity}} * 0.7);
        }
        }

        /* Spinning animation enhancement */
        .wheel-spinning {
            animation: spinEnhancement 0.3s ease-out, longSpinGlow 15s ease-in-out;
        }

        @keyframes spinEnhancement {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.01);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes longSpinGlow {
            0% {
                filter: brightness(1);
            }

            20% {
                filter: brightness(1.1) drop-shadow(0 0 10px rgba(147, 51, 234, 0.3));
            }

            50% {
                filter: brightness(1.15) drop-shadow(0 0 15px rgba(147, 51, 234, 0.5));
            }

            80% {
                filter: brightness(1.1) drop-shadow(0 0 10px rgba(147, 51, 234, 0.3));
            }

            100% {
                filter: brightness(1);
            }
        }

        /* Modern particle effects */
        .particle {
            position: absolute;
            border-radius: 50%;

            background: {{ParticleColor}};
            pointer-events: none;
            animation: particleFloat 2.5s linear infinite;
            opacity: 0;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(0px) scale(0);
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1);
            }
        }

        /* Spectacular particle animation for results */
        @keyframes spectacularFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            50% {
                opacity: 1;
                transform: translate(calc(var(--end-x) * 0.7), calc(var(--end-y) * 0.7)) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(var(--end-x), var(--end-y)) scale(0.3);
            }
        }

        /* Arrow pulsing border */
        .arrow-pulse {
            animation: arrowPulse 1.5s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0% {
                filter: drop-shadow(0 0 1px #9333ea);
            }

            50% {
                filter: drop-shadow(0 0 4px #9333ea) drop-shadow(0 0 6px #7c3aed);
            }

            100% {
                filter: drop-shadow(0 0 1px #9333ea);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            #main {
                max-width: calc({{CanvasSize}}px * 0.85 + {{ContainerPadding}}px * 2);

            padding: calc({{ContainerPadding}}px * 0.8);

        gap: calc({{ResultSpacing}}px * 0.8);
        }

        .wheel-container {
            width: calc({{CanvasSize}}px * 0.85);

        height: calc({{CanvasSize}}px * 0.85);
        }

        #canvas {
            width: calc({{CanvasSize}}px * 0.85);

        height: calc({{CanvasSize}}px * 0.85);
        }

        .result-display {
            font-size: calc({{ResultFontSize}}px * 0.9);

        padding: calc({{ResultPadding}}px * 0.8);

        min-height: calc({{ResultMinHeight}}px * 0.8);
        }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            #main {
                max-width: calc({{CanvasSize}}px * 0.75 + {{ContainerPadding}}px * 2);

            padding: calc({{ContainerPadding}}px * 0.7);
        }

        .wheel-container {
            width: calc({{CanvasSize}}px * 0.75);

        height: calc({{CanvasSize}}px * 0.75);
        }

        #canvas {
            width: calc({{CanvasSize}}px * 0.75);

        height: calc({{CanvasSize}}px * 0.75);
        }
        }

        /* Loading animation */
        .loading {
            opacity: 0.7;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* Sharp, modern styling */
        .sharp-edges {
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
        }
    </style>
</head>

        // Function to filter enabled options
        function getEnabledOptions() {
            var enabledOptions = [];
            var enabledColors = [];
            var enabledTextColors = [];
            var enabledTextFontSizes = [];
            var enabledTextFontWeights = [];
            var enabledTextRotations = [];

            for (var i = 0; i < optionNames.length; i++) {
                if (optionEnabled[i]) {
                    enabledOptions.push(optionNames[i]);
                    enabledColors.push(optionColors[i]);
                    enabledTextColors.push(optionTextColors[i]);
                    enabledTextFontSizes.push(optionTextFontSizes[i]);
                    enabledTextFontWeights.push(optionTextFontWeights[i]);
                    enabledTextRotations.push(optionTextRotations[i]);
                }
            }

            return {
                options: enabledOptions,
                colors: enabledColors,
                textColors: enabledTextColors,
                textFontSizes: enabledTextFontSizes,
                textFontWeights: enabledTextFontWeights,
                textRotations: enabledTextRotations
            };
        }

        var rouletteData = {
            isSpinning: false,
            lastResult: null,
            winningIndex: -1

        // Initialize with enabled options
        var enabledData = getEnabledOptions();
        rouletteData.options = enabledData.options;
        rouletteData.colors = enabledData.colors;
        rouletteData.textColors = enabledData.textColors;
        rouletteData.textFontSizes = enabledData.textFontSizes;

        });

            if (data && data.options) {
                updateWheel(data.options, data.colors);
            }
            spin();
        });

        socket.on('roulette_spin', function (data) {
            console.log('Dynamic control spin triggered:', data);
            spin(data);
        });

            // Reset the wheel state and redraw
            startAngle = 0;
            rouletteData.isSpinning = false;
            rouletteData.lastResult = null;
            rouletteData.winningIndex = -1;

            // Hide result display
            hideResult();

            // Remove spinning class and glow
            document.getElementById('canvas').classList.remove('wheel-spinning');
            document.getElementById('wheelGlow').classList.remove('active');

            // Redraw wheel
            drawRouletteWheel();
        });

        socket.on('roulette_update', function (data) {
            if (data) {
                // Update data if provided, otherwise rebuild from current config
                if (data.options) rouletteData.options = data.options;
                if (data.colors) rouletteData.colors = data.colors;

                // If no data provided, rebuild from individual settings (filtering enabled options)
                if (!data.options && !data.colors) {
                    var enabledData = getEnabledOptions();
                    rouletteData.options = enabledData.options;
                    rouletteData.colors = enabledData.colors;
                    rouletteData.textColors = enabledData.textColors;
                    rouletteData.textFontSizes = enabledData.textFontSizes;
                    rouletteData.textFontWeights = enabledData.textFontWeights;
                }

                updateWheel(rouletteData.options, rouletteData.colors);

                rouletteData.colors = enabledData.colors;
                rouletteData.textColors = enabledData.textColors;
                rouletteData.textFontSizes = enabledData.textFontSizes;

                drawRouletteWheel();

                '.result-display { min-height: ' + resultMinH + 'px; background: ' + resultBg + '; backdrop-filter: ' + resultBackdrop + '; ' +
                'color: ' + resultTextColor + '; padding: ' + resultPadding + 'px; border-radius: ' + resultRadius + 'px; ' +
                'border: ' + resultBorder + 'px solid ' + resultBorderColor + '; box-shadow: ' + resultShadow + '; font-size: ' + resultFontSize + 'px; ' +
                'font-weight: ' + resultFontWeight + '; text-shadow: ' + resultTextShadow + '; letter-spacing: ' + resultLetterSpacing + 'px; ' +
                'transition: all ' + resultAnimDur + 's ' + resultAnimEase + '; }' +
                '.result-display.show { opacity: ' + resultOpacity + '; }'
            );
        }

        function applyRouletteDrawParamsFromConfig(config) {
            if (config.CanvasSize !== undefined) { rouletteDrawParams.canvasSize = Number(config.CanvasSize); }
            if (config.OutsideRadius !== undefined) { rouletteDrawParams.outsideRadius = Number(config.OutsideRadius); }
            if (config.TextRadius !== undefined) { rouletteDrawParams.textRadius = Number(config.TextRadius); }
            if (config.InsideRadius !== undefined) { rouletteDrawParams.insideRadius = Number(config.InsideRadius); }
            if (config.SegmentBorderColor !== undefined) { rouletteDrawParams.segmentBorderColor = config.SegmentBorderColor; }
            if (config.SegmentBorderWidth !== undefined) { rouletteDrawParams.segmentBorderWidth = Number(config.SegmentBorderWidth); }
            if (config.ArrowSize !== undefined) { rouletteDrawParams.arrowSize = Number(config.ArrowSize); }
            if (config.ArrowColor !== undefined) { rouletteDrawParams.arrowColor = config.ArrowColor; }
            if (config.ArrowOffset !== undefined) { rouletteDrawParams.arrowOffset = Number(config.ArrowOffset); }
            if (config.ArrowBorderWidth !== undefined) { rouletteDrawParams.arrowBorderWidth = Number(config.ArrowBorderWidth); }
            if (config.ArrowBorderColor !== undefined) { rouletteDrawParams.arrowBorderColor = config.ArrowBorderColor; }
        }

        function applyTemplateConfig(config) {
            var styleEl = document.getElementById('mycelian-roulette-preview-dynamic');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'mycelian-roulette-preview-dynamic';
                document.head.appendChild(styleEl);
            }
            styleEl.textContent = buildRoulettePreviewCss(config);

            if (config.EnableSound !== undefined) { settings.enableSound = !!config.EnableSound; }
            if (config.ClickSoundVolume !== undefined) { settings.clickSoundVolume = Number(config.ClickSoundVolume); }
            if (config.ResultSoundVolume !== undefined) { settings.resultSoundVolume = Number(config.ResultSoundVolume); }
            if (config.EnableGlow !== undefined) { settings.enableGlow = !!config.EnableGlow; }
            if (config.EnableResultOverlay !== undefined) { settings.enableResultOverlay = !!config.EnableResultOverlay; }
            if (config.AutoHideResult !== undefined) { settings.autoHideResult = !!config.AutoHideResult; }
            if (config.ResultDisplayDuration !== undefined) {
                settings.resultDisplayDuration = Number(config.ResultDisplayDuration) * 1000;
            }
            if (config.EnableParticles !== undefined) { settings.enableParticles = !!config.EnableParticles; }
            if (config.ModernEffects !== undefined) { settings.modernEffects = !!config.ModernEffects; }

            applyRouletteDrawParamsFromConfig(config);
            syncRouletteOptionsFromConfig(config);

            var canvas = document.getElementById('canvas');
            var wheelContainer = document.querySelector('.wheel-container');
            var sz = rouletteDrawParams.canvasSize;
            if (canvas) {
                canvas.width = sz;
                canvas.height = sz;
                canvas.style.width = sz + 'px';
                canvas.style.height = sz + 'px';
            }
            if (wheelContainer) {
                wheelContainer.style.width = sz + 'px';
                wheelContainer.style.height = sz + 'px';
            }

            var enabledData = getEnabledOptions();
            rouletteData.options = enabledData.options;
            rouletteData.colors = enabledData.colors;
            rouletteData.textColors = enabledData.textColors;
            rouletteData.textFontSizes = enabledData.textFontSizes;
            rouletteData.textFontWeights = enabledData.textFontWeights;
            rouletteData.textRotations = enabledData.textRotations;
            updateArcSize();
            if (!rouletteData.isSpinning) {
                drawRouletteWheel();
            }
        }

        async function loadTemplateConfig() {
            try {
                var response = await fetch('/api/template-config/roulette', { credentials: 'same-origin' });
                if (!response.ok) {
                    console.error('Failed to load template configs:', response.status);
                    return;
                }
                var rlConfigData = await response.json();
                if (!rlConfigData || !rlConfigData.elements) {
                    console.warn('No roulette config found in response');
                    return;
                }
                var config = {};
                rlConfigData.elements.forEach(function (element) {
                    if (element && element.id && element.type !== 'separator') {
                        config[element.id] = element.value;
                    }
                });
                applyTemplateConfig(config);
            } catch (error) {
                console.error('Error loading template config:', error);
            }
        }

        loadTemplateConfig();

        // Initialize
        console.log('Mycelian Professional Roulette Wheel initialized');
    </script>
</body>

</html>
