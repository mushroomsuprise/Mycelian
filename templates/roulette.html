<head>
    <meta charset="utf-8">
    <title>Mycelian Roulette Wheel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script>
        (function () {
            var path = (location.pathname || '').replace(/^\/+|\/+$/g, '');
            var name = path.split('/')[0] || 'roulette';
            try { name = decodeURIComponent(name); } catch (e) {}
            window.__rouletteTemplateName = name;
            MycelianLog.init({ templateName: name });
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        @font-face {
            font-family: roulette-font;
            src: url("/assets/default_assets/fonts/{{FontName}}");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;

            background: {{BackgroundColor}};

            ;
            font-family: roulette-font,
            'Inter',
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        #main {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: {{ResultSpacing}}px;

            padding: {{ContainerPadding}}px;

            border-radius: {{ContainerBorderRadius}}px;

            background: {{ContainerBackground}};

            backdrop-filter: {{ContainerBackdropFilter}};

            border: {{ContainerBorderWidth}}px solid {{ContainerBorderColor}};

            box-shadow: {{ContainerShadow}};
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            max-width: calc({{CanvasSize}}px + {{ContainerPadding}}px * 2);
        }

        #main:hover {
            transform: {{ContainerHoverTransform}};

            box-shadow: {{ContainerHoverShadow}};
        }

        #main.autohide-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: none !important;
        }

        #main.autohide-animating {
            transition: none !important;
            pointer-events: none;
        }

        .wheel-container {
            position: relative;

            width: {{CanvasSize}}px;

            height: {{CanvasSize}}px;
        }

        #wheelFace {
            position: relative;
            z-index: 1;
            width: {{CanvasSize}}px;
            height: {{CanvasSize}}px;
            border-radius: 50%;
            box-shadow: {{WheelShadow}};
            transition: all {{SpinTransitionDuration}}s {{SpinEasing}};
            background: {{WheelBackground}};
            overflow: hidden;
        }

        #canvas,
        #arrowCanvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            transition: none;
            display: block;
        }

        #canvas {
            transform-origin: center center;
            will-change: transform;
        }

        #arrowCanvas {
            pointer-events: none;
        }

        .spin-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: {{CanvasSize}}px;
            height: {{CanvasSize}}px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            box-shadow: 0 0 15px rgba(147, 51, 234, 1);
            will-change: opacity;
        }

        .spin-ring.active {
            animation: spinRingGlow 15s ease-in-out;
        }

        #canvas::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: {{WheelOverlayGradient}};
            border-radius: 50%;

            opacity: {{WheelOverlayOpacity}};
            pointer-events: none;
            z-index: 1;
        }

        .result-display {
            min-height: {{ResultMinHeight}}px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

            background: {{ResultBackground}};

            backdrop-filter: {{ResultBackdropFilter}};

            color: {{ResultTextColor}};

            padding: {{ResultPadding}}px;

            border-radius: {{ResultBorderRadius}}px;

            border: {{ResultBorder}}px solid {{ResultBorderColor}};

            box-shadow: {{ResultShadow}};

            font-size: {{ResultFontSize}}px;

            font-weight: {{ResultFontWeight}};

            text-shadow: {{ResultTextShadow}};

            letter-spacing: {{ResultLetterSpacing}}px;
            opacity: 0;
            transform: translateY(20px) scale(0.9);

            transition: all {{ResultAnimationDuration}}s {{ResultAnimationEasing}};
            text-align: center;
            word-wrap: break-word;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
        }

        .result-display.show {
            opacity: {{ResultOpacity}};
            transform: translateY(0) scale(1);
            animation: resultReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-display.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
        }

        /* Special result animations */
        @keyframes resultReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8) rotateX(90deg);
                filter: blur(10px);
            }

            50% {
                transform: translateY(-5px) scale(1.05) rotateX(0deg);
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
                filter: blur(0px);
            }
        }

        /* Result text shimmer effect */
        .result-display.show::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s ease-in-out;
            z-index: 1;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        /* Winning segment highlight */
        .winning-segment {
            animation: segmentWin 1.5s ease-in-out;
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(147, 51, 234, 0.8));
        }

        @keyframes segmentWin {
            0% {
                filter: brightness(1) drop-shadow(0 0 0px transparent);
                transform: scale(1);
            }

            25% {
                filter: brightness(1.4) drop-shadow(0 0 20px rgba(147, 51, 234, 0.9));
                transform: scale(1.02);
            }

            50% {
                filter: brightness(1.5) drop-shadow(0 0 25px rgba(147, 51, 234, 1));
                transform: scale(1.03);
            }

            75% {
                filter: brightness(1.4) drop-shadow(0 0 20px rgba(147, 51, 234, 0.9));
                transform: scale(1.02);
            }

            100% {
                filter: brightness(1.3) drop-shadow(0 0 15px rgba(147, 51, 234, 0.8));
                transform: scale(1);
            }
        }

        /* Modern glow effect */
        .wheel-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: calc({{CanvasSize}}px + {{GlowSize}}px);

        height: calc({{CanvasSize}}px + {{GlowSize}}px);
        border-radius: 50%;

        background: {{GlowColor}};
        opacity: 0;

        filter: blur({{GlowBlur}}px);

        transition: opacity {{GlowAnimationDuration}}s {{GlowAnimationEasing}};
        z-index: -1;

        animation: {{GlowPulse}};
        }

        .wheel-glow.active {
            opacity: {{GlowOpacity}};

            animation: pulseGlow {{GlowPulseDuration}}s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);

                opacity: {{GlowOpacity}};
            }

            50% {
                transform: translate(-50%, -50%) scale(1.02);

                opacity: calc({{GlowOpacity}} * 0.7);
        }
        }

        /* Scale stays on the face. Brightness stays on the cached disc.
           The purple halo is a static blur with an opacity pulse, not a drop-shadow filter. */
        .wheel-spinning {
            animation: spinEnhancement 0.3s ease-out;
        }

        #canvas.wheel-brightening,
        #arrowCanvas.wheel-brightening {
            animation: wheelBrightness 15s ease-in-out;
        }

        @keyframes spinEnhancement {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.01);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes wheelBrightness {
            0% {
                filter: brightness(1);
            }

            20% {
                filter: brightness(1.1);
            }

            50% {
                filter: brightness(1.15);
            }

            80% {
                filter: brightness(1.1);
            }

            100% {
                filter: brightness(1);
            }
        }

        @keyframes spinRingGlow {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.5;
            }

            80% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
            }
        }

        /* Modern particle effects */
        .particle {
            position: absolute;
            border-radius: 50%;

            background: {{ParticleColor}};
            pointer-events: none;
            animation: particleFloat 2.5s linear infinite;
            opacity: 0;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(0px) scale(0);
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1);
            }
        }

        /* Spectacular particle animation for results */
        @keyframes spectacularFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            50% {
                opacity: 1;
                transform: translate(calc(var(--end-x) * 0.7), calc(var(--end-y) * 0.7)) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(var(--end-x), var(--end-y)) scale(0.3);
            }
        }

        /* Arrow pulsing border */
        .arrow-pulse {
            animation: arrowPulse 1.5s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0% {
                filter: drop-shadow(0 0 1px #9333ea);
            }

            50% {
                filter: drop-shadow(0 0 4px #9333ea) drop-shadow(0 0 6px #7c3aed);
            }

            100% {
                filter: drop-shadow(0 0 1px #9333ea);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            #main {
                max-width: calc({{CanvasSize}}px * 0.85 + {{ContainerPadding}}px * 2);

            padding: calc({{ContainerPadding}}px * 0.8);

        gap: calc({{ResultSpacing}}px * 0.8);
        }

        .wheel-container {
            width: calc({{CanvasSize}}px * 0.85);

        height: calc({{CanvasSize}}px * 0.85);
        }

        #wheelFace,
        .spin-ring {
            width: calc({{CanvasSize}}px * 0.85);
            height: calc({{CanvasSize}}px * 0.85);
        }

        .result-display {
            font-size: calc({{ResultFontSize}}px * 0.9);

        padding: calc({{ResultPadding}}px * 0.8);

        min-height: calc({{ResultMinHeight}}px * 0.8);
        }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            #main {
                max-width: calc({{CanvasSize}}px * 0.75 + {{ContainerPadding}}px * 2);

            padding: calc({{ContainerPadding}}px * 0.7);
        }

        .wheel-container {
            width: calc({{CanvasSize}}px * 0.75);

        height: calc({{CanvasSize}}px * 0.75);
        }

        #wheelFace,
        .spin-ring {
            width: calc({{CanvasSize}}px * 0.75);
            height: calc({{CanvasSize}}px * 0.75);
        }
        }

        /* Loading animation */
        .loading {
            opacity: 0.7;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* Sharp, modern styling */
        .sharp-edges {
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
        }

        /* Wheel auto-hide show/hide animations */
        @keyframes slideInLeft {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInTop {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideInBottom {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideOutLeft {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }
        }

        @keyframes slideOutRight {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        @keyframes slideOutTop {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }

        @keyframes slideOutBottom {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounceOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.3); opacity: 0; }
        }

        @keyframes zoomIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes zoomOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
