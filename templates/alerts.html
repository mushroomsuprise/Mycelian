            return String(template)
                .replace(/\{tier\}/g, String(alertData.tier != null ? alertData.tier : ''))
                .replace(/\{resub_month\}/g, String(alertData.resub_month != null ? alertData.resub_month : ''))
                .replace(/\{streak_count\}/g, String(alertData.streak_count != null ? alertData.streak_count : ''))
                .replace(/\{gift_qty\}/g, String(giftQty))
                .replace(/\{subs\}/g, subsLabel)
                .replace(/\{amt_cheered\}/g, String(alertData.amt_cheered != null ? alertData.amt_cheered : ''))
                .replace(/\{bits\}/g, bitsLabel)
                .replace(/\{raider_count\}/g, String(alertData.raider_count != null ? alertData.raider_count : ''))
                .replace(/\{title\}/g, String(title))
                .replace(/\{point_cost\}/g, String(alertData.point_cost != null ? alertData.point_cost : ''))
                .replace(/\{amount\}/g, Number(amount).toFixed(2))
                .replace(/\{hype_train_level\}/g, String(alertData.hype_train_level != null ? alertData.hype_train_level : ''));
        }

        function formatUsername(alertData) {
            if (alertData.anonymous) {
                return alertTextTemplates.anonymous;
            }
            return alertData.username || alertTextTemplates.unknownUser;
        }

        function formatAlertText(alertData) {
            var template = alertTextTemplates.default;
            switch (alertData.alert_type) {
                case 'follow':
                    template = alertTextTemplates.follow;
                    break;
                case 'sub':
                    template = (alertData.tier && alertData.tier > 1)
                        ? alertTextTemplates.subTier
                        : alertTextTemplates.sub;
                    break;
                case 'resub':
                    template = alertTextTemplates.resub;
                    break;
                case 'streak':
                    {
                        var sc = alertData.streak_count != null ? alertData.streak_count : 0;
                        template = sc === 1 ? alertTextTemplates.streakSingular : alertTextTemplates.streakPlural;
                    }
                    break;
                case 'giftsub':
                    template = (alertData.tier && alertData.tier > 1)
                        ? alertTextTemplates.giftsubTier
                        : alertTextTemplates.giftsub;
                    break;
                case 'bit':
                    template = alertTextTemplates.bit;
                    break;
                case 'raid':
                    template = alertTextTemplates.raid;
                    break;
                case 'point':
                    template = (alertData.point_cost > 0)
                        ? alertTextTemplates.pointWithCost
                        : alertTextTemplates.point;
                    break;
                case 'donation':
                    template = alertTextTemplates.donation;
                    break;
                case 'hype_train_start':
                    template = alertTextTemplates.hypeTrainStart;
                    break;
                case 'hype_train_progress':
                    template = alertTextTemplates.hypeTrainProgress;
                    break;
                case 'hype_train_end':
                    template = alertTextTemplates.hypeTrainEnd;
                    break;
                default:
                    template = alertTextTemplates.default;
            }
            return applyAlertTextTemplate(template, alertData);
        }

        function formatAlertMessage(alertData) {
            return parseAlertMessage(alertData);
        }

        // Load template config directly from API
        async function loadTemplateConfig() {
            try {
                const response = await fetch('/api/all-template-configs');
                if (response.ok) {
                    const allConfigs = await response.json();
                    window.allTemplateConfigs = allConfigs;
                    console.log('Loaded all template configs:', Object.keys(allConfigs));

                    // Get the alerts config specifically
                    const alertsConfigData = allConfigs.alerts;
                    if (alertsConfigData && alertsConfigData.elements) {
                        console.log('Found alerts template config:', alertsConfigData);

                        // Extract the config values from the elements array
                        const config = {};
                        alertsConfigData.elements.forEach(element => {
                            if (element.type !== 'section') {
                                config[element.id] = element.value;
                            }
                        });

                        console.log('Parsed config values:', config);
                        applyTemplateConfig(config);
                    } else {
                        console.warn('No alerts config found in response');
                    }
                } else {
                    console.error('Failed to load template configs:', response.status);
                    if (window.allTemplateConfigs === undefined) {
                        window.allTemplateConfigs = {};
                    }
                }
            } catch (error) {
                console.error('Error loading template config:', error);
                if (window.allTemplateConfigs === undefined) {
                    window.allTemplateConfigs = {};
                }
            }
        }

        function applyTemplateConfig(config) {
            console.log('Applying template config:', config);

            // Use the correct selector - the alert display container
            const alertDisplay = document.getElementById('alertDisplay');

            if (!alertDisplay) {
                console.warn('Alert display element not found, skipping template config application');
                return;
            }

            // Apply position and size settings to the alert display
            if (config.AlertWidth !== undefined) {
                alertDisplay.style.width = config.AlertWidth + 'px';
            }
            if (config.AlertHeight !== undefined) {
                alertDisplay.style.height = config.AlertHeight + 'px';
            }

            // Apply global duration settings if available (these are used by the showAlert function)
            if (config.AlertDuration !== undefined) {
                window.alertDuration = config.AlertDuration * 1000; // Convert to milliseconds
            }

            // Apply background settings to the alert background element
            const alertBackground = document.getElementById('alertBackground');
            if (alertBackground) {
                if (config.BackgroundColor) {
                    alertBackground.style.backgroundColor = config.BackgroundColor;
                }
                if (config.BorderRadius !== undefined) {
                    alertBackground.style.borderRadius = config.BorderRadius + 'px';
                }
            }

            // Apply text styling to username and message elements
            const usernameElements = document.querySelectorAll('.alert-username');
            const messageElements = document.querySelectorAll('.alert-message');

            if (config.UsernameFontFamily) {
                usernameElements.forEach(el => el.style.fontFamily = config.UsernameFontFamily);
            }
            if (config.UsernameFontSize !== undefined) {
                usernameElements.forEach(el => el.style.fontSize = config.UsernameFontSize + 'px');
            }
            if (config.UsernameColor) {
                usernameElements.forEach(el => el.style.color = config.UsernameColor);
            }

            if (config.MessageFontFamily) {
                messageElements.forEach(el => el.style.fontFamily = config.MessageFontFamily);
            }
            if (config.MessageFontSize !== undefined) {
                messageElements.forEach(el => el.style.fontSize = config.MessageFontSize + 'px');
            }
            if (config.MessageColor) {
                messageElements.forEach(el => el.style.color = config.MessageColor);
            }

            // Apply shadow effects
            if (config.EnableTextShadow && config.ShadowColor) {
                const offsetX = config.ShadowOffsetX || 2;
                const offsetY = config.ShadowOffsetY || 2;
                const blur = config.ShadowBlur || 4;
                const shadow = `${offsetX}px ${offsetY}px ${blur}px ${config.ShadowColor}`;

                usernameElements.forEach(el => el.style.textShadow = shadow);
                messageElements.forEach(el => el.style.textShadow = shadow);
            }

            // Apply animation settings
            if (config.AnimationType) {
                // Store animation type for use during alert display
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.animationType = config.AnimationType;
            }
            if (config.EnableSounds !== undefined) {
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.enableSounds = config.EnableSounds;
            }
            if (config.GlobalVolume !== undefined) {
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.globalVolume = config.GlobalVolume / 100;
            }
            if (config.TtsRate !== undefined) {
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.ttsRate = Number(config.TtsRate);
            }
            if (config.TtsPitch !== undefined) {
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.ttsPitch = Number(config.TtsPitch);
            }
            if (config.TtsVolume !== undefined) {
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.ttsVolume = Number(config.TtsVolume);
            }

            // Apply queue settings
            if (config.QueueAlerts !== undefined) {
                window.alertConfig = window.alertConfig || {};
                window.alertConfig.queueAlerts = config.QueueAlerts;
            }

            if (config.PointAlertSilentNoMedia !== undefined) {
                pointAlertSilentNoMedia = config.PointAlertSilentNoMedia;
            }

            if (config.EnableUsernameText !== undefined) {
                showUsernameText = Boolean(config.EnableUsernameText);
            }
            if (config.EnableHeaderText !== undefined) {
                showHeaderLineText = Boolean(config.EnableHeaderText);
            }
            if (config.EnableMessageText !== undefined) {
                showMessageText = Boolean(config.EnableMessageText);
            }
            if (config.EnableEmotes !== undefined) {
                enableEmotes = Boolean(config.EnableEmotes);
            }
            var textTemplateKeys = [
                'TextFollow', 'TextSub', 'TextSubTier', 'TextResub', 'TextStreakSingular',
                'TextStreakPlural', 'TextGiftsub', 'TextGiftsubTier', 'TextBit', 'TextRaid',
                'TextPoint', 'TextPointWithCost', 'TextDonation', 'TextHypeTrainStart',
                'TextHypeTrainProgress', 'TextHypeTrainEnd', 'TextDefault', 'TextAnonymous',
                'TextUnknownUser'
            ];
            var templateMap = {
                TextFollow: 'follow',
                TextSub: 'sub',
                TextSubTier: 'subTier',
                TextResub: 'resub',
                TextStreakSingular: 'streakSingular',
                TextStreakPlural: 'streakPlural',
                TextGiftsub: 'giftsub',
                TextGiftsubTier: 'giftsubTier',
                TextBit: 'bit',
                TextRaid: 'raid',
                TextPoint: 'point',
                TextPointWithCost: 'pointWithCost',
                TextDonation: 'donation',
                TextHypeTrainStart: 'hypeTrainStart',
                TextHypeTrainProgress: 'hypeTrainProgress',
                TextHypeTrainEnd: 'hypeTrainEnd',
                TextDefault: 'default',
                TextAnonymous: 'anonymous',
                TextUnknownUser: 'unknownUser'
            };
            textTemplateKeys.forEach(function (key) {
                if (config[key] !== undefined) {
                    alertTextTemplates[templateMap[key]] = config[key];
                }
            });
            applyTextVisibilityStyles();
        }

        // Load config on startup
        loadTemplateConfig();

        // Periodically reload config to pick up changes (every 5 seconds)
        // setInterval(loadTemplateConfig, 5000);

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function () {
            if (document.hidden && currentAlert) {
                console.log('Page hidden, alert paused');
            } else if (!document.hidden && currentAlert) {
                console.log('Page visible, alert resumed');
            }
        });
    </script>
</body>
