<!DOCTYPE html>
<!--
    Mycelian Spore Studio - queue_alert boilerplate
    Generated for: __TEMPLATE_NAME__
    Alert system: queue (next_alert + local timing; emit alert_complete in user JS if you use the server alert queue)
-->
<html>
<head>
    <meta charset="utf-8">
    <title>Mycelian {{ TemplateTitle }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script>MycelianLog.init({ templateName: 'queue_alert' });</script>
    <style id="spore-studio-styles">
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        #sporeRoot {
            position: relative;
            width: {{ DesignWidth }}px;
            height: {{ DesignHeight }}px;
        }

        .spore-element {
            position: absolute;
        }

        .spore-element > .spore-video-visual {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spore-element[data-spore-hidden="true"] {
            display: none;
        }
    </style>
    <!-- SPORE_STUDIO:styles-begin -->
    <!-- SPORE_STUDIO:styles-end -->
</head>
<body>
    <div id="sporeRoot" data-mycelian-template="__TEMPLATE_NAME__">
        <!-- SPORE_STUDIO:dom-begin -->
        <!-- SPORE_STUDIO:dom-end -->
    </div>

    <script>
        var socket = MycelianOverlay.connect('http://' + document.domain + ':' + location.port);
        var alertActive = false;
        var alertQueue = [];

        var SPORE_ANIM_CLASS_MAP = {
            fade: { in: 'spore-anim-fade-in', out: 'spore-anim-fade-out' },
            slideIn: { in: 'spore-anim-slidein', out: 'spore-anim-slideout' },
            slideOut: { in: 'spore-anim-slidein', out: 'spore-anim-slideout' },
            scaleIn: { in: 'spore-anim-scalein', out: 'spore-anim-scaleout' },
            scaleOut: { in: 'spore-anim-scalein', out: 'spore-anim-scaleout' },
            none: { in: '', out: '' }
        };
        function sporeAnimClassFor(type, dir) {
            var m = SPORE_ANIM_CLASS_MAP[type] || SPORE_ANIM_CLASS_MAP.none;
            return dir === 'in' ? (m.in || '') : (m.out || '');
        }
        function sporeReadAnimConfig(el, override) {
            override = override || {};
            var g = function (key, attr, def) {
                if (override[key] !== undefined && override[key] !== null && override[key] !== '') {
                    return String(override[key]);
                }
                var v = el.getAttribute(attr);
                return v != null && v !== '' ? v : def;
            };
            var gi = function (key, attr, def) {
                if (override[key] !== undefined && override[key] !== null && override[key] !== '') {
                    var o = parseInt(String(override[key]), 10);
                    return isNaN(o) ? def : o;
                }
                var v = el.getAttribute(attr);
                var n = v != null && v !== '' ? parseInt(v, 10) : def;
                return isNaN(n) ? def : n;
            };
            return {
                animIn: g('animIn', 'data-spore-anim-in', 'none'),
                animOut: g('animOut', 'data-spore-anim-out', 'none'),
                animInMs: gi('animInMs', 'data-spore-anim-in-ms', 300),
                animOutMs: gi('animOutMs', 'data-spore-anim-out-ms', 300),
                delayMs: gi('delayMs', 'data-spore-anim-delay-ms', 0),
                easing: g('easing', 'data-spore-anim-easing', 'ease-out')
            };
        }
        function sporeAnimateIn(el, override, done) {
            if (!el) { if (done) { done(); } return; }
            var cfg = sporeReadAnimConfig(el, override);
            var cls = sporeAnimClassFor(cfg.animIn, 'in');
            if (!cls || cfg.animIn === 'none') { if (done) { done(); } return; }
            var ms = Math.max(0, cfg.animInMs || 300);
            el.classList.remove(cls);
            void el.offsetWidth;
            el.style.animationDuration = (ms / 1000) + 's';
            el.style.animationTimingFunction = cfg.easing || 'ease-out';
            el.classList.add(cls);
            setTimeout(function () {
                try { el.classList.remove(cls); } catch (e0) {}
                el.style.animationDuration = '';
                el.style.animationTimingFunction = '';
                if (done) { done(); }
            }, ms);
        }
        function sporeAnimateOut(el, override, done) {
            if (!el) { if (done) { done(); } return; }
            var cfg = sporeReadAnimConfig(el, override);
            var cls = sporeAnimClassFor(cfg.animOut, 'out');
            if (!cls || cfg.animOut === 'none') { if (done) { done(); } return; }
            var ms = Math.max(0, cfg.animOutMs || 300);
            el.classList.remove(cls);
            void el.offsetWidth;
            el.style.animationDuration = (ms / 1000) + 's';
            el.style.animationTimingFunction = cfg.easing || 'ease-in';
            el.classList.add(cls);
            setTimeout(function () {
                try { el.classList.remove(cls); } catch (e1) {}
                el.style.animationDuration = '';
                el.style.animationTimingFunction = '';
                if (done) { done(); }
            }, ms);
        }
        function sporeShow(id, override) {
            var el = document.getElementById(id);
            if (!el) { return; }
            el.removeAttribute('data-spore-hidden');
            var cfg = sporeReadAnimConfig(el, override);
            var run = function () { sporeAnimateIn(el, override, null); };
            if (cfg.delayMs > 0) {
                setTimeout(run, cfg.delayMs);
            } else {
                run();
            }
        }
        function sporeHide(id, override) {
            var el = document.getElementById(id);
            if (!el) { return; }
            var au = null;
            if (el.tagName === 'AUDIO') {
                au = el;
            } else {
                au = el.querySelector('audio');
            }
            function applyHidden() {
                var cfg = sporeReadAnimConfig(el, override);
                var cls = sporeAnimClassFor(cfg.animOut, 'out');
                if (!cls || cfg.animOut === 'none') {
                    el.setAttribute('data-spore-hidden', 'true');
                    return;
                }
                sporeAnimateOut(el, override, function () {
                    el.setAttribute('data-spore-hidden', 'true');
                });
            }
            if (!au) {
                applyHidden();
                return;
            }
            var fadeRaw = au.getAttribute('data-spore-audio-fade-out');
            var fadeMs = fadeRaw ? parseInt(fadeRaw, 10) : 0;
            if (!fadeMs || fadeMs <= 0 || isNaN(fadeMs)) {
                try { au.pause(); } catch (e1) {}
                applyHidden();
                return;
            }
            var steps = Math.max(8, Math.floor(fadeMs / 40));
            var iv = fadeMs / steps;
            var startVol = (typeof au.volume === 'number' && !isNaN(au.volume)) ? au.volume : 1;
            var step = startVol / steps;
            var n = 0;
            var t = setInterval(function () {
                n += 1;
                try {
                    au.volume = Math.max(0, startVol - step * n);
                } catch (e2) {}
                if (n >= steps) {
                    clearInterval(t);
                    try {
                        au.volume = startVol;
                    } catch (e3) {}
                    try { au.pause(); } catch (e4) {}
                    applyHidden();
                }
            }, iv);
        }
        /**
         * @param {?Object} overrides - optional volume / fade_in_ms from binding args
         */
        function sporePlayMediaAudio(domId, overrides) {
            overrides = overrides || {};
            var el = document.getElementById(domId);
            var au = null;
            if (el && el.tagName === 'AUDIO') {
                au = el;
            } else if (el) {
                au = el.querySelector('audio');
            }
            if (!au || typeof au.play !== 'function') {
                return;
            }
            var tgtVolRaw = overrides.volume;
            if (tgtVolRaw === undefined || tgtVolRaw === '') {
                var dv = au.getAttribute('data-spore-audio-volume');
                tgtVolRaw = dv != null && dv !== '' ? parseFloat(dv) : 1;
            }
            var tgtVol = Math.max(0, Math.min(1, Number(tgtVolRaw)));
            if (!isFinite(tgtVol)) {
                tgtVol = 1;
            }
            var fadeInMs = overrides.fade_in_ms;
            if (fadeInMs === undefined || fadeInMs === '') {
                var fd = au.getAttribute('data-spore-audio-fade-in');
                fadeInMs = fd ? parseInt(fd, 10) : 0;
            }
            fadeInMs = parseInt(String(fadeInMs), 10);
            if (isNaN(fadeInMs) || fadeInMs < 0) {
                fadeInMs = 0;
            }
            try {
                au.currentTime = 0;
            } catch (e5) {}
            var doPlay = function () {
                var p = au.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            };
            if (fadeInMs > 0) {
                try {
                    au.volume = 0;
                } catch (e6) {}
                doPlay();
                var stepsPi = Math.max(8, Math.floor(fadeInMs / 40));
                var ivPi = fadeInMs / stepsPi;
                var nPi = 0;
                var tPi = setInterval(function () {
                    nPi += 1;
                    var v = tgtVol * (nPi / stepsPi);
                    if (nPi >= stepsPi) {
                        clearInterval(tPi);
                        try {
                            au.volume = tgtVol;
                        } catch (e7) {}
                    } else {
                        try {
                            au.volume = v;
                        } catch (e8) {}
                    }
                }, ivPi);
            } else {
                try {
                    au.volume = tgtVol;
                } catch (e9) {}
                doPlay();
            }
        }
        function sporeSetText(id, value) {
            var el = document.getElementById(id);
            if (el) { el.textContent = (value == null ? '' : String(value)); }
        }

        function sporeMatchesFilter(payload, filter) {
            if (!filter || typeof filter !== 'object') { return true; }
            for (var k in filter) {
                if (!Object.prototype.hasOwnProperty.call(filter, k)) { continue; }
                if (payload == null) { return false; }
                if (payload[k] !== filter[k]) { return false; }
            }
            return true;
        }

        // SPORE_STUDIO:data-runtime-begin
        // SPORE_STUDIO:data-runtime-end

        // SPORE_STUDIO:auto-begin
        // Auto-generated bindings will be inserted here by template_codegen.
        // Do not edit between the auto-begin/auto-end markers; changes are
        // overwritten on every save in Spore Studio.
        function sporeApplyBindings(eventName, payload) {
            // no bindings yet
        }
        // SPORE_STUDIO:auto-end

        (function () {
            if (typeof socket !== 'undefined' && socket && socket.on) {
                socket.on('streamdeck_template_action', function (data) {
                    try {
                        console.log('[__TEMPLATE_NAME__] streamdeck_template_action (debug)', data);
                    } catch (e) {}
                });
            }
        })();

        socket.on('connect', function () {
            var __r = document.getElementById('sporeRoot');
            var __t = __r && __r.getAttribute('data-mycelian-template');
            console.log('[__TEMPLATE_NAME__] socket connect (debug)', {
                template: __t || '__TEMPLATE_NAME__',
                sid: socket && socket.id
            });
        });

        socket.on('next_alert', function (data) {
            alertQueue.push(data || {});
            if (!alertActive) { sporeProcessNext(); }
        });

        function sporeProcessNext() {
            if (alertActive) { return; }
            if (alertQueue.length === 0) { return; }
            alertActive = true;
            var data = alertQueue.shift();
            try {
                console.log('[__TEMPLATE_NAME__] next_alert dequeue (debug)', data);
                sporeApplyBindings('next_alert', data);
            } catch (err) {
                console.error('[__TEMPLATE_NAME__] binding error', err);
            }
            var hold = (data && typeof data.duration === 'number') ? data.duration : 5;
            setTimeout(function () {
                alertActive = false;
                var seq = data && data.queue_seq != null ? parseInt(data.queue_seq, 10) : null;
                if (seq == null || Number.isNaN(seq)) {
                    console.warn('[__TEMPLATE_NAME__] queue item had no queue_seq; emit alert_complete from Advanced JS when your overlay should release the server queue.');
                }
                sporeProcessNext();
            }, hold * 1000);
        }

        // SPORE_STUDIO:user-begin
        // Place advanced custom JavaScript below. Anything between the
        // user-begin and user-end markers is preserved across Spore Studio
        // saves. Use sporeShow(id) / sporeHide(id) / sporeSetText(id,val)
        // helpers, and listen for additional socket events here if needed.
        // SPORE_STUDIO:user-end
    </script>
</body>
</html>
