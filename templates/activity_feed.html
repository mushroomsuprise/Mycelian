        // Condense view functions
        function updateCondensedView() {
            if (!activityFeedState.condenseList || activityFeedState.currentTab !== "current") {
                return;
            }

            // Get template configuration for condensed view settings
            var config = window.templateConfig || {};
            var condenseHistoricalHours = config.condense_historical_hours || 12;

            // Load ALL alerts within the time window by requesting them from Python backend
            console.log('Loading alerts for condensed view from past', condenseHistoricalHours, 'hours...');

            // Request all alerts within the time window from the backend
            socket.emit('get_condensed_view_alerts', { hours: condenseHistoricalHours });
        }

        function updateCondensedViewWithAlerts(alertsToProcess, condenseHistoricalHours) {

            // Load historical alerts for condensed view
            var currentTime = Date.now() / 1000;
            var cutoffTime = currentTime - (condenseHistoricalHours * 3600); // Convert hours to seconds

            // Add historical alerts that are within the time window
            var historicalCount = 0;

            // Use existing historical alerts (will be empty if user hasn't visited Previous Alerts tab)
            activityFeedState.historicalAlerts.forEach(function (alertData) {
                if (alertData.is_restored) {
                    var alertTimestamp = alertData.timestamp || alertData.created_at || 0;
                    if (alertTimestamp >= cutoffTime) {
                        alertsToProcess.push(alertData);
                        historicalCount++;
                    }
                }
            });

            // If no cached historical alerts, try loading them directly (only once)
            if (historicalCount === 0 && activityFeedState.historicalAlerts.length === 0) {
                console.log('No cached historical alerts available for condensed view. Loading from storage...');

                // Set flag to indicate we're loading for condensed view
                activityFeedState.loadingForCondensedView = true;

                // Try to load historical alerts using the same mechanism as Previous Alerts tab
                socket.emit('get_stored_alerts_paginated', { page: 1, limit: 25 });

                // Exit early since we're loading asynchronously
                return;
            } else {
                console.log('Condensed view showing', historicalCount, 'historical alerts from past', condenseHistoricalHours, 'hours');
            }

            // Continue with synchronous processing
            createCondensedViewWithData(alertsToProcess, historicalCount, condenseHistoricalHours);
        }

        function createCondensedViewWithData(alertsToProcess, historicalCount, condenseHistoricalHours) {

            // Group alerts by user and type, excluding hype train and point alerts
            var userAlerts = {};
            var excludedCount = 0;
            var unknownUsernameCount = 0;

            alertsToProcess.forEach(function (alertData) {
                var alertType = (alertData.type || '').toLowerCase();
                var badgeType = (alertData.badge_type || '').toLowerCase();

                // Exclude hype train and point alerts (channel point redemptions)
                if (alertType === 'hype train' || alertType === 'point' ||
                    badgeType === 'hype_train' || badgeType === 'point') {
                    excludedCount++;
                    console.log('Excluding', alertType + '/' + badgeType, 'alert from condensed view');
                    return;
                }

                // Get username from alert data, with fallback to message extraction
                var username = alertData.username;
                if (!username) {
                    username = extractUsernameFromMessage(alertData.message || '');
                }

                if (!username || username === 'Unknown') {
                    unknownUsernameCount++;
                    console.log('Skipping alert with unknown username:', alertData.message, '(alert_id:', alertData.alert_id || 'N/A', ')');
                    return;
                }

                if (!userAlerts[username]) {
                    userAlerts[username] = {};
                }

                // Create specific grouping key based on alert type, tier, and duration
                var groupingKey = alertType;

                // For subs, resubs, and gift subs, include tier and duration information
                if (alertType === 'sub' || alertType === 'resub' || alertType === 'giftsub') {
                    var tier = alertData.tier || 1;
                    groupingKey = alertType + '_tier' + tier;

                    // For resubs and gift subs, also separate by duration
                    if (alertType === 'resub' || alertType === 'giftsub') {
                        // Get duration information
                        var durationMonths = 1;
                        var storedData = alertData.stored_alert_data || {};

                        if (storedData) {
                            // Try stored data first
                            durationMonths = (storedData.resub_month || storedData.months || storedData.total_months || 1);
                        } else {
                            // Fall back to message parsing
                            var message = alertData.message || '';
                            var monthMatch = message.match(/(\d+)\s*months?/i);
                            if (monthMatch) {
                                durationMonths = parseInt(monthMatch[1]);
                            }
                        }

                        // Create duration-specific key
                        if (durationMonths > 1) {
                            groupingKey = alertType + '_tier' + tier + '_multi_month';
                        } else {
                            groupingKey = alertType + '_tier' + tier + '_1month';
                        }
                    }
                }

                // Group by the specific key and accumulate data
                if (!userAlerts[username][groupingKey]) {
                    userAlerts[username][groupingKey] = {
                        count: 0,
                        totalAmount: 0,
                        tier: alertData.tier || 1,
                        months: 0,  // For resubs, track months
                        originalType: alertType  // Keep track of original alert type
                    };
                }

                userAlerts[username][groupingKey].count += 1;

                // Extract amounts based on alert type - prioritize stored_alert_data values over message parsing
                var message = alertData.message || '';
                var storedData = alertData.stored_alert_data || {};

                if (alertType === 'bit' || alertType === 'bits') {
                    // Try to get amount from stored data first
                    var amtCheered = storedData.amt_cheered;
                    if (amtCheered) {
                        userAlerts[username][groupingKey].totalAmount += parseInt(amtCheered);
                    } else {
                        // Fall back to message parsing
                        var bitMatch = message.match(/(\d+)\s*bits?/i);
                        if (bitMatch) {
                            userAlerts[username][groupingKey].totalAmount += parseInt(bitMatch[1]);
                        }
                    }
                } else if (alertType === 'donation') {
                    // Try to get amount from stored data first
                    var donationAmount = storedData.donation_amount;
                    if (donationAmount) {
                        userAlerts[username][groupingKey].totalAmount += parseFloat(donationAmount);
                    } else {
                        // Fall back to message parsing
                        var donationMatch = message.match(/donated\s+\$?(\d+(?:\.\d{2})?)/i);
                        if (donationMatch) {
                            userAlerts[username][groupingKey].totalAmount += parseFloat(donationMatch[1]);
                        }
                    }
                } else if (alertType === 'giftsub') {
                    // Try to get amount from stored data first
                    var giftQty = storedData.gift_qty;
                    if (giftQty) {
                        userAlerts[username][groupingKey].totalAmount += parseInt(giftQty);
                    } else {
                        // Fall back to message parsing
                        var giftMatch = message.match(/gifted\s+(\d+)/i);
                        if (giftMatch) {
                            userAlerts[username][groupingKey].totalAmount += parseInt(giftMatch[1]);
                        }
                    }
                } else if (alertType === 'resub') {
                    // For resubs, get the month count
                    var resubMonth = storedData.resub_month || storedData.months || storedData.total_months;
                    var months;
                    if (resubMonth) {
                        months = parseInt(resubMonth);
                    } else {
                        // Fall back to message parsing
                        var monthMatch = message.match(/(\d+)\s*months?/i);
                        if (monthMatch) {
                            months = parseInt(monthMatch[1]);
                        } else {
                            months = 1;
                        }
                    }
                    // Keep the highest month count for this user
                    if (months > userAlerts[username][groupingKey].months) {
                        userAlerts[username][groupingKey].months = months;
                    }
                } else if (alertType === 'raid') {
                    // Try to get viewers from stored data first
                    var raiderCount = storedData.raider_count;
                    var viewers;
                    if (raiderCount) {
                        viewers = parseInt(raiderCount);
                    } else {
                        // Fall back to message parsing
                        var raidMatch = message.match(/(\d+)\s*viewers?/i);
                        if (raidMatch) {
                            viewers = parseInt(raidMatch[1]);
                        } else {
                            viewers = 0;
                        }
                    }
                    // Keep the largest raid for this user
                    var raidGame = alertData.game_name;
                    if (!raidGame && storedData) {
                        raidGame = storedData.game_name;
                    }
                    if (viewers > userAlerts[username][groupingKey].totalAmount) {
                        userAlerts[username][groupingKey].totalAmount = viewers;
                        if (raidGame) {
                            userAlerts[username][groupingKey].gameName = raidGame;
                        }
                    }
                } else if (alertType === 'streak') {
                    var streakCountVal = alertData.streak_count;
                    if (streakCountVal == null && storedData) {
                        streakCountVal = storedData.streak_count;
                    }
                    var sc;
                    if (streakCountVal != null) {
                        sc = parseInt(streakCountVal, 10);
                    } else {
                        var streakMatch = message.match(/(\d+)\s*consecutive streams/i);
                        sc = streakMatch ? parseInt(streakMatch[1], 10) : 0;
                    }
                    if (sc > userAlerts[username][groupingKey].totalAmount) {
                        userAlerts[username][groupingKey].totalAmount = sc;
                    }
                }
            });

            // Debug summary
            console.log('Condensed view processing complete:');
            console.log('  - Processed', alertsToProcess.length, 'total alerts');
            console.log('  - Excluded', excludedCount, 'hype train/point alerts');
            console.log('  - Skipped', unknownUsernameCount, 'alerts with unknown usernames');
            console.log('  - Final result:', Object.keys(userAlerts).length, 'users with alerts');

            // Clear and rebuild condensed view
            condensedViewContainer.innerHTML = '';

            if (Object.keys(userAlerts).length === 0) {
                // If no alerts to condense, show nothing (just clear the container)
                condensedViewContainer.innerHTML = '';
            } else {
                // Add indicator showing historical alerts are being used
                if (historicalCount > 0) {
                    var indicator = document.createElement('div');
                    indicator.className = 'text-xs text-muted mb-2 italic';
                    indicator.textContent = 'Showing ' + historicalCount + ' historical alerts from past ' + condenseHistoricalHours + ' hours';
                    condensedViewContainer.appendChild(indicator);
                }

                for (var username in userAlerts) {
                    if (Object.keys(userAlerts[username]).length > 0) {
                        var userGroup = document.createElement('div');
                        userGroup.className = 'user-group';

                        var usernameDiv = document.createElement('div');
                        usernameDiv.className = 'username';
                        usernameDiv.textContent = username + ':';
                        userGroup.appendChild(usernameDiv);

                        for (var groupingKey in userAlerts[username]) {
                            var data = userAlerts[username][groupingKey];
                            var aggregatedText = createAggregatedAlertText(groupingKey, data);
                            if (aggregatedText) {
                                var alertItem = document.createElement('div');
                                alertItem.className = 'alert-item';
                                alertItem.textContent = aggregatedText;
                                userGroup.appendChild(alertItem);
                            }
                        }

                        condensedViewContainer.appendChild(userGroup);
                    }
                }
            }
        }

        function createAggregatedAlertText(groupingKey, data) {
            var count = data.count;
            var totalAmount = data.totalAmount;
            var tier = data.tier;
            var months = data.months;
            var originalType = data.originalType || groupingKey.split('_')[0];

            try {
                // Handle tier and duration-specific keys for subs, resubs, and giftsubs
                if (groupingKey.startsWith('sub_tier')) {
                    var tierNum = tier;
                    if (count > 1) {
                        return 'Subscribed ' + count + ' times (Tier ' + tierNum + ')!';
                    } else {
                        return 'Subscribed (Tier ' + tierNum + ')!';
                    }
                } else if (groupingKey.startsWith('resub_tier') && groupingKey.includes('_1month')) {
                    var tierNum = tier;
                    if (count > 1) {
                        return 'Resubscribed ' + count + ' times for 1 month (Tier ' + tierNum + ')!';
                    } else {
                        return 'Resubscribed for 1 month (Tier ' + tierNum + ')!';
                    }
                } else if (groupingKey.startsWith('resub_tier') && groupingKey.includes('_multi_month')) {
                    var tierNum = tier;
                    if (count > 1) {
                        return 'Resubscribed ' + count + ' times for ' + months + ' months (Tier ' + tierNum + ')!';
                    } else {
                        return 'Resubscribed for ' + months + ' months (Tier ' + tierNum + ')!';
                    }
                } else if (groupingKey.startsWith('giftsub_tier') && groupingKey.includes('_1month')) {
                    var tierNum = tier;
                    // Format with commas for readability
                    var formattedAmount = totalAmount.toLocaleString();
                    return 'Gifted ' + formattedAmount + ' Tier ' + tierNum + ' subs (1 month)!';
                } else if (groupingKey.startsWith('giftsub_tier') && groupingKey.includes('_multi_month')) {
                    var tierNum = tier;
                    // Format with commas for readability
                    var formattedAmount = totalAmount.toLocaleString();
                    return 'Gifted ' + formattedAmount + ' Tier ' + tierNum + ' subs (' + months + ' months)!';
                } else if (groupingKey === 'follow') {
                    if (count > 1) {
                        return 'Followed ' + count + ' times!';
                    } else {
                        return 'Followed!';
                    }
                } else if (groupingKey === 'bits') {
                    // Format with commas for readability
                    var formattedAmount = totalAmount.toLocaleString();
                    return 'Gave ' + formattedAmount + ' bits!';
                } else if (groupingKey === 'donation') {
                    // Format donation amount
                    var formattedAmount;
                    if (totalAmount === Math.floor(totalAmount)) {
                        formattedAmount = '$' + Math.floor(totalAmount);
                    } else {
                        formattedAmount = '$' + totalAmount.toFixed(2);
                    }
                    return 'Donated ' + formattedAmount + '!';
                } else if (groupingKey === 'raid') {
                    // For raids, show the largest raid
                    var formattedViewers = totalAmount.toLocaleString();
                    var suffix = raidCategorySuffix(data.gameName);
                    if (count > 1) {
                        return 'Raided ' + count + ' times (largest: ' + formattedViewers + ' viewers)' + suffix;
                    }
                    return 'Raided with ' + formattedViewers + ' viewers' + suffix;
                } else if (groupingKey === 'streak') {
                    var streakTotal = parseInt(totalAmount, 10);
                    if (isNaN(streakTotal) || streakTotal < 1) {
                        return 'Watch streak!';
                    }
                    return formatWatchStreakMessage('', streakTotal, false);
                } else {
                    // Fallback for any other alert types
                    var displayName = groupingKey.replace(/_/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); });
                    if (count > 1) {
                        return displayName + ' ' + count + ' times!';
                    } else {
                        return displayName + '!';
                    }
                }
            } catch (error) {
                console.error('Error creating aggregated alert text:', error);
                return groupingKey.charAt(0).toUpperCase() + groupingKey.slice(1) + '!';
            }
        }

        function createCondensedAlertText(alertData) {
            var alertType = (alertData.type || '').toLowerCase();
            var message = alertData.message || '';

            try {
                if (alertType === 'follow') {
                    return 'Followed!';
                } else if (alertType === 'sub') {
                    var tier = alertData.tier || 1;
                    return 'Subscribed (Tier ' + tier + ')!';
                } else if (alertType === 'resub') {
                    // Extract months from message
                    var monthMatch = message.match(/(\d+)\s*months?/i);
                    var months = monthMatch ? monthMatch[1] : '?';
                    return 'Resubscribed for ' + months + ' months!';
                } else if (alertType === 'giftsub') {
                    // Extract gift quantity from message
                    var giftMatch = message.match(/gifted\s+(\d+)/i);
                    var qty = giftMatch ? giftMatch[1] : '1';
                    return 'Gifted ' + qty + ' subs!';
                } else if (alertType === 'bits') {
                    // Extract bit amount from message
                    var bitMatch = message.match(/(\d+)\s*bits?/i);
                    var amount = bitMatch ? bitMatch[1] : '?';
                    // Format with commas for readability
                    try {
                        var amountInt = parseInt(amount);
                        amount = amountInt.toLocaleString();
                    } catch (e) {
                        // Keep original amount if parsing fails
                    }
                    return 'Gave ' + amount + ' bits!';
                } else if (alertType === 'donation') {
                    // Extract donation amount from message
                    var donationMatch = message.match(/donated\s+\$?(\d+(?:\.\d{2})?)/i);
                    var amount = donationMatch ? donationMatch[1] : '?';
                    return 'Donated $' + amount + '!';
                } else if (alertType === 'raid') {
                    var storedData = alertData.stored_alert_data || {};
                    var raiderCount = alertData.raider_count != null ? alertData.raider_count : storedData.raider_count;
                    var gameName = resolveRaidGameName(alertData);
                    var viewers;
                    if (raiderCount != null) {
                        viewers = parseInt(raiderCount, 10).toLocaleString();
                    } else {
                        var raidMatch = message.match(/(\d+)\s*viewers?/i);
                        viewers = raidMatch ? raidMatch[1] : '?';
                        try {
                            viewers = parseInt(viewers, 10).toLocaleString();
                        } catch (e) {
                            // Keep original viewers if parsing fails
                        }
                    }
                    return 'Raided with ' + viewers + ' viewers' + raidCategorySuffix(gameName);
                } else {
                    return alertType.charAt(0).toUpperCase() + alertType.slice(1) + '!';
                }
            } catch (error) {
                console.error('Error creating condensed alert text:', error);
                return (alertData.type || 'Alert') + '!';
            }
        }

        function toggleCondenseList() {
            activityFeedState.condenseList = condenseToggle.checked;

            if (activityFeedState.currentTab === "current") {
                if (activityFeedState.condenseList) {
                    // Hide regular alerts and show condensed view
                    currentAlertsFeed.classList.add('hidden');
                    condensedViewContainer.classList.remove('hidden');
                    updateCondensedView();
                } else {
                    // Show regular alerts and hide condensed view
                    currentAlertsFeed.classList.remove('hidden');
                    condensedViewContainer.classList.add('hidden');
                }
            }
        }

        // Event handlers
        pauseBtn.onclick = togglePause;
        muteBtn.onclick = toggleMute;
        currentTabBtn.onclick = function () { switchToTab("current"); };
        previousTabBtn.onclick = function () { switchToTab("previous"); };
        condenseToggle.onchange = toggleCondenseList;

        // Filter dropdown handling
        var filterDropdownVisible = false;

        filterBtn.onclick = function (e) {
            e.stopPropagation();
            filterDropdownVisible = !filterDropdownVisible;
            if (filterDropdownVisible) {
                filterDropdown.classList.remove('hidden');
                filterDropdown.classList.add('filter-dropdown-visible');
            } else {
                filterDropdown.classList.remove('filter-dropdown-visible');
                filterDropdown.classList.add('hidden');
            }
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', function (e) {
            if (!filterDropdown.contains(e.target) && !filterBtn.contains(e.target)) {
                filterDropdownVisible = false;
                filterDropdown.classList.remove('filter-dropdown-visible');
                filterDropdown.classList.add('hidden');
            }
        });

        // Filter checkbox handling
        function setupFilterCheckboxes() {
            var checkboxes = filterDropdown.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(function (checkbox) {
                checkbox.addEventListener('change', function (e) {
                    e.stopPropagation();
                    var key = this.id.replace('filter-', '');
                    activityFeedState.filterState[key] = this.checked;

                    // Handle "All Events" logic
                    if (key === 'all' && this.checked) {
                        // Enable all filters
                        Object.keys(activityFeedState.filterState).forEach(function (k) {
                            activityFeedState.filterState[k] = true;
                        });
                        checkboxes.forEach(function (cb) {
                            cb.checked = true;
                        });
                    } else if (key === 'all' && !this.checked) {
                        // Keep individual filter states
                    } else if (key !== 'all') {
                        // Check if all individual filters are checked
                        var allOthersChecked = Object.keys(activityFeedState.filterState)
                            .filter(function (k) { return k !== 'all' && k !== key; })
                            .every(function (k) { return activityFeedState.filterState[k]; });

                        if (this.checked && allOthersChecked) {
                            activityFeedState.filterState.all = true;
                            document.getElementById('filter-all').checked = true;
                        } else {
                            activityFeedState.filterState.all = false;
                            document.getElementById('filter-all').checked = false;
                        }
                    }

                    updateAlertVisibility();
                });
            });
        }

        // WebSocket event handlers
        socket.on('connect', function () {
            console.log('Connected to WebSocket');
            syncActivityFeedState();
        });

        // Theme update handler - applies theme CSS variables in real-time
        socket.on('theme_update', function (data) {
            if (data && data.css) {
                var style = document.getElementById('mycelian-theme-vars');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'mycelian-theme-vars';
                    document.head.insertBefore(style, document.head.firstChild);
                }
                style.textContent = data.css;
                console.log('Theme updated:', data.theme_name, '(' + data.theme_type + ')');
            }
        });

        socket.on('activity_feed_alert', function (alertData) {
            console.log('Received new alert:', alertData);
            addAlertToFeed(alertData);
        });

        socket.on('pause_status_update', function (data) {
            console.log('Activity feed received pause_status_update:', data);
            if (data && typeof data.paused === 'boolean') {
                activityFeedState.pauseStatus = data.paused;
                updatePauseButton();
            }
        });

        // Also listen for other pause-related events for better compatibility
        socket.on('alerts_paused', function (data) {
            console.log('Activity feed received alerts_paused event:', data);
            var paused = data && typeof data.paused === 'boolean' ? data.paused : true;
            activityFeedState.pauseStatus = paused;
            updatePauseButton();
        });

        socket.on('alerts_resumed', function (data) {
            console.log('Activity feed received alerts_resumed event:', data);
            var paused = data && typeof data.paused === 'boolean' ? data.paused : false;
            activityFeedState.pauseStatus = paused;
            updatePauseButton();
        });

        socket.on('mute_status_update', function (data) {
            console.log('Activity feed received mute_status_update:', data);
            if (data && typeof data.muted === 'boolean') {
                activityFeedState.muteStatus = data.muted;
                updateMuteButton();
            }
        });

        // Function to update pause button state
        var pauseBorderBreathFrame = null;

        function stopPauseBorderBreathing() {
            if (pauseBorderBreathFrame !== null) {
                cancelAnimationFrame(pauseBorderBreathFrame);
                pauseBorderBreathFrame = null;
            }
            pauseBtn.style.boxShadow = '';
        }

        function startPauseBorderBreathing() {
            stopPauseBorderBreathing();
            var breathStart = null;
            function step(ts) {
                if (!pauseBtn.classList.contains('alerts-playing')) {
                    return;
                }
                if (breathStart === null) {
                    breathStart = ts;
                }
                var phase = ((ts - breathStart) % 3000) / 3000;
                var alpha = 0.2 + 0.8 * (0.5 - 0.5 * Math.cos(phase * Math.PI * 2));
                pauseBtn.style.boxShadow = 'inset 0 0 0 1px rgba(34, 197, 94, ' + alpha.toFixed(3) + ')';
                pauseBorderBreathFrame = requestAnimationFrame(step);
            }
            pauseBorderBreathFrame = requestAnimationFrame(step);
        }

        function updatePauseButton() {
            console.log('Updating pause button state. Paused:', activityFeedState.pauseStatus);
            if (activityFeedState.pauseStatus) {
                pauseBtn.innerHTML = '<i class="material-icons">play_arrow</i><span>RESUME ALERTS</span>';
                pauseBtn.classList.add('paused');
                pauseBtn.classList.remove('alerts-playing');
                stopPauseBorderBreathing();
            } else {
                pauseBtn.innerHTML = '<i class="material-icons">pause</i><span>PAUSE ALERTS</span>';
                pauseBtn.classList.remove('paused');
                pauseBtn.classList.add('alerts-playing');
                startPauseBorderBreathing();
            }
        }

        updatePauseButton();

        function updateMuteButton() {
            if (activityFeedState.muteStatus) {
                muteBtn.classList.add('muted');
            } else {
                muteBtn.classList.remove('muted');
            }
        }

        updateMuteButton();

        // New socket listener specifically for condensed view alerts
        socket.on('condensed_view_alerts', function (data) {
            console.log('Received condensed view alerts:', data);

            var alertsToProcess = data.alerts || [];
            var historicalCount = data.historical_count || alertsToProcess.length;
            var condenseHistoricalHours = data.hours || 12;

            console.log('Condensed view loaded', historicalCount, 'alerts from storage (past', condenseHistoricalHours, 'hours)');

            // Create condensed view with loaded data
            createCondensedViewWithData(alertsToProcess, historicalCount, condenseHistoricalHours);
        });

        socket.on('stored_alerts_paginated', function (data) {
            console.log('Received stored alerts:', data);

            // Check if this was requested for condensed view (fallback for older implementations)
            if (activityFeedState.loadingForCondensedView) {
                console.log('Processing stored alerts for condensed view (fallback)');
                activityFeedState.loadingForCondensedView = false;

                // Get template configuration for condensed view settings
                var config = window.templateConfig || {};
                var condenseHistoricalHours = config.condense_historical_hours || 12;

                // Filter alerts by time window and prepare for condensed view
                var alertsToProcess = [];
                var historicalCount = 0;

                if (data.alerts && data.alerts.length > 0) {
                    var currentTime = Date.now() / 1000;
                    var cutoffTime = currentTime - (condenseHistoricalHours * 3600);

                    data.alerts.forEach(function (alertData) {
                        alertData.is_restored = true;
                        var alertTimestamp = alertData.timestamp || alertData.created_at || 0;
                        if (alertTimestamp >= cutoffTime) {
                            alertsToProcess.push(alertData);
                            historicalCount++;
                        }
                    });

                    console.log('Loaded', historicalCount, 'historical alerts from storage for condensed view (fallback)');
                } else {
                    console.log('No historical alerts found in storage for condensed view (fallback)');
                }

                // Create condensed view with loaded data
                createCondensedViewWithData(alertsToProcess, historicalCount, condenseHistoricalHours);
                return;
            }

            // Normal processing for Previous Alerts tab
            // Clear existing restored alerts for all pages to ensure pagination works correctly
            clearRestoredAlertsForPagination();

            // Update pagination state
            activityFeedState.currentPage = data.page;
            activityFeedState.totalPages = data.total_pages;

            // Add restored alerts to historical alerts list
            if (data.alerts && data.alerts.length > 0) {
                console.log('Adding', data.alerts.length, 'alerts to page', data.page);
                data.alerts.forEach(function (alertData) {
                    alertData.is_restored = true;
                    var alertElement = createAlertElement(alertData);
                    alertElement.setAttribute('data-restored', 'true'); // Mark for easier identification
                    previousAlertsFeed.appendChild(alertElement);
                    activityFeedState.historicalAlerts.push(alertData);
                });

                // Apply filters to the newly loaded historical alerts
                updateAlertVisibility();
            } else {
                // If no stored alerts for this page, show appropriate message
                previousAlertsFeed.innerHTML = '<div class="no-alerts">No alerts found for this page</div>';
            }

            // Update pagination UI
            updatePaginationUI({
                page: data.page,
                total_pages: data.total_pages,
                total_count: data.total_count,
                has_prev: data.has_prev,
                has_next: data.has_next
            });

            activityFeedState.restoredAlertsLoaded = true;
        });

        // Intersection Observer for animation performance optimization
        var animationObserver = null;

        function initializeAnimationObserver() {
            // Clean up existing observer
            if (animationObserver) {
                animationObserver.disconnect();
            }

            // Create new observer with optimized settings
            animationObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    var element = entry.target;

                    if (entry.isIntersecting) {
                        // Element is visible - resume animations
                        element.classList.remove('not-visible');
                    } else {
                        // Element is not visible - pause animations
                        element.classList.add('not-visible');
                    }
                });
            }, {
                // Only trigger when element is completely out of view or comes into view
                threshold: [0, 0.1],
                // Add some margin to avoid too frequent triggers
                rootMargin: '50px'
            });

            // Observe all animated elements
            observeAnimatedElements();
        }

        function observeAnimatedElements() {
            if (!animationObserver) return;

            // Find all elements with animations
            var animatedElements = document.querySelectorAll('.alert-card.recent, .new-badge, .badge');

            animatedElements.forEach(function (element) {
                animationObserver.observe(element);
            });
        }

        // Initialize
        function initialize() {
            setupFilterCheckboxes();

            // Initialize animation observer for performance
            initializeAnimationObserver();

            // Start timestamp update timer
            setInterval(updateTimestamps, 1000);

            // Hide pagination initially (only show for previous alerts tab)
            paginationContainer.style.display = 'none';

            // Show condense toggle on current alerts tab
            condenseToggleContainer.style.display = 'flex';

            // Hide condensed view initially
            condensedViewContainer.classList.add('hidden');

            // Clear loading message
            currentAlertsFeed.innerHTML = '<div class="no-alerts">No alerts yet</div>';
        }

        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>
