<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mycelian Activity Feed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
    <script src="/assets/default_assets/overlay_recovery.js"></script>
    <script src="/assets/default_assets/template_logger.js"></script>
    <script src="/assets/default_assets/mycelian_toast.js"></script>
    <script>MycelianLog.init({ templateName: 'activity_feed' });</script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/assets/default_assets/activity_feed.css">
    <script src="/assets/default_assets/activity_feed.js"></script>
    <style>
        /* Dock page frame only; the feed look comes from activity_feed.css and the
           settings in Mycelian (Settings > App Settings > Activity Feed). */
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            overflow: hidden;
            background: var(--color-bg-base, #0a0a0a);
            color: var(--color-text-primary, #fff);
        }
        #feedHost, #feedMount { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    </style>
</head>

<body>
    <div id="feedHost" class="afx-host afx-dock-host">
        <div id="feedMount" class="afx-mount"></div>
    </div>

    <script>
        (function () {
            var appliedViewRevision = null;
            var lastPersonAt = 0;
            var personWatch = null;
            var historyWatch = null;

            function socketReady() {
                return typeof socket !== 'undefined' && socket && socket.connected;
            }

            /* Pop-ups use the app's shared design and level settings. Errors are also sent to the
               app's notification centre; everything else stays in the dock. */
            function dockNotify(level, title, message, opts) {
                opts = opts || {};
                if (level === 'error' && socketReady()) {
                    socket.emit('dock_notify', { source: 'activity_feed', level: 'error', title: title, message: message, hint: opts.hint || '' });
                }
                if (!window.MycelianToast) { console.log('[' + level + '] ' + title + ' ' + (message || '')); return null; }
                opts.source = 'Activity Feed';
                return MycelianToast.local(level, title, message, opts);
            }
            if (window.MycelianToast) { MycelianToast.configure({ dock: true }); }

            function notConnected(action) {
                dockNotify('error', "Couldn't " + action, 'The dock has lost its connection to Mycelian.',
                    { hint: 'Make sure Mycelian is running. The dock reconnects on its own; right-click the dock and choose Refresh if it doesn\'t.' });
            }

            var REPLAY_REASONS = {
                not_found: "Its saved details were cleaned up or couldn't be read.",
                no_config: "There's no alert set up for this kind of event any more.",
                missing_id: 'It was saved without the details needed to play it again.',
                forbidden: 'Only this computer can replay alerts.'
            };

            function emitView(patch) {
                if (!socketReady()) { notConnected('change the feed'); return; }
                socket.emit('set_activity_feed_view', patch);
            }

            function watchPerson() {
                // The app pushes new groups after every change; ask directly if nothing came.
                var asked = Date.now();
                if (personWatch) { clearTimeout(personWatch); }
                personWatch = setTimeout(function () {
                    personWatch = null;
                    if (feed.mode() === 'person' && lastPersonAt < asked && socketReady()) {
                        socket.emit('get_condensed_view_alerts', { filters: feed.s.view.filters, search: feed.s.view.search || '' });
                    }
                }, 3000);
            }

            function watchHistory(page) {
                if (historyWatch) { clearTimeout(historyWatch); }
                historyWatch = setTimeout(function () {
                    historyWatch = null;
                    if (feed.mode() === 'history' && feed.s.history.loading && socketReady()) {
                        socket.emit('get_stored_alerts_paginated', { page: page || feed.s.view.page || 1 });
                    }
                }, 2500);
            }

            function send(action, p) {
                p = p || {};
                if (action === 'settings') {
                    dockNotify('info', 'Feed look lives in Mycelian', 'Settings → App Settings → Activity Feed. Changes show here straight away.', {
                        actions: [{ label: 'Open in Mycelian', icon: 'open_in_new', run: function () { if (socketReady()) { socket.emit('activity_feed_open_settings', {}); } } }]
                    });
                    return;
                }
                if (!socketReady()) { notConnected(action === 'replay' ? 'replay the alert' : 'do that'); return; }
                if (action === 'pause') {
                    socket.emit('set_pause_status', { paused: !!p.paused }, function (r) {
                        if (r && r.success === false) { dockNotify('error', p.paused ? "Couldn't pause alerts" : "Couldn't resume alerts", r.error || ''); }
                    });
                } else if (action === 'mute') {
                    socket.emit('set_mute_status', { muted: !!p.muted }, function (r) {
                        if (r && r.success === false) { dockNotify('error', p.muted ? "Couldn't mute alerts" : "Couldn't unmute alerts", r.error || ''); }
                    });
                } else if (action === 'skip') {
                    socket.emit('activity_feed_skip_alert', p.alert_id ? { alert_id: p.alert_id } : { type: 'current' }, function (r) {
                        if (!r) { return; }
                        if (r.reason === 'not_playing') { dockNotify('info', 'Nothing was skipped', p.alert_id ? "That alert isn't playing any more." : 'No alert is playing.'); }
                        else if (r.reason === 'removed_from_queue') { dockNotify('success', 'Removed from the queue', ''); }
                        else if (r.ok === false && r.reason !== 'double_press') { dockNotify('error', "Couldn't skip the alert", r.reason || ''); }
                    });
                } else if (action === 'replay') {
                    if (!p.alert_id) { dockNotify('warning', "This alert can't be replayed", REPLAY_REASONS.missing_id); return; }
                    socket.emit('activity_feed_replay_alert', { alert_id: p.alert_id }, function (r) {
                        var ok = r && (r.ok || r.success);
                        if (ok) {
                            dockNotify('success', 'Replaying ' + (p.label || 'the alert') + (p.user ? ' for ' + p.user : ''), feed.s.queue.paused ? 'Alerts are paused: it plays when you resume.' : '');
                        } else {
                            var reason = r && (r.reason || r.error);
                            dockNotify(REPLAY_REASONS[reason] ? 'warning' : 'error', "This alert can't be replayed", REPLAY_REASONS[reason] || (reason || 'Mycelian didn\'t say why.'));
                        }
                    });
                } else if (action === 'mode') {
                    var patch = p.mode === 'history' ? { mode: 'history', tab: 'previous', page: 1 }
                        : (p.mode === 'person' ? { mode: 'person', tab: 'current', condensed: true } : { mode: 'live', tab: 'current', condensed: false });
                    emitView(patch);
                    if (p.mode === 'person') { watchPerson(); }
                    if (p.mode === 'history') { watchHistory(1); }
                } else if (action === 'filter') {
                    var f = {}; f[p.key] = !!p.value;
                    emitView({ filters: f });
                    if (feed.mode() === 'person') { watchPerson(); }
                } else if (action === 'search') {
                    emitView({ search: p.text || '' });
                    if (feed.mode() === 'person') { watchPerson(); }
                } else if (action === 'page') {
                    emitView({ page: p.page });
                    watchHistory(p.page);
                }
            }

            var feed = MycelianFeed.create(document.getElementById('feedMount'), { dock: true, send: send });
            window.mycelianDockFeed = feed;

            function syncActivityFeedState() {
                appliedViewRevision = null;
                setTimeout(function () {
                    socket.emit('get_pause_status');
                    socket.emit('get_mute_status');
                    socket.emit('get_current_theme');
                    socket.emit('get_notify_settings');
                    socket.emit('get_activity_feed_settings');
                    socket.emit('get_activity_feed_view');
                    socket.emit('get_alert_queue_state');
                }, 150);
            }

            var socket = MycelianOverlay.connect('http://' + document.domain + ':' + location.port, {
                onRecovery: syncActivityFeedState
            });

            socket.on('connect', function () {
                feed.set('meta', { connected: true });
                syncActivityFeedState();
            });
            socket.on('disconnect', function () { feed.set('meta', { connected: false }); });

            socket.on('notify_settings', function (settings) {
                if (window.MycelianToast && settings) { MycelianToast.configure(Object.assign({}, settings, { dock: true })); }
            });

            // Theme update handler - applies theme CSS variables in real-time
            socket.on('theme_update', function (data) {
                if (data && data.css) {
                    var style = document.getElementById('mycelian-theme-vars');
                    if (!style) {
                        style = document.createElement('style');
                        style.id = 'mycelian-theme-vars';
                        document.head.insertBefore(style, document.head.firstChild);
                    }
                    style.textContent = data.css;
                }
            });

            socket.on('activity_feed_settings', function (data) {
                feed.set('settings', data && (data.settings || data));
            });

            socket.on('activity_feed_view', function (data) {
                if (!data || data.success === false || data.revision === undefined || data.revision === null) { return; }
                var revision = Number(data.revision);
                if (isNaN(revision)) { return; }
                if (appliedViewRevision !== null && revision <= appliedViewRevision && !data.live_alerts) { return; }
                appliedViewRevision = Math.max(revision, appliedViewRevision || 0);
                var before = feed.mode();
                feed.set('view', data, { defer: true });
                if (data.live_alerts) { feed.set('live', data.live_alerts, { defer: true }); }
                feed.renderAll();
                if (feed.mode() === 'person' && before !== 'person') { watchPerson(); }
                if (feed.mode() === 'history' && before !== 'history') { watchHistory(data.page); }
            });

            socket.on('activity_feed_alert', function (alertData) {
                feed.set('add', alertData);
            });

            socket.on('stored_alerts_paginated', function (data) {
                data = data || {};
                feed.set('history', {
                    rows: data.alerts || [], page: data.page, total_pages: data.total_pages, total_count: data.total_count,
                    has_prev: data.has_prev, has_next: data.has_next, loading: false, error: data.success === false ? (data.error || 'failed') : ''
                });
            });

            socket.on('condensed_view_alerts', function (data) {
                lastPersonAt = Date.now();
                var local = feed.s.view.search || '';
                if (data && typeof data.search === 'string' && data.search !== local && feed.mode() === 'person') {
                    watchPerson();
                    return;  // built for an older search; the matching one is on its way
                }
                feed.set('person', data);
            });

            socket.on('alert_queue_state', function (state) { feed.set('queue', state); });
            socket.on('pause_status_update', function (d) { if (d && typeof d.paused === 'boolean') { feed.set('flags', { paused: d.paused }); } });
            socket.on('alerts_paused', function (d) { feed.set('flags', { paused: d && typeof d.paused === 'boolean' ? d.paused : true }); });
            socket.on('alerts_resumed', function (d) { feed.set('flags', { paused: d && typeof d.paused === 'boolean' ? d.paused : false }); });
            socket.on('mute_status_update', function (d) { if (d && typeof d.muted === 'boolean') { feed.set('flags', { muted: d.muted }); } });
        })();
    </script>
</body>

</html>
